<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focyl — Board</title>
  <meta name="theme-color" content="#070914">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       THEME – 3D / RADIANT
       ============================================================ */
    :root {
      --void: #070914;
      --ink: #0d1224;
      --ink-2: #121a34;
      --line: rgba(237,239,247,0.09);
      --paper: #EDEFF7;
      --mist: #9AA4C7;
      --cyan: #35D8F0;
      --violet: #8B7CF6;
      --magenta: #EA4FC9;
      --grad: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--magenta));
      --glow: 0 0 40px rgba(139,124,246,0.3);
      --display: 'Space Grotesk', sans-serif;
      --body: 'Sora', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--void);
      color: var(--paper);
      font-family: var(--body);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body::before, body::after {
      content: "";
      position: fixed;
      width: 60vmax; height: 60vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.14;
      pointer-events: none;
      z-index: 0;
    }
    body::before { top: -20vmax; left: -15vmax; background: var(--cyan); }
    body::after { bottom: -25vmax; right: -20vmax; background: var(--magenta); }

    /* Topbar */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: rgba(7,9,20,0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
    }
    .topbar .back {
      background: transparent; border: none;
      color: var(--mist); font-size: 0.85rem; cursor: pointer;
      font-family: inherit;
    }
    .topbar .title {
      font-family: var(--display); font-weight: 600; font-size: 1rem;
      background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .topbar .status {
      font-family: var(--mono); font-size: 0.68rem; color: var(--mist);
    }

    /* Canvas */
    .canvas-wrap {
      position: absolute; inset: 0; top: 60px; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .canvas {
      position: relative;
      background-image: radial-gradient(rgba(237,239,247,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      transition: width 0.3s, height 0.3s;
    }
    .canvas::before, .canvas::after {
      content: ""; position: absolute; width: 600px; height: 600px;
      border-radius: 50%; filter: blur(150px); opacity: 0.08; pointer-events: none;
    }
    .canvas::before { top: -200px; left: -200px; background: var(--cyan); }
    .canvas::after { bottom: -200px; right: -200px; background: var(--magenta); }

    /* Tiles – 3D depth */
    .tile {
      position: absolute; border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 14px 30px -16px rgba(0,0,0,0.7), var(--glow);
      touch-action: none; cursor: grab; overflow: hidden;
      background-size: cover; background-position: center;
      background-color: var(--ink);
      transition: box-shadow 0.2s;
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging { z-index: 50; box-shadow: 0 24px 50px -18px rgba(0,0,0,0.85), 0 0 60px rgba(139,124,246,0.2); }

    /* Text tile – pure text, no background */
    .tile.text-tile {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    .tile.text-tile .text-content {
      outline: none;
      word-break: break-word;
      text-align: center;
      line-height: 1.2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile.text-tile .text-content:focus {
      outline: 2px solid var(--violet);
    }

    .tile .del {
      position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
      border-radius: 50%; background: rgba(7,9,20,0.6);
      border: 1px solid var(--line); color: var(--paper);
      font-family: var(--mono); font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 10;
    }
    .tile:hover .del, .tile.dragging .del { opacity: 1; }

    /* Audio tile */
    .tile.audio-tile {
      background: var(--ink-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px;
      cursor: pointer;
    }
    .tile.audio-tile .play-btn {
      font-size: 2rem; margin-bottom: 6px;
      filter: drop-shadow(0 0 10px rgba(53,216,240,0.3));
    }
    .tile.audio-tile .progress-bar {
      width: 80%; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden;
    }
    .tile.audio-tile .progress-bar .fill {
      height: 100%; width: 0%; background: var(--grad);
    }
    .tile.audio-tile .audio-label {
      font-size: 0.7rem; color: var(--mist); margin-top: 4px;
      max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Resize handle (for text tiles) */
    .resize-handle {
      position: absolute; bottom: 0; right: 0;
      width: 20px; height: 20px;
      cursor: nwse-resize;
      opacity: 0.4;
      background: radial-gradient(circle, var(--violet), transparent);
      border-radius: 50%;
      transform: translate(30%, 30%);
      pointer-events: auto;
      z-index: 5;
    }
    .tile.text-tile .resize-handle { opacity: 0.6; }
    .tile.text-tile:hover .resize-handle { opacity: 1; }

    /* FAB */
    .fab {
      position: fixed; right: 20px; bottom: 26px; z-index: 20;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--grad); border: none; cursor: pointer;
      box-shadow: 0 14px 30px -10px rgba(139,124,246,0.6), var(--glow);
      display: flex; align-items: center; justify-content: center;
    }
    .fab svg { width: 22px; height: 22px; stroke: #070914; stroke-width: 2.4; }

    /* Sheet */
    .scrim {
      position: fixed; inset: 0; background: rgba(7,9,20,0.6);
      z-index: 30; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--ink);
      border: 1px solid var(--line); border-bottom: none;
      border-radius: 22px 22px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      max-height: 75vh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 18px; }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 18px;
      background: var(--ink-2); border-radius: 100px; padding: 4px;
    }
    .tab {
      flex: 1; text-align: center; padding: 9px 0; border-radius: 100px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--mist);
      border: none; background: transparent; font-family: inherit;
    }
    .tab.active { background: var(--grad); color: #070914; }

    .panel { display: none; }
    .panel.active { display: block; }

    label {
      display: block; font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--mist);
      margin: 0 0 6px;
    }
    input, textarea, select {
      width: 100%; background: var(--ink-2); border: 1px solid var(--line);
      color: var(--paper); border-radius: 12px; padding: 12px 14px;
      font-family: var(--body); font-size: 0.95rem; margin-bottom: 12px;
      resize: none;
    }
    select { appearance: none; }
    .btn-primary {
      width: 100%; background: var(--grad); color: #070914; border: none;
      border-radius: 100px; padding: 13px 0; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-ghost {
      width: 100%; background: transparent; border: 1px dashed rgba(237,239,247,0.25);
      color: var(--paper); border-radius: 14px; padding: 13px 0; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; margin-bottom: 10px;
    }
    .hint { font-family: var(--mono); font-size: 0.75rem; color: var(--mist); margin: 0 0 12px; }
    .results {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 10px;
    }
    .results .thumb {
      aspect-ratio: 1/1; border-radius: 10px; background-size: cover; background-position: center;
      border: 1px solid var(--line); cursor: pointer; background-color: var(--ink-2);
    }
    input[type="file"] { display: none; }

    .font-size-control {
      display: flex; align-items: center; gap: 10px;
    }
    .font-size-control input[type="range"] {
      flex: 1; margin: 0;
    }
    .font-size-control span {
      font-family: var(--mono); font-size: 0.9rem; min-width: 40px;
    }

    .crop-row {
      display: flex; gap: 10px;
    }
    .crop-row input { flex: 1; }

    @media (max-width: 600px) {
      .sheet { padding: 16px; }
    }

    /* AI redesign button on image tiles */
    .tile .redesign-btn {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(7,9,20,0.7); border: 1px solid var(--violet); color: white;
      border-radius: 20px; padding: 4px 12px; font-size: 0.7rem;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 6; font-family: inherit;
    }
    .tile:hover .redesign-btn { opacity: 1; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="back" id="backBtn">← Focyl</button>
  <span class="title" id="boardTitle">My Board</span>
  <span class="status" id="statusText">Saved</span>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" aria-label="Add tile">
  <svg viewBox="0 0 24 24" fill="none" stroke="#070914" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- SHEET -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="tabs">
    <button class="tab active" id="tabPhoto">Photo</button>
    <button class="tab" id="tabWords">Words</button>
    <button class="tab" id="tabAudio">Audio</button>
    <button class="tab" id="tabSettings">Settings</button>
  </div>

  <!-- Photo Panel -->
  <div class="panel active" id="panelPhoto">
    <label for="photoQuery">Search free photos</label>
    <input type="text" id="photoQuery" placeholder="studio, mid thirties…">
    <button class="btn-primary" id="searchBtn">Search</button>
    <div class="results" id="results"></div>
    <p class="hint" id="photoHint"></p>
    <label>Or use your own</label>
    <button class="btn-ghost" id="uploadBtn">Upload from device (resized)</button>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- Words Panel -->
  <div class="panel" id="panelWords">
    <label for="quoteText">In your own words, future tense</label>
    <textarea id="quoteText" rows="2" placeholder="I run my own studio."></textarea>
    <div class="font-size-control">
      <label>Font size</label>
      <input type="range" id="textSizeSlider" min="12" max="120" value="32">
      <span id="textSizeDisplay">32px</span>
    </div>
    <label>Font family</label>
    <select id="fontFamilySelect">
      <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
      <option value="'Sora', sans-serif">Sora</option>
      <option value="'Inter', sans-serif">Inter</option>
      <option value="'Playfair Display', serif">Playfair Display</option>
      <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      <option value="'Georgia', serif">Georgia</option>
      <option value="'Arial', sans-serif">Arial</option>
    </select>
    <button class="btn-primary" id="addTextBtn">Add Text Tile</button>
  </div>

  <!-- Audio Panel -->
  <div class="panel" id="panelAudio">
    <label>Upload an MP3 from your device</label>
    <button class="btn-ghost" id="uploadAudioBtn">Choose MP3</button>
    <input type="file" id="audioInput" accept="audio/*">
    <p class="hint">Tap the tile to play/pause.</p>
  </div>

  <!-- Settings Panel -->
  <div class="panel" id="panelSettings">
    <label>Canvas Size (pixels)</label>
    <div class="crop-row">
      <input type="number" id="canvasWidth" value="1600" step="100" min="600">
      <input type="number" id="canvasHeight" value="1600" step="100" min="600">
    </div>
    <button class="btn-primary" id="resizeCanvasBtn">Resize Board</button>
    <hr style="border-color:var(--line);margin:16px 0;">
    <label>AI Redesign (image tiles)</label>
    <p class="hint">Click the ✨ button on any image tile.</p>
  </div>
</div>

<script>
  // ================================================================
  //  SUPABASE CONFIG – REPLACE WITH YOUR ACTUAL KEY
  // ================================================================
  const SUPABASE_URL = 'https://ufkgmldvclvkzvznsxbs.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // <-- PASTE YOUR KEY
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ================================================================
  //  API KEYS (Unsplash / Pexels / Hugging Face)
  //  – fill these with your free keys if you want real search & AI
  // ================================================================
  const TILE_CONFIG = {
    unsplashKey: '',   // get from unsplash.com/developers
    pexelsKey: '',     // get from pexels.com/api
    hfToken: '',       // get from huggingface.co/settings/tokens
    hfModel: 'stabilityai/stable-diffusion-2-1',
  };

  // ================================================================
  //  SESSION & STATE
  // ================================================================
  const session = JSON.parse(localStorage.getItem('focyl_user') || 'null');
  if (!session) {
    window.location.href = 'auth.html';
  }

  let board = null;      // board record { id, user_id, title, is_public, ... }
  let tiles = [];        // array of tile objects (full DB rows)
  let boardId = null;

  // DOM refs
  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvasWrap');
  const statusText = document.getElementById('statusText');
  function setStatus(t) { statusText.textContent = t; }

  // ================================================================
  //  LOAD BOARD & TILES
  // ================================================================
  async function loadBoard() {
    try {
      // 1. Get or create board for this user
      let { data: boardData, error: boardError } = await sb
        .from('boards')
        .select('*')
        .eq('user_id', session.id)
        .maybeSingle();

      if (boardError && boardError.code !== 'PGRST116') {
        console.error('Board fetch error:', boardError);
        return;
      }

      if (!boardData) {
        // Create a default board
        const { data: newBoard, error: createError } = await sb
          .from('boards')
          .insert([{ user_id: session.id, title: 'My Board', is_public: false }])
          .select()
          .single();
        if (createError) {
          console.error('Board create error:', createError);
          return;
        }
        boardData = newBoard;
      }

      board = boardData;
      boardId = board.id;
      document.getElementById('boardTitle').textContent = board.title;

      // 2. Load tiles for this board
      const { data: tileData, error: tileError } = await sb
        .from('tiles')
        .select('*')
        .eq('board_id', boardId)
        .order('z', { ascending: true });

      if (tileError) {
        console.error('Tile fetch error:', tileError);
        return;
      }
      tiles = tileData || [];

      // 3. Render
      renderAll();
      setStatus('Loaded');
    } catch (err) {
      console.error('Load error:', err);
    }
  }

  // ================================================================
  //  SAVE BOARD & TILES (overwrite all tiles)
  // ================================================================
  async function saveBoard() {
    if (!board) return;
    try {
      // Update board title
      await sb.from('boards').update({ title: board.title }).eq('id', boardId);

      // Delete all existing tiles for this board
      await sb.from('tiles').delete().eq('board_id', boardId);

      // Insert current tiles (if any)
      if (tiles.length > 0) {
        const tilesToInsert = tiles.map(t => ({
          board_id: boardId,
          type: t.type,
          source: t.source || 'library',
          content: t.content,
          x: t.x,
          y: t.y,
          w: t.w,
          h: t.h,
          z: t.z || 1,
        }));
        const { error: insertError } = await sb.from('tiles').insert(tilesToInsert);
        if (insertError) {
          console.error('Insert error:', insertError);
          // Optionally rollback? For simplicity, we just log.
        }
      }
      setStatus('Saved');
    } catch (err) {
      console.error('Save error:', err);
      setStatus('Error saving');
    }
  }

  // ================================================================
  //  RENDER ALL TILES
  // ================================================================
  function renderAll() {
    const w = board?.width || 1600;
    const h = board?.height || 1600;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.innerHTML = '';
    tiles.forEach(renderTile);
    // Center scroll
    canvasWrap.scrollLeft = w / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = h / 2 - canvasWrap.clientHeight / 2;
  }

  function renderTile(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.id = t.id;
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    el.style.width = t.w + 'px';
    el.style.height = t.h + 'px';

    // ----------------------------
    //  TYPE-SPECIFIC RENDERING
    // ----------------------------
    if (t.type === 'image') {
      el.style.backgroundImage = `url('${t.content.url}')`;
      el.style.backgroundSize = 'cover';
      // AI redesign button
      const aiBtn = document.createElement('button');
      aiBtn.className = 'redesign-btn';
      aiBtn.textContent = '✨ Redesign';
      aiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        redesignImageTile(t.id);
      });
      el.appendChild(aiBtn);
    } else if (t.type === 'text') {
      el.classList.add('text-tile');
      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = true;
      content.textContent = t.content.text || 'Edit me';
      content.style.fontFamily = t.content.fontFamily || "'Space Grotesk', sans-serif";
      content.style.fontSize = (t.content.fontSize || 32) + 'px';
      content.style.color = t.content.color || '#EDEFF7';
      content.addEventListener('input', () => {
        t.content.text = content.textContent;
        saveBoard();
      });
      el.appendChild(content);
      // Resize handle
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        startResize(e, el, t);
      });
      handle.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        startResize(e, el, t);
      });
      el.appendChild(handle);
    } else if (t.type === 'audio') {
      el.classList.add('audio-tile');
      const playBtn = document.createElement('div');
      playBtn.className = 'play-btn';
      playBtn.textContent = '▶';
      const progress = document.createElement('div');
      progress.className = 'progress-bar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      progress.appendChild(fill);
      const label = document.createElement('div');
      label.className = 'audio-label';
      label.textContent = t.content.name || 'Audio';
      el.appendChild(playBtn);
      el.appendChild(progress);
      el.appendChild(label);

      // Audio element (store in DOM for later control)
      const audio = document.createElement('audio');
      audio.src = t.content.url;
      audio.preload = 'metadata';
      let playing = false;

      const updateProgress = () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          fill.style.width = pct + '%';
        }
      };
      audio.addEventListener('timeupdate', updateProgress);

      el.addEventListener('click', () => {
        if (playing) {
          audio.pause();
          playBtn.textContent = '▶';
          playing = false;
        } else {
          audio.play();
          playBtn.textContent = '⏸';
          playing = true;
        }
      });
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        playing = false;
        fill.style.width = '0%';
      });
      el._audio = audio; // keep reference
    }

    // Delete button
    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      tiles = tiles.filter(x => x.id !== t.id);
      saveBoard();
      el.remove();
    });
    el.appendChild(del);

    // Make draggable
    makeDraggable(el, t.id);
    canvas.appendChild(el);
  }

  // ================================================================
  //  DRAG & RESIZE
  // ================================================================
  function makeDraggable(el, id) {
    let startX, startY, origLeft, origTop, dragging = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.del') || e.target.closest('.resize-handle') || e.target.closest('.redesign-btn')) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(el.style.left); origTop = parseFloat(el.style.top);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (origLeft + e.clientX - startX) + 'px';
      el.style.top = (origTop + e.clientY - startY) + 'px';
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
      const tile = tiles.find(t => t.id === id);
      if (tile) { tile.x = x; tile.y = y; saveBoard(); }
      setStatus('Saved');
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function startResize(e, el, tile) {
    const startX = e.clientX || e.touches[0].clientX;
    const startY = e.clientY || e.touches[0].clientY;
    const origW = parseFloat(el.style.width);
    const origH = parseFloat(el.style.height);

    const onMove = (ev) => {
      const cx = ev.clientX || ev.touches[0].clientX;
      const cy = ev.clientY || ev.touches[0].clientY;
      const dx = cx - startX;
      const dy = cy - startY;
      const newW = Math.max(60, origW + dx);
      const newH = Math.max(40, origH + dy);
      el.style.width = newW + 'px';
      el.style.height = newH + 'px';
      tile.w = newW;
      tile.h = newH;
    };
    const onEnd = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      saveBoard();
      setStatus('Saved');
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onEnd);
    e.preventDefault();
  }

  // ================================================================
  //  ADD TILE (client‑side)
  // ================================================================
  function addTile(partial) {
    const newTile = {
      id: crypto.randomUUID(), // temporary client ID; DB will generate its own on save
      board_id: boardId,
      x: canvasWrap.scrollLeft + 60,
      y: canvasWrap.scrollTop + 60,
      w: 160,
      h: 160,
      z: 1,
      source: 'library',
      ...partial
    };
    tiles.push(newTile);
    renderTile(newTile);
    saveBoard();
    setStatus('Added');
  }

  // ================================================================
  //  PHOTO SEARCH (Unsplash / Pexels)
  // ================================================================
  async function searchPhotos(query) {
    const hint = document.getElementById('photoHint');
    const results = document.getElementById('results');
    results.innerHTML = '';
    hint.textContent = '';

    if (TILE_CONFIG.unsplashKey) {
      const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=9&client_id=${TILE_CONFIG.unsplashKey}`);
      const data = await res.json();
      (data.results || []).forEach(p => addResultThumb(p.urls.small, p.urls.regular));
      return;
    }
    if (TILE_CONFIG.pexelsKey) {
      const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=9`, {
        headers: { Authorization: TILE_CONFIG.pexelsKey }
      });
      const data = await res.json();
      (data.photos || []).forEach(p => addResultThumb(p.src.medium, p.src.large));
      return;
    }
    hint.textContent = 'No photo API key set — add one in TILE_CONFIG.';
  }

  function addResultThumb(thumbUrl, fullUrl) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.backgroundImage = `url('${thumbUrl}')`;
    div.addEventListener('click', () => {
      addTile({ type: 'image', content: { url: fullUrl }, source: 'api' });
      closeSheet();
    });
    document.getElementById('results').appendChild(div);
  }

  // ================================================================
  //  UPLOAD & RESIZE (max 800px)
  // ================================================================
  document.getElementById('uploadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 800;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        addTile({ type: 'image', content: { url: dataUrl }, source: 'upload' });
        closeSheet();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // ================================================================
  //  TEXT TILE
  // ================================================================
  document.getElementById('addTextBtn').addEventListener('click', () => {
    const text = document.getElementById('quoteText').value.trim() || 'Your vision';
    const fontSize = parseInt(document.getElementById('textSizeSlider').value) || 32;
    const fontFamily = document.getElementById('fontFamilySelect').value;
    addTile({
      type: 'text',
      content: { text, fontSize, fontFamily, color: '#EDEFF7' },
      w: Math.max(120, text.length * 10),
      h: fontSize * 2 + 20,
    });
    closeSheet();
  });

  const slider = document.getElementById('textSizeSlider');
  const display = document.getElementById('textSizeDisplay');
  slider.addEventListener('input', () => display.textContent = slider.value + 'px');

  // ================================================================
  //  AUDIO TILE
  // ================================================================
  document.getElementById('uploadAudioBtn').addEventListener('click', () => document.getElementById('audioInput').click());
  document.getElementById('audioInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      addTile({
        type: 'audio',
        content: { url: dataUrl, name: file.name },
        w: 180,
        h: 120,
      });
      closeSheet();
    };
    reader.readAsDataURL(file);
  });

  // ================================================================
  //  BOARD CROPPING (resize canvas)
  // ================================================================
  document.getElementById('resizeCanvasBtn').addEventListener('click', () => {
    const w = parseInt(document.getElementById('canvasWidth').value);
    const h = parseInt(document.getElementById('canvasHeight').value);
    if (w < 200 || h < 200) return;
    // Save width/height to board (you may want to add columns to boards table)
    // For simplicity, we'll just update the canvas size and store in board metadata.
    // We'll add width and height to the board object (if not in DB, we can store in a JSON column).
    // Since your boards table doesn't have width/height, we'll store them in board_data JSON.
    // I'll use board.width and board.height (they are not in DB schema, but we'll keep them in memory and save as JSON if needed).
    // Actually, I'll add them to the board object and save as a separate patch? 
    // For now, we just update the CSS and save board title only – but we'll remember the size in memory.
    // We could store width/height in the board table as separate columns, but for now we'll just keep them in a JSON field.
    // I'll assume we add a 'metadata' column later, but for demo, we'll store in localStorage or a separate setting.
    // To keep it simple, I'll just store in a variable and use that.
    board.width = w;
    board.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    // We'll also save to a local storage key per user
    localStorage.setItem(`focyl_board_size_${session.id}`, JSON.stringify({ w, h }));
    setStatus('Canvas resized');
    closeSheet();
  });

  // On load, try to restore canvas size from localStorage
  (function restoreCanvasSize() {
    const saved = localStorage.getItem(`focyl_board_size_${session.id}`);
    if (saved) {
      try {
        const { w, h } = JSON.parse(saved);
        board.width = w;
        board.height = h;
        document.getElementById('canvasWidth').value = w;
        document.getElementById('canvasHeight').value = h;
      } catch (e) {}
    }
  })();

  // ================================================================
  //  AI REDESIGN (Hugging Face)
  // ================================================================
  async function redesignImageTile(tileId) {
    const tile = tiles.find(t => t.id === tileId);
    if (!tile || tile.type !== 'image') return;

    // Generate a prompt from the tile's content? We'll use a generic one.
    const prompt = 'A vision board, motivational, future self, success, vibrant, professional, high quality';

    if (!TILE_CONFIG.hfToken) {
      alert('Please set your Hugging Face token in TILE_CONFIG.hfToken');
      return;
    }

    try {
      const response = await fetch(
        `https://api-inference.huggingface.co/models/${TILE_CONFIG.hfModel}`,
        {
          headers: { Authorization: `Bearer ${TILE_CONFIG.hfToken}` },
          method: 'POST',
          body: JSON.stringify({ inputs: prompt }),
        }
      );
      if (!response.ok) throw new Error('HF API error: ' + response.status);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      // Update tile content
      tile.content.url = url;
      // Update DOM
      const el = document.querySelector(`.tile[data-id="${tile.id}"]`);
      if (el) {
        el.style.backgroundImage = `url('${url}')`;
      }
      saveBoard();
      setStatus('AI redesign complete');
    } catch (err) {
      alert('AI redesign failed: ' + err.message);
    }
  }

  // ================================================================
  //  SHEET LOGIC
  // ================================================================
  const sheet = document.getElementById('sheet');
  const scrim = document.getElementById('scrim');
  function openSheet(){ sheet.classList.add('open'); scrim.classList.add('open'); }
  function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('open'); }
  document.getElementById('fabBtn').addEventListener('click', openSheet);
  scrim.addEventListener('click', closeSheet);

  // Tabs
  const tabs = document.querySelectorAll('.tab');
  const panels = {
    photo: document.getElementById('panelPhoto'),
    words: document.getElementById('panelWords'),
    audio: document.getElementById('panelAudio'),
    settings: document.getElementById('panelSettings'),
  };
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      Object.values(panels).forEach(p => p.classList.remove('active'));
      const panelId = tab.id.replace('tab', 'panel');
      if (panels[panelId.toLowerCase()]) panels[panelId.toLowerCase()].classList.add('active');
    });
  });

  // Search button
  document.getElementById('searchBtn').addEventListener('click', () => {
    const q = document.getElementById('photoQuery').value.trim();
    if (q) searchPhotos(q);
  });

  // Back to index
  document.getElementById('backBtn').addEventListener('click', () => window.location.href = 'index.html');

  // ================================================================
  //  INIT
  // ================================================================
  loadBoard();

  // Auto-save every 30s
  setInterval(saveBoard, 30000);
  window.addEventListener('beforeunload', () => { saveBoard(); });
</script>
</body>
