    setStatus('Adding…');
    const ratio = r.h && r.w ? r.h / r.w : 1;

    const tile = addTile({
      type: 'image',
      source: r.provider,
      content: {
        url: r.thumb,
        credit: r.credit,
        creditUrl: r.creditUrl,
        license: r.license,
        printSafe: r.printSafe && r.commercialSafe,
        attributionRequired: r.attributionRequired,
        pending: true
      },
      w: 300,
      h: Math.round(300 * ratio)
    });

    try {
      const m = await FocylMedia.ingestRemote(r.url, boardId, {
        source: r.provider, credit: r.credit, license: r.license
      });
      const t = tiles.find(x => x.id === tile?.id) || tiles[tiles.length - 1];
      if (t) {
        Object.assign(t.content, {
          url: m.url, path: m.path,
          originalUrl: m.originalUrl || null,
          printSafe: m.printSafe && r.commercialSafe,
          pending: false
        });
        const el = document.querySelector(`.tile[data-id="${t.id}"]`);
        if (el) el.style.backgroundImage = `url('${m.url}')`;
      }
      saveBoard();
      setStatus('Added');
    } catch (err) {
      // Thumbnail is already on the board; keep it rather than failing.
      setStatus('Added (preview only)');
      log('Ingest failed: ' + err.message);
    }
  }

  // ================================================================
  //  REDESIGN
  //  The old version saved URL.createObjectURL(blob) — a blob URL dies
  //  with the page, so every redesign vanished on reload. Output now
  //  goes through Storage like any other image, and requests a
  //  print-resolution render rather than a 512px preview.
  // ================================================================
  async function redesignImageTile(tileId) {
    const tile = tiles.find(t => t.id === tileId);
    if (!tile || tile.type !== 'image') return;

    const theme = prompt(
      'Describe the redesign:',
      tile.content.prompt || 'cinematic, aspirational, high detail'
    );
    if (theme === null) return;

    const fn = FOCYL_CONFIG?.fn?.imageGenerate;
    const hasProxy = !!fn;
    if (!hasProxy && !TILE_CONFIG.hfToken) {
      alert('Image generation is not connected yet.\n\n' +
            'Deploy the image-generate Edge Function, or set TILE_CONFIG.hfToken for local testing.');
      return;
    }

    setStatus('Redesigning…');
    const el = document.querySelector(`.tile[data-id="${tile.id}"]`);
    if (el) el.style.opacity = '0.5';

    try {
      let blob;
      if (window.FocylAI && tile.content.url) {
        // Pass the existing image in as a reference so the redesign
        // edits the subject instead of generating something unrelated.
        const src = await fetch(tile.content.url).then(r => r.blob());
        const ref = await FocylAI.blobToDataUrl(src);
        const out = await FocylAI.generate(theme, { intent: 'photo', refImage: ref });
        blob = out.blob;
      } else if (hasProxy) {
        const base = FOCYL_CONFIG.supabaseUrl.replace(/\/$/, '');
        const res = await fetch(`${base}${fn}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${FOCYL_CONFIG.supabaseAnonKey}`
          },
          body: JSON.stringify({ prompt: theme, width: 1536, height: 1536 })
        });
        if (!res.ok) throw new Error('Generation failed (' + res.status + ')');
        blob = await res.blob();
      } else {
        const res = await fetch(
          `https://api-inference.huggingface.co/models/${TILE_CONFIG.hfModel}`,
          {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${TILE_CONFIG.hfToken}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              inputs: theme,
              parameters: { width: 1024, height: 1024 }
            })
          }
        );
        if (!res.ok) throw new Error('HF error ' + res.status);
        blob = await res.blob();
      }

      const m = await FocylMedia.uploadImage(blob, boardId, {
        source: 'redesign', license: 'Generated'
      });

      // Keep what it replaced, so a redesign is undoable.
      tile.content.previousUrl = tile.content.url;
      tile.content.previousPath = tile.content.path || null;
      Object.assign(tile.content, {
        url: m.url,
        path: m.path || null,
        originalUrl: m.originalUrl || null,
        printSafe: m.printSafe,
        prompt: theme,
        credit: 'AI generated',
        license: 'Generated',
        storage: m.storage
      });

      if (el) {
        el.style.backgroundImage = `url('${m.url}')`;
        el.style.opacity = '1';
      }
      tile.h = Math.round(tile.w * (m.h / m.w));
      if (el) el.style.height = tile.h + 'px';

      saveBoard();
      setStatus(m.printSafe ? 'Redesigned · print safe' : 'Redesigned');
      log(`Redesign ${m.naturalW}x${m.naturalH} → ${m.storage}`);
    } catch (err) {
      if (el) el.style.opacity = '1';
      setStatus('Redesign failed');
      alert('Redesign failed: ' + err.message);
      log('Redesign error: ' + err.message);
    }
  }

  window.undoRedesign = function(tileId) {
    const t = tiles.find(x => x.id === tileId);
    if (!t?.content?.previousUrl) return;
    t.content.url = t.content.previousUrl;
    t.content.path = t.content.previousPath;
    delete t.content.previousUrl;
    delete t.content.previousPath;
    renderAll();
    saveBoard();
  };

  // ================================================================
  //  INIT
  // ================================================================
  document.getElementById('backBtn').addEventListener('click', () => {
    saveBoard({ immediate: true });
    if (history.length > 1) history.back();
    else window.location.href = 'index.html';
  });

  log('Script started');
  loadBoard();

  // ================================================================
  //  LIBRARY PANELS — every library mounted and wired
  // ================================================================
  window.applyTemplate = function(tpl) {
    if (!tpl || !Array.isArray(tpl.tiles)) return;

    if (tpl.canvas && tiles.length === 0) {
      board.width  = tpl.canvas.width  || board.width;
      board.height = tpl.canvas.height || board.height;
      document.getElementById('canvasWidth').value  = board.width;
      document.getElementById('canvasHeight').value = board.height;
      canvas.style.width  = board.width  + 'px';
      canvas.style.height = board.height + 'px';
      markActivePreset();
    }

    // Offset so a template applied onto an existing board is visible
    // rather than buried underneath what is already there.
    const off = tiles.length ? 40 : 0;
    const topZ = tiles.reduce((m, t) => Math.max(m, t.z || 1), 0);

    tpl.tiles.forEach((src, i) => {
      tiles.push({
        ...src,
        id: crypto.randomUUID(),
        x: (src.x || 0) + off,
        y: (src.y || 0) + off,
        z: topZ + i + 1,
        board_id: boardId,
        library_id: 'templates',
        asset_id: tpl.id,
        content: JSON.parse(JSON.stringify(src.content || {}))
      });
    });

    renderAll();
    saveBoard();
    closeSheet();
    setStatus(`Applied "${tpl.name}"`);
    log(`Template ${tpl.id}: ${tpl.tiles.length} tiles added`);
  };

  // After a resize, zoom so the whole board is visible rather than
  // leaving the user staring at a corner of a huge canvas.
  function fitToScreen() {
    const w = board?.width || DEFAULT_W;
    const h = board?.height || DEFAULT_H;
    const availW = canvasWrap.clientWidth  - 32;
    const availH = canvasWrap.clientHeight - 32;
    const next = Math.min(availW / w, availH / h, 1);
    scale = Math.max(0.1, Math.round(next * 100) / 100);
    canvas.style.transform = `scale(${scale})`;
    const zl = document.getElementById('zoomLevel');
    if (zl) zl.textContent = Math.round(scale * 100) + '%';
  }
  window.fitToScreen = fitToScreen;

  function initSizePresets() {
    const host = document.getElementById('sizePresets');
    if (!host) return;
    host.innerHTML = '';
    SIZE_PRESETS.forEach(p => {
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = `<strong>${p.label}</strong><span>${p.w}×${p.h}</span>`;
      b.title = p.note;
      b.onclick = () => {
        document.getElementById('canvasWidth').value  = p.w;
        document.getElementById('canvasHeight').value = p.h;
        markActivePreset();
        resizeCanvas();
      };
      host.appendChild(b);
    });
    markActivePreset();
    ['canvasWidth','canvasHeight'].forEach(id =>
      document.getElementById(id)?.addEventListener('input', markActivePreset));
  }

  function markActivePreset() {
    const w = parseInt(document.getElementById('canvasWidth')?.value);
    const h = parseInt(document.getElementById('canvasHeight')?.value);
    const host = document.getElementById('sizePresets');
    if (!host) return;
    [...host.children].forEach((b, i) => {
      b.classList.toggle('active', SIZE_PRESETS[i].w === w && SIZE_PRESETS[i].h === h);
    });
    const hint = document.getElementById('sizeHint');
    if (hint && w && h) {
      const inches = (w / 300).toFixed(1) + '" × ' + (h / 300).toFixed(1) + '"';
      hint.textContent = (w >= 2400 || h >= 2400)
        ? `Print ready — ${inches} at 300dpi.`
        : `Screen size. Prints about ${inches} at 300dpi.`;
    }
  }

  async function initLibraries() {
    if (!window.FocylPicker) { log('Picker not loaded'); return; }
    const tier = session?.tier === 'film' ? 'film'
               : session?.tier === 'press' ? 'plus' : 'free';
    const locked = item => alert(`"${item.name}" is part of a paid tier.`);
    const mount = (sel, lib, onPick) =>
      FocylPicker.mount(sel, lib, { tier, onPick, onLocked: locked });

    // TEMPLATES — a springboard, not a replacement. Tiles are appended
    // with fresh ids and offset so they never sit exactly on existing work.
    await mount('#panelTemplates', 'templates', item => {
      applyTemplate(item);
    });

    // Photo category chips, driven by the images library
    const imgLib = await FocylLibraries.load('images');
    window._imgLib = imgLib;
    const chips = document.getElementById('photoChips');
    if (chips) {
      chips.innerHTML = '';
      imgLib.categories.forEach(c => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = c.replace(/-/g, ' ');
        b.onclick = () => {
          [...chips.children].forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          seeded = true;
          searchCategory(imgLib.searchTerms?.[c] || c.replace(/-/g, ' '), c);
        };
        chips.appendChild(b);
      });
    }

    // FONTS — applies to the selected tile, or seeds the next text tile
    await mount('#panelFonts', 'fonts', item => {
      const sel = document.getElementById('fontFamilySelect');
      if (sel) sel.value = item.stack;
      if (selectedTile && selectedTile.type === 'text') {
        selectedTile.content.fontFamily = item.stack;
        const tileEl = document.querySelector(`.tile[data-id="${selectedTile.id}"]`);
        const el = tileEl && tileEl.querySelector('.text-content');
        if (el) el.style.fontFamily = item.stack;
        if (tileEl) requestAnimationFrame(() => fitText(selectedTile, tileEl));
        saveBoard();
        setStatus('Font applied');
      } else {
        switchTab('words');
        setStatus('Font selected — add a text tile');
      }
    });

    // PAPERS — a writable surface
    await mount('#panelPapers', 'papers', item => {
      addTile({
        type: 'text', library_id: item.library_id, asset_id: item.asset_id,
        content: {
          text: 'Write here', fontSize: 22,
          fontFamily: item.fontStack || "'Sora', sans-serif",
          color: item.inkColor || '#1a1f3d',
          paper: FocylLibraries.assetUrl('papers', item.asset),
          lineHeight: item.lineHeight || 32
        },
        w: item.w || 300, h: item.h || 220
      });
      closeSheet();
    });

    // STICKY NOTES
    await mount('#panelNotes', 'notes', item => {
      addTile({
        type: 'note', library_id: item.library_id, asset_id: item.asset_id,
        content: {
          text: '', color: item.color || '#F7E06A',
          asset: item.asset ? FocylLibraries.assetUrl('notes', item.asset) : null,
          inkColor: item.inkColor || '#2a2410',
          maxChars: item.maxChars || 120
        },
        w: item.w || 180, h: item.h || 180,
        rotation: (Math.random() * 6) - 3
      });
      closeSheet();
    });

    // RIBBONS
    await mount('#panelRibbons', 'ribbons', item => {
      addTile({
        type: 'ribbon', library_id: item.library_id, asset_id: item.asset_id,
        content: {
          asset: FocylLibraries.assetUrl('ribbons', item.asset),
          text: 'Goal', textBox: item.textBox || null,
          inkColor: item.inkColor || '#FFFFFF'
        },
        w: item.w || 260, h: item.h || 90
      });
      closeSheet();
    });

    // CANVASES — the board substrate, not a tile
    await mount('#panelCanvases', 'canvases', item => {
      board.canvas_id = item.asset_id;
      applyCanvas(item);
      saveBoard();
      setStatus('Canvas applied');
      closeSheet();
    });

    // BORDERS — board edge and image frame
    await mount('#panelBordersBoard', 'borders_board', item => {
      board.border_id = item.asset_id;
      applyBoardBorder(item);
      saveBoard();
      setStatus('Border applied');
      closeSheet();
    });

    await mount('#panelBordersImage', 'borders_image', item => {
      if (!selectedTile || selectedTile.type !== 'image') {
        alert('Tap an image tile first, then choose a frame.');
        return;
      }
      selectedTile.content.frame = {
        asset: FocylLibraries.assetUrl('borders_image', item.asset),
        slice: item.slice || 24, padding: item.padding || 0
      };
      renderAll();
      saveBoard();
      setStatus('Frame applied');
      closeSheet();
    });

    // Reapply whatever the board was saved with
    if (board?.canvas_id) {
      const c = (await FocylLibraries.items('canvases')).find(i => i.id === board.canvas_id);
      if (c) applyCanvas(c);
    }
    if (board?.border_id) {
      const b = (await FocylLibraries.items('borders_board')).find(i => i.id === board.border_id);
      if (b) applyBoardBorder(b);
    }
    log('Libraries mounted');
  }

  function applyCanvas(item) {
    if (item.asset) {
      canvas.style.backgroundImage = `url('${FocylLibraries.assetUrl('canvases', item.asset)}')`;
      canvas.style.backgroundRepeat = item.tileable ? 'repeat' : 'no-repeat';
      canvas.style.backgroundSize = item.tileable ? 'auto' : '100% 100%';
      canvas.style.backgroundColor = item.fill || 'transparent';
    } else {
      canvas.style.backgroundImage = '';
      canvas.style.background = item.fill || 'transparent';
    }
  }

  function applyBoardBorder(item) {
    if (!item.asset) { canvas.style.borderImage = ''; canvas.style.border = ''; return; }
    const url = FocylLibraries.assetUrl('borders_board', item.asset);
    const slice = item.slice || 30;
    canvas.style.borderStyle = 'solid';
    canvas.style.borderWidth = slice + 'px';
    canvas.style.borderImageSource = `url('${url}')`;
    canvas.style.borderImageSlice = String(slice);
    canvas.style.borderImageRepeat = 'stretch';
  }

  window.addEventListener('DOMContentLoaded', () => {
    initTypeControls();
    if (isLocalOnly) {
      const b = document.createElement('div');
      b.style.cssText =
        'position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;' +
        'background:rgba(245,185,66,.14);border:1px solid rgba(245,185,66,.45);' +
        'color:#F5B942;padding:7px 14px;border-radius:999px;font-size:.72rem;' +
        'font-family:var(--mono);pointer-events:none;';
      b.textContent = 'Local mode — this board is on this device only';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 6000);
    }
    if (window.FocylMedia) {
      FocylMedia.init({ sb, userId: session?.id, bucket: FOCYL_CONFIG?.storage?.bucket });
    }
    if (window.FocylAI) FocylAI.init({ sb, userId: session?.id });
    initSizePresets();
    initLibraries();
  });

  // Autosave only when something actually changed — an idle board
  // no longer writes to the database every 30 seconds.
  setInterval(() => { if (saveTimer === null && !saveInFlight) return; saveBoard(); }, 30000);

  // beforeunload cannot await an async call; the page is gone first.
  // visibilitychange fires while the page is still alive.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveBoard({ immediate: true });
  });

  log('Initialization complete');
</script>
</body>
</html>
