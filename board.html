<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, viewport-fit=cover, user-scalable=no">
  <title>Focyl — Board</title>
  <meta name="theme-color" content="#070914">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="lib/focyl-config.js"></script>
  <script src="lib/focyl-brand.js" defer></script>
  <script src="lib/focyl-libraries.js" defer></script>
  <script src="lib/focyl-picker.js" defer></script>
  <script src="lib/focyl-media.js" defer></script>
  <script src="lib/focyl-images.js" defer></script>
  <script src="lib/focyl-ai.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== YOUR ORIGINAL DESIGN – UNTOUCHED ===== */
    :root {
      --void: #070914; --ink: #0d1224; --ink-2: #121a34;
      --line: rgba(237,239,247,0.09); --paper: #EDEFF7; --mist: #9AA4C7;
      --cyan: #35D8F0; --violet: #8B7CF6; --magenta: #EA4FC9;
      --grad: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--magenta));
      --glow: 0 0 40px rgba(139,124,246,0.3);
      --display: 'Space Grotesk', sans-serif;
      --body: 'Sora', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--void); color: var(--paper);
      font-family: var(--body); overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 60vmax; height: 60vmax;
      border-radius: 50%; filter: blur(90px); opacity: 0.14;
      pointer-events: none; z-index: 0;
    }
    body::before { top: -20vmax; left: -15vmax; background: var(--cyan); }
    body::after { bottom: -25vmax; right: -20vmax; background: var(--magenta); }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(7,9,20,0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      height: 56px;
    }
    .topbar .left {
      display: flex; align-items: center; gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .topbar .back {
      background: transparent; border: none; color: var(--mist);
      cursor: pointer; font-family: inherit; flex-shrink: 0;
      width: 30px; height: 30px; border-radius: 9px; padding: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background .18s, color .18s;
    }
    .topbar .back:hover { background: var(--ink-2); color: var(--paper); }
    .topbar .back svg { width: 18px; height: 18px; }
    .brand-logo { width: 30px; height: 30px; border-radius: 9px; cursor: pointer; flex-shrink: 0; }
    .topbar .title { font-family: var(--display); font-weight: 600; font-size: 1rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .right {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .topbar .status { font-family: var(--mono); font-size: 0.6rem; color: var(--mist); white-space: nowrap; }
    .topbar .zoom-controls { display: flex; gap: 3px; align-items: center; }
    .topbar .zoom-controls button {
      background: var(--ink-2); border: 1px solid var(--line); color: var(--paper);
      border-radius: 4px; padding: 1px 6px; font-size: 0.65rem; cursor: pointer;
      font-family: inherit; line-height: 1.5;
    }
    .topbar .zoom-controls button:hover { background: var(--violet); color: #070914; }
    .topbar .zoom-level { font-family: var(--mono); font-size: 0.6rem; color: var(--mist); min-width: 32px; text-align: center; }
    .topbar .profile { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .topbar .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--ink-2); border: 1px solid var(--line);
      background-size: cover; background-position: center;
      flex-shrink: 0; cursor: pointer;
    }
    .topbar .avatar:hover { border-color: var(--violet); }
    .topbar .display-name {
      font-size: 0.75rem; color: var(--paper); font-weight: 500;
      max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .canvas-wrap {
      position: absolute; inset: 0; top: 56px; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .canvas {
      position: relative;
      background-image: radial-gradient(rgba(237,239,247,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      transition: width 0.3s, height 0.3s;
      transform-origin: 0 0;
    }
    .canvas::before, .canvas::after {
      content: ""; position: absolute; width: 600px; height: 600px;
      border-radius: 50%; filter: blur(150px); opacity: 0.08; pointer-events: none;
    }
    .canvas::before { top: -200px; left: -200px; background: var(--cyan); }
    .canvas::after { bottom: -200px; right: -200px; background: var(--magenta); }

    .tile {
      position: absolute;
      border: none;
      border-radius: 0;
      box-shadow: none;
      background-color: transparent;
      touch-action: none; cursor: grab; overflow: visible;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transition: box-shadow 0.2s;
      will-change: transform;
    }
    /* Opt-in frame, driven by the outline toggle in the tile menu. */
    .tile.outlined {
      border-radius: 14px;
      box-shadow: 0 0 0 2px var(--violet), 0 14px 30px -16px rgba(0,0,0,.7);
    }
    .tile:active { cursor: grabbing; }
    .tile.selected { outline: 1px solid var(--violet); outline-offset: 0; }
    .tile.dragging { z-index: 50; box-shadow: 0 24px 50px -18px rgba(0,0,0,0.85), 0 0 60px rgba(139,124,246,0.2); }

    .tile.image-tile { background-color: transparent; }
    .tile.text-tile {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    .tile.image-tile { background-color: transparent; }
    .tile.text-tile {
      /* Height follows the text; width is whatever fitText measured. */
      height: auto !important;
      align-items: flex-start;
    }
    .tile.text-tile .text-content {
      outline: none;
      word-break: break-word;
      overflow-wrap: anywhere;
      text-align: center;
      line-height: 1.2;
      width: 100%;
      padding: var(--text-pad, 10px);
      box-sizing: border-box;
      white-space: pre-wrap;
    }
    .tile.text-tile .text-content:focus { outline: 2px solid var(--violet); }

    .tile .del {
      position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
      border-radius: 50%; background: rgba(7,9,20,0.6);
      border: 1px solid var(--line); color: var(--paper);
      font-family: var(--mono); font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 10;
    }
    .tile:hover .del, .tile.dragging .del { opacity: 1; }

    .tile.audio-tile {
      background: var(--ink-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px;
      cursor: pointer;
    }
    .tile.audio-tile .play-btn { font-size: 2rem; margin-bottom: 6px; filter: drop-shadow(0 0 10px rgba(53,216,240,0.3)); }
    .tile.audio-tile .progress-bar { width: 80%; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .tile.audio-tile .progress-bar .fill { height: 100%; width: 0%; background: var(--grad); }
    .tile.audio-tile .audio-label { font-size: 0.7rem; color: var(--mist); margin-top: 4px; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Resize/rotate handles removed on purpose — two-finger pinch and
       twist on the tile itself does both. See makeDraggable() in JS. */

    .fab {
      position: fixed; right: 20px; bottom: 26px; z-index: 20;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--grad); border: none; cursor: pointer;
      box-shadow: 0 14px 30px -10px rgba(139,124,246,0.6), var(--glow);
      display: flex; align-items: center; justify-content: center;
    }
    .fab svg { width: 22px; height: 22px; stroke: #070914; stroke-width: 2.4; }

    .scrim {
      position: fixed; inset: 0; background: rgba(7,9,20,0.6);
      z-index: 30; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--ink);
      border: 1px solid var(--line); border-bottom: none;
      border-radius: 22px 22px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      max-height: 75vh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 18px; }

    /* Horizontally scrollable so tabs keep a readable, tappable width
       however many libraries are added. flex:1 crushed them before. */
    .tabs {
      display: flex; gap: 6px; margin-bottom: 18px;
      background: var(--ink-2); border-radius: 100px; padding: 4px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: 0 0 auto; text-align: center;
      padding: 9px 16px; border-radius: 100px; scroll-snap-align: center;
      font-size: 0.8rem; font-weight: 600; cursor: pointer; color: var(--mist);
      border: none; background: transparent; font-family: inherit;
      white-space: nowrap; transition: background .18s, color .18s;
    }
    .tab:hover { color: var(--paper); }
    .tab.active { background: var(--grad); color: #070914; }

    .panel { display: none; }
    .panel.active { display: block; }

    label {
      display: block; font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--mist);
      margin: 0 0 6px;
    }
    input, textarea, select {
      width: 100%; background: var(--ink-2); border: 1px solid var(--line);
      color: var(--paper); border-radius: 12px; padding: 0 14px;
      height: 46px; line-height: 46px;
      font-family: var(--body); font-size: 0.95rem; margin-bottom: 12px;
      resize: none; outline: none; transition: border-color .18s, box-shadow .18s;
    }
    textarea { height: auto; line-height: 1.5; padding: 12px 14px; }
    input:focus, textarea:focus, select:focus {
      border-color: var(--violet);
      box-shadow: 0 0 0 3px rgba(139,124,246,0.18);
    }

    /* Custom caret — `appearance:none` alone left the select looking broken */
    select {
      appearance: none; -webkit-appearance: none; cursor: pointer;
      padding-right: 40px;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--mist) 50%),
        linear-gradient(135deg, var(--mist) 50%, transparent 50%);
      background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }
    select option { background: var(--ink-2); color: var(--paper); }

    /* Field row: label and control share one aligned grid so every
       panel lines up on the same left edge and the same 46px height. */
    .field { margin-bottom: 14px; }
    .field > label { margin-bottom: 7px; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .field-row .field { margin-bottom: 0; }

    /* Colour: native swatch replaced with a round chip + hex readout */
    .color-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--ink-2); border: 1px solid var(--line);
      border-radius: 12px; padding: 0 14px; height: 46px; margin-bottom: 12px;
    }
    .color-chip {
      position: relative; width: 26px; height: 26px; border-radius: 50%;
      flex-shrink: 0; border: 2px solid rgba(237,239,247,0.25);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4); overflow: hidden; cursor: pointer;
    }
    .color-chip input[type="color"] {
      position: absolute; inset: -6px; width: 200%; height: 200%;
      border: none; padding: 0; margin: 0; background: none; cursor: pointer;
    }
    .color-row .hex {
      font-family: var(--mono); font-size: 0.82rem; color: var(--paper);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .color-row .swatches { display: flex; gap: 6px; margin-left: auto; }
    .color-row .swatches button {
      width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(237,239,247,0.2); padding: 0;
    }

    /* Range slider, themed */
    input[type="range"] {
      -webkit-appearance: none; appearance: none;
      height: 4px; padding: 0; border: none; border-radius: 4px;
      background: var(--line); margin: 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
      background: var(--grad); cursor: pointer; border: 2px solid var(--ink);
      box-shadow: 0 2px 8px rgba(0,0,0,.5);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink);
      background: var(--violet); cursor: pointer;
    }
    .btn-primary {
      width: 100%; background: var(--grad); color: #070914; border: none;
      border-radius: 100px; padding: 13px 0; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-ghost {
      width: 100%; background: transparent; border: 1px dashed rgba(237,239,247,0.25);
      color: var(--paper); border-radius: 14px; padding: 13px 0; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; margin-bottom: 10px;
    }
    .hint { font-family: var(--mono); font-size: 0.75rem; color: var(--mist); margin: 0 0 12px; }
    .size-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .size-presets button {
      background: var(--ink-2); border: 1px solid var(--line); color: var(--mist);
      border-radius: 10px; padding: 9px 6px; cursor: pointer; font-family: inherit;
      display: flex; flex-direction: column; gap: 2px; align-items: center;
    }
    .size-presets button strong { font-size: .74rem; color: var(--paper); font-weight: 600; }
    .size-presets button span   { font-size: .58rem; font-family: var(--mono); opacity: .75; }
    .size-presets button.active { border-color: var(--violet); background: rgba(139,124,246,.14); }
    .size-presets button:hover  { border-color: var(--violet); }

    .photo-result { position: relative; }
    .photo-badge {
      position: absolute; top: 5px; right: 5px; z-index: 2;
      font-family: var(--mono); font-size: .54rem; letter-spacing: .04em;
      padding: 2px 6px; border-radius: 999px;
      background: rgba(7,9,20,.82); color: var(--mist);
      border: 1px solid var(--line);
    }
    .photo-badge.ok { color: #7BE3B0; border-color: rgba(123,227,176,.5); }
    .photo-hide {
      position: absolute; top: 4px; left: 4px; z-index: 3;
      width: 20px; height: 20px; line-height: 1; padding: 0;
      border-radius: 50%; border: 1px solid var(--line);
      background: rgba(7,9,20,.82); color: var(--mist);
      font-size: .8rem; cursor: pointer; opacity: 0;
      transition: opacity .15s;
    }
    .photo-result:hover .photo-hide,
    .photo-result:active .photo-hide { opacity: 1; }
    .print-toggle {
      display: flex; align-items: center; gap: 8px; margin: 0 0 10px;
      font-size: .72rem; color: var(--mist); cursor: pointer;
    }
    .print-toggle input { accent-color: var(--violet); width: 15px; height: 15px; }

    #aiPrompt {
      width: 100%; box-sizing: border-box; resize: vertical;
      background: var(--ink-2); border: 1px solid var(--line);
      color: var(--paper); border-radius: 10px; padding: 10px 12px;
      font-family: inherit; font-size: .85rem; line-height: 1.45;
    }
    #aiPrompt:focus { outline: none; border-color: var(--violet); }
    #aiCategory {
      width: 100%; background: var(--ink-2); border: 1px solid var(--line);
      color: var(--paper); border-radius: 10px; padding: 9px 12px;
      font-family: inherit; font-size: .8rem;
    }
    .ai-tile { position: relative; }
    .ai-tile .prov {
      position: absolute; bottom: 4px; left: 4px;
      font-family: var(--mono); font-size: .52rem; padding: 1px 5px;
      border-radius: 999px; background: rgba(7,9,20,.8); color: var(--mist);
    }
    /* Checkerboard so a transparent knockout is visibly transparent. */
    .ai-tile.alpha {
      background-color: #2a2f52;
      background-image:
        linear-gradient(45deg, #1b2038 25%, transparent 25%),
        linear-gradient(-45deg, #1b2038 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #1b2038 75%),
        linear-gradient(-45deg, transparent 75%, #1b2038 75%);
      background-size: 12px 12px;
      background-position: 0 0, 0 6px, 6px -6px, -6px 0;
    }
    .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .cat-chips button {
      font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      border: 1px solid var(--line); border-radius: 100px; padding: 7px 12px;
      background: var(--ink-2); color: var(--paper); cursor: pointer;
    }
    .cat-chips button:hover { background: var(--violet); color: #070914; }
    .cat-chips button.active { background: var(--violet); color: #070914; border-color: transparent; }
    .results {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 10px;
    }
    .results .thumb {
      aspect-ratio: 1/1; border-radius: 10px; background-size: cover; background-position: center;
      border: 1px solid var(--line); cursor: pointer; background-color: var(--ink-2);
    }
    input[type="file"] { display: none; }

    .font-size-control {
      display: flex; align-items: center; gap: 12px;
      background: var(--ink-2); border: 1px solid var(--line);
      border-radius: 12px; padding: 0 14px; height: 46px; margin-bottom: 12px;
    }
    .font-size-control input[type="range"] { flex: 1; margin: 0; }
    .font-size-control span {
      font-family: var(--mono); font-size: 0.82rem; color: var(--mist);
      min-width: 46px; text-align: right;
    }
    .crop-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .crop-row input { margin-bottom: 0; }

    /* Live preview of the chosen font, size and colour */
    .type-preview {
      border: 1px dashed rgba(237,239,247,0.16); border-radius: 12px;
      padding: 16px 14px; margin-bottom: 14px; text-align: center;
      min-height: 62px; display: flex; align-items: center; justify-content: center;
      overflow: hidden; word-break: break-word;
    }

    @media (max-width: 600px) { .sheet { padding: 16px; } }

    .tile .redesign-btn {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(7,9,20,0.7); border: 1px solid var(--violet); color: white;
      border-radius: 20px; padding: 4px 12px; font-size: 0.7rem;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 6; font-family: inherit;
    }
    .tile:hover .redesign-btn { opacity: 1; }

    #debug {
      position: fixed; bottom: 80px; left: 20px; z-index: 999;
      background: rgba(0,0,0,0.8); color: #0f0; padding: 4px 8px;
      font-family: monospace; font-size: 0.55rem;
      border-radius: 4px; max-width: 70%;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: break-all;
      opacity: 0.6;
    }

    /* Avatar input hidden */
    #avatarInput { display: none; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="left">
    <button class="back" id="backBtn" aria-label="Back" title="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <focyl-mark class="brand-logo" size="30" link href="index.html"
                title="Focyl — home"></focyl-mark>
    <span class="title" id="boardTitle">My Board</span>
  </div>
  <div class="right">
    <div class="zoom-controls">
      <button onclick="adjustZoom(-0.1)">−</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button onclick="adjustZoom(0.1)">+</button>
      <button onclick="resetZoom()">⟲</button>
    </div>
    <span class="status" id="statusText">Ready</span>
    <div class="profile" id="profileArea">
      <div class="avatar" id="avatarDisplay" title="Click to change avatar"></div>
      <span class="display-name" id="displayNameDisplay">User</span>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" aria-label="Add tile" onclick="openSheet()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#070914" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- SHEET -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="tabs" id="sheetTabs">
    <button class="tab active" id="tabCreate" onclick="switchTab('create')">Create</button>
    <button class="tab" id="tabTemplates" onclick="switchTab('templates')">Templates</button>
    <button class="tab" id="tabPhoto"    onclick="switchTab('photo')">Photo</button>
    <button class="tab" id="tabWords"     onclick="switchTab('words')">Words</button>
    <button class="tab" id="tabFonts"     onclick="switchTab('fonts')">Fonts</button>
    <button class="tab" id="tabPapers"    onclick="switchTab('papers')">Papers</button>
    <button class="tab" id="tabNotes"     onclick="switchTab('notes')">Notes</button>
    <button class="tab" id="tabRibbons"   onclick="switchTab('ribbons')">Ribbons</button>
    <button class="tab" id="tabCanvases"  onclick="switchTab('canvases')">Canvases</button>
    <button class="tab" id="tabBorders"   onclick="switchTab('borders')">Borders</button>
    <button class="tab" id="tabAudio"     onclick="switchTab('audio')">Audio</button>
    <button class="tab" id="tabSettings"  onclick="switchTab('settings')">Settings</button>
  </div>

  <!-- AI generation. Prompt box + intent + category, then straight
       to the board or into your own library. -->
  <div class="panel active" id="panelCreate">
    <label for="aiPrompt">Describe what you want</label>
    <textarea id="aiPrompt" rows="3"
      placeholder="a white Lamborghini outside a modern glass mansion at dusk"></textarea>

    <label style="margin-top:10px">Type</label>
    <div class="cat-chips" id="aiIntents"></div>

    <label>File under</label>
    <select id="aiCategory"></select>

    <div class="crop-row" style="margin-top:12px">
      <button class="btn-primary" id="aiGenerateBtn" onclick="generateImage()">Generate</button>
      <button class="btn-ghost" onclick="showAiHistory()">My library</button>
      <button class="btn-ghost" onclick="testAiKeys()">Test keys</button>
    </div>
    <p class="hint" id="aiHint"></p>

    <div class="results" id="aiResults"></div>
  </div>

  <div class="panel" id="panelTemplates">
    <p class="hint">Start from a layout, then make it yours. Applying a template
       adds its tiles to the current board — it does not erase what you have.</p>
  </div>

  <div class="panel" id="panelPhoto">
    <label for="photoQuery">Search free photos</label>
    <input type="text" id="photoQuery" placeholder="mansion, yacht, sunrise…">
    <div class="cat-chips" id="photoChips"></div>
    <label class="print-toggle">
      <input type="checkbox" onchange="togglePrintMode(this.checked)">
      Print-safe only — high resolution, licensed for products
    </label>
    <div class="crop-row">
      <button class="btn-primary" id="searchBtn" onclick="doSearch()">Search</button>
      <button class="btn-ghost" onclick="seedPhotoGrid(true)">Shuffle</button>
    </div>
    <div class="results" id="results"></div>
    <p class="hint" id="photoHint"></p>
    <label>Or use your own</label>
    <button class="btn-ghost" id="uploadBtn" onclick="document.getElementById('fileInput').click()">Upload from device (resized)</button>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
  </div>

  <div class="panel" id="panelWords">
    <div class="field">
      <label for="quoteText">In your own words, future tense</label>
      <textarea id="quoteText" rows="2" placeholder="I run my own studio."></textarea>
    </div>

    <div class="type-preview" id="typePreview">Your vision</div>

    <div class="field">
      <label>Font family</label>
      <select id="fontFamilySelect"></select>
    </div>

    <div class="field">
      <label>Font size</label>
      <div class="font-size-control">
        <input type="range" id="textSizeSlider" min="12" max="120" value="32">
        <span id="textSizeDisplay">32px</span>
      </div>
    </div>

    <div class="field">
      <label>Font colour</label>
      <div class="color-row">
        <span class="color-chip" id="colorChip">
          <input type="color" id="textColorPicker" value="#EDEFF7">
        </span>
        <span class="hex" id="colorHex">#EDEFF7</span>
        <span class="swatches" id="colorSwatches"></span>
      </div>
    </div>

    <button class="btn-primary" id="addTextBtn" onclick="addTextTile()">Add Text Tile</button>
  </div>

  <!-- Library panels. Every one is populated at runtime from
       libraries/<id>/index.json — no markup change when you add assets. -->
  <div class="panel" id="panelFonts"></div>
  <div class="panel" id="panelPapers"></div>
  <div class="panel" id="panelNotes"></div>
  <div class="panel" id="panelRibbons"></div>
  <div class="panel" id="panelCanvases"></div>
  <div class="panel" id="panelBorders">
    <div class="tabs" style="margin-bottom:14px">
      <button class="tab active" id="subBoardBorder" onclick="switchBorder('board')">Board edge</button>
      <button class="tab" id="subImageBorder" onclick="switchBorder('image')">Image frame</button>
    </div>
    <div id="panelBordersBoard"></div>
    <div id="panelBordersImage" style="display:none"></div>
  </div>

  <div class="panel" id="panelAudio">
    <label>Upload an MP3 from your device</label>
    <button class="btn-ghost" id="uploadAudioBtn" onclick="document.getElementById('audioInput').click()">Choose MP3</button>
    <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioUpload(event)">
    <p class="hint">Tap the tile to play/pause.</p>
  </div>

  <div class="panel" id="panelSettings">
    <label>Board size</label>
    <div class="size-presets" id="sizePresets"></div>
    <label style="margin-top:12px">Custom (pixels)</label>
    <div class="crop-row">
      <input type="number" id="canvasWidth"  value="1080" step="20" min="400" max="6000">
      <input type="number" id="canvasHeight" value="1350" step="20" min="400" max="6000">
    </div>
    <button class="btn-primary" id="resizeCanvasBtn" onclick="resizeCanvas()">Resize Board</button>
    <p class="hint" id="sizeHint"></p>
    <hr style="border-color:var(--line);margin:16px 0;">
    <label>Display Name</label>
    <input type="text" id="displayNameInput" placeholder="Your display name" onchange="updateDisplayName()">
    <button class="btn-ghost" onclick="document.getElementById('avatarInput').click()">Change Avatar</button>
    <p class="hint">Click your avatar in the top bar to change it.</p>
  </div>
</div>

<!-- DEBUG -->
<div id="debug" hidden>⏳ Loading...</div>

<script>
  // ================================================================
  //  DEBUG HELPER
  // ================================================================
  // Debug panel is opt-in: append ?debug=1 to the URL.
  const DEBUG = new URLSearchParams(location.search).has('debug');
  function log(msg) {
    const d = document.getElementById('debug');
    if (d && DEBUG) { d.hidden = false; d.textContent = msg; }
    console.log(msg);
  }

  // ================================================================
  //  CONFIG
  // ================================================================
  // Supabase creds now live in lib/focyl-config.js (loaded above)

  const TILE_CONFIG = {
    unsplashKey: '',
    pexelsKey: '',
    hfToken: '',
    hfModel: 'stabilityai/stable-diffusion-2-1',
  };

  // ================================================================
  //  SESSION
  // ================================================================
  const session = JSON.parse(localStorage.getItem('focyl_user') || 'null');
  if (!session) {
    log('No session, redirecting to auth...');
    window.location.href = 'auth.html';
  } else {
    log('Session found: ' + session.email);
  }

  // ================================================================
  //  SUPABASE CLIENT
  // ================================================================
  let sb = null;
  try {
    sb = supabase.createClient(FOCYL_CONFIG.supabaseUrl, FOCYL_CONFIG.supabaseAnonKey);
    log('Supabase client created');
  } catch (e) {
    log('Supabase init error: ' + e.message);
  }

  // ================================================================
  //  STATE
  // ================================================================
  let board = null;
  let tiles = [];
  // ================================================================
  //  Board defaults. 1600x1600 opened at 15% zoom on a phone, which is
  //  why the canvas felt enormous and empty. 1080x1350 is the portrait
  //  ratio people actually view, and lands near 100% on a phone.
  // ================================================================
  const DEFAULT_W = 1080;
  const DEFAULT_H = 1350;

  const SIZE_PRESETS = [
    { id: 'phone',    label: 'Phone',        w: 1080, h: 1920, note: 'Lock screen' },
    { id: 'portrait', label: 'Portrait',     w: 1080, h: 1350, note: 'Default' },
    { id: 'square',   label: 'Square',       w: 1200, h: 1200, note: 'Social' },
    { id: 'desktop',  label: 'Desktop',      w: 1920, h: 1080, note: 'Wallpaper' },
    { id: 'print8',   label: 'Print 8×10"',  w: 2400, h: 3000, note: '300dpi' },
    { id: 'print16',  label: 'Print 16×20"', w: 4800, h: 6000, note: '300dpi · Press' }
  ];

  let selectedTile = null;   // last tapped tile; targets font + frame actions
  let boardId = null;
  let scale = 1;
  const MIN_SCALE = 0.15;
  const MAX_SCALE = 3;

  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvasWrap');
  const statusText = document.getElementById('statusText');
  const zoomLevel = document.getElementById('zoomLevel');
  const avatarDisplay = document.getElementById('avatarDisplay');
  const displayNameDisplay = document.getElementById('displayNameDisplay');

  function setStatus(t) { if (statusText) statusText.textContent = t; log('Status: ' + t); }

  // ================================================================
  //  PROFILE (avatar & display name)
  // ================================================================
  let profileData = { display_name: session.email.split('@')[0], avatar_url: null };

  // Load from localStorage
  const savedProfile = localStorage.getItem(`focyl_profile_${session.email}`);
  if (savedProfile) {
    try {
      const parsed = JSON.parse(savedProfile);
      profileData.display_name = parsed.display_name || profileData.display_name;
      profileData.avatar_url = parsed.avatar_url || null;
    } catch(e) {}
  }
  updateProfileUI();

  function updateProfileUI() {
    displayNameDisplay.textContent = profileData.display_name;
    document.getElementById('displayNameInput').value = profileData.display_name;
    if (profileData.avatar_url) {
      avatarDisplay.style.backgroundImage = `url('${profileData.avatar_url}')`;
      avatarDisplay.style.backgroundSize = 'cover';
      avatarDisplay.style.backgroundPosition = 'center';
    } else {
      avatarDisplay.style.backgroundImage = '';
      avatarDisplay.style.backgroundColor = 'var(--ink-2)';
    }
  }

  avatarDisplay.addEventListener('click', () => {
    document.getElementById('avatarInput').click();
  });
  document.getElementById('avatarInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = h * max / w; w = max; }
        else if (h > max) { w = w * max / h; h = max; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.8);
        profileData.avatar_url = dataUrl;
        avatarDisplay.style.backgroundImage = `url('${dataUrl}')`;
        avatarDisplay.style.backgroundSize = 'cover';
        avatarDisplay.style.backgroundPosition = 'center';
        localStorage.setItem(`focyl_profile_${session.email}`, JSON.stringify(profileData));
        log('Avatar updated');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    this.value = '';
  });

  window.updateDisplayName = function() {
    const name = document.getElementById('displayNameInput').value.trim();
    if (!name) return;
    profileData.display_name = name;
    displayNameDisplay.textContent = name;
    localStorage.setItem(`focyl_profile_${session.email}`, JSON.stringify(profileData));
    log('Display name updated');
  };

  // ================================================================
  //  SHEET CONTROLS
  // ================================================================
  window.openSheet = function() {
    document.getElementById('sheet').classList.add('open');
    document.getElementById('scrim').classList.add('open');
    log('Sheet opened');
  };
  window.closeSheet = function() {
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
    log('Sheet closed');
  };

  const PANELS = ['photo','words','fonts','papers','notes','ribbons',
                  'canvases','borders','audio','settings'];

  window.switchTab = function(panelId) {
    // Fill the photo grid the first time the tab is opened, so it is
    // never an empty box waiting on a search.
    if (panelId === 'photo' && window.FocylImages) seedPhotoGrid();
    if (panelId === 'create') initAiPanel();
    document.querySelectorAll('#sheetTabs > .tab').forEach(t => t.classList.remove('active'));
    const tab = document.getElementById('tab' + panelId.charAt(0).toUpperCase() + panelId.slice(1));
    if (tab) {
      tab.classList.add('active');
      tab.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    }
    PANELS.forEach(p => {
      const el = document.getElementById('panel' + p.charAt(0).toUpperCase() + p.slice(1));
      if (el) el.classList.toggle('active', p === panelId);
    });
    log('Switched to ' + panelId);
  };

  window.switchBorder = function(which) {
    document.getElementById('subBoardBorder').classList.toggle('active', which === 'board');
    document.getElementById('subImageBorder').classList.toggle('active', which === 'image');
    document.getElementById('panelBordersBoard').style.display = which === 'board' ? '' : 'none';
    document.getElementById('panelBordersImage').style.display = which === 'image' ? '' : 'none';
  };

  // ================================================================
  //  ZOOM
  // ================================================================
  function applyZoom() {
    canvas.style.transform = `scale(${scale})`;
    zoomLevel.textContent = Math.round(scale * 100) + '%';
  }

  window.adjustZoom = function(delta) {
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
    applyZoom();
  };

  window.resetZoom = function() {
    scale = 1;
    applyZoom();
    const w = board?.width || DEFAULT_W;
    const h = board?.height || DEFAULT_H;
    canvasWrap.scrollLeft = (w * scale) / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = (h * scale) / 2 - canvasWrap.clientHeight / 2;
  };

  // Mouse wheel zoom (Ctrl+scroll)
  canvasWrap.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      const rect = canvasWrap.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const scrollLeft = canvasWrap.scrollLeft + mx;
      const scrollTop = canvasWrap.scrollTop + my;
      const ratio = newScale / scale;
      scale = newScale;
      applyZoom();
      canvasWrap.scrollLeft = scrollLeft * ratio - mx;
      canvasWrap.scrollTop = scrollTop * ratio - my;
    }
  }, { passive: false });

  // Pinch zoom (mobile)
  let lastPinchDist = 0;
  canvasWrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinchDist = Math.sqrt(dx*dx + dy*dy);
    }
  }, { passive: true });

  canvasWrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const delta = (dist - lastPinchDist) / 500;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      const rect = canvasWrap.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const scrollLeft = canvasWrap.scrollLeft + mx;
      const scrollTop = canvasWrap.scrollTop + my;
      const ratio = newScale / scale;
      scale = newScale;
      applyZoom();
      canvasWrap.scrollLeft = scrollLeft * ratio - mx;
      canvasWrap.scrollTop = scrollTop * ratio - my;
      lastPinchDist = dist;
    }
  }, { passive: true });

  // ================================================================
  //  LOAD BOARD
  // ================================================================
  // Runs AFTER board is populated. The original ran immediately after
  // calling loadBoard(), while board was still null, so it never applied.
  function restoreCanvasSize() {
    const saved = localStorage.getItem(`focyl_board_size_${session?.id}`);
    if (!saved || !board) return;
    try {
      const { w, h } = JSON.parse(saved);
      board.width = w; board.height = h;
      document.getElementById('canvasWidth').value = w;
      document.getElementById('canvasHeight').value = h;
    } catch (e) {}
  }

  const BYPASS_ID = '00000000-0000-0000-0000-000000000000';
  const isLocalOnly = !session?.id || session.id === BYPASS_ID;

  async function loadBoard() {
    log('Loading board...');
    if (isLocalOnly) {
      boardId = 'local';
      setStatus('Local mode');
      log('Local session — Supabase skipped');
    }
    try {
      if (sb && !isLocalOnly) {
        const { data: boardData, error: boardError } = await sb
          .from('boards')
          .select('*')
          .eq('user_id', session.id)
          .maybeSingle();
        if (boardError && boardError.code !== 'PGRST116') throw new Error('Supabase board fetch failed');
        if (boardData) {
          board = boardData;
          boardId = board.id;
          document.getElementById('boardTitle').textContent = board.title;
          const { data: tileData, error: tileError } = await sb
            .from('tiles')
            .select('*')
            .eq('board_id', boardId)
            .order('z', { ascending: true });
          if (tileError) throw tileError;
          tiles = tileData || [];
          restoreCanvasSize();
          renderAll();
          requestAnimationFrame(fitToScreen);
          setStatus('Loaded from Supabase');
          log('Loaded ' + tiles.length + ' tiles from Supabase');
          return;
        }
      }
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage');
        log('Loaded ' + tiles.length + ' tiles from localStorage');
        return;
      }
      board = { title: 'My Board', width: DEFAULT_W, height: DEFAULT_H };
      tiles = [];
      restoreCanvasSize();
      renderAll();
      requestAnimationFrame(fitToScreen);
      setStatus('New board');
      log('New board created');
    } catch (err) {
      log('Load error: ' + err.message);
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage (fallback)');
        log('Fallback loaded ' + tiles.length + ' tiles');
      } else {
        board = { title: 'My Board', width: DEFAULT_W, height: DEFAULT_H };
        tiles = [];
        renderAll();
        setStatus('New board (fallback)');
        log('Fallback new board');
      }
    }
  }

  // ================================================================
  //  SAVE BOARD
  // ================================================================
  // Tiles the user deleted this session. We delete exactly these,
  // never "everything then re-insert" — that window is where boards die.
  const deletedTileIds = new Set();

  let saveTimer = null;
  let saveInFlight = false;
  let saveQueued = false;

  // Public entry point. Cheap to call — call it as often as you like.
  function saveBoard({ immediate = false } = {}) {
    if (!board) return;
    if (immediate) { clearTimeout(saveTimer); return flushSave(); }
    clearTimeout(saveTimer);
    setStatus('Saving…');
    saveTimer = setTimeout(flushSave, 800);
  }

  function saveLocal() {
    try {
      localStorage.setItem(`focyl_board_${session.email}`, JSON.stringify({
        title: board.title, tiles, width: board.width || DEFAULT_W, height: board.height || DEFAULT_H
      }));
      return true;
    } catch (err) {
      // Almost always QuotaExceededError from base64 image tiles.
      setStatus('Local storage full');
      log('Local save failed: ' + err.message);
      return false;
    }
  }

  async function flushSave() {
    if (!board) return;
    if (saveInFlight) { saveQueued = true; return; }
    saveInFlight = true;

    try {
      if (sb && !isLocalOnly && boardId && boardId !== 'local') {
        await sb.from('boards')
          .update({ title: board.title, width: board.width, height: board.height, updated_at: new Date().toISOString() })
          .eq('id', boardId);

        // Delete only what was actually removed.
        if (deletedTileIds.size) {
          const ids = [...deletedTileIds];
          const { error } = await sb.from('tiles').delete().in('id', ids);
          if (error) throw error;
          deletedTileIds.clear();
        }

        // Upsert on the primary key: tiles keep their identity across saves,
        // so goals and animations stay attached to the right tile.
        if (tiles.length) {
          const rows = tiles.map(t => ({
            id: t.id,
            board_id: boardId,
            type: t.type,
            source: t.source || 'library',
            content: t.content,
            x: t.x, y: t.y, w: t.w, h: t.h,
            z: t.z || 1,
            rotation: t.rotation || 0,
            outline: t.outline || false,
            library_id: t.library_id || null,
            asset_id: t.asset_id || null,
            updated_at: new Date().toISOString()
          }));
          const { error } = await sb.from('tiles').upsert(rows, { onConflict: 'id' });
          if (error) throw error;
        }

        saveLocal();                       // local copy as an offline cache
        setStatus('Saved');
        log('Saved ' + tiles.length + ' tiles to Supabase');
      } else {
        setStatus(saveLocal() ? (isLocalOnly ? 'Saved on this device' : 'Saved locally') : 'Save failed');
      }
    } catch (err) {
      log('Save error: ' + err.message);
      setStatus(saveLocal() ? 'Saved locally (offline)' : 'Save failed');
    } finally {
      saveInFlight = false;
      if (saveQueued) { saveQueued = false; flushSave(); }
    }
  }

  // ================================================================
  //  RENDER
  // ================================================================
  function renderAll() {
    const w = board?.width || DEFAULT_W;
    const h = board?.height || DEFAULT_H;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.innerHTML = '';
    tiles.forEach(renderTile);
    // Apply zoom and center
    applyZoom();
    canvasWrap.scrollLeft = (w * scale) / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = (h * scale) / 2 - canvasWrap.clientHeight / 2;
    log('Rendered ' + tiles.length + ' tiles');
  }

  function renderTile(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    if (t.outline) el.classList.add('outlined');
    if (t.type === 'image') {
      el.classList.add('image-tile');
      const src = t.content?.url || t.content?.src;
      if (src && !t.content._fitted) {
        const probe = new Image();
        probe.onload = () => {
          const ratio = probe.naturalHeight / probe.naturalWidth;
          if (ratio && isFinite(ratio)) {
            t.h = Math.round(t.w * ratio);
            el.style.height = t.h + 'px';
            t.content._fitted = true;
            saveBoard();
          }
        };
        probe.src = src;
      }
    }
    el.dataset.id = t.id;
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    el.style.width = t.w + 'px';
    el.style.height = t.h + 'px';
    if (t.rotation) {
      el.style.transform = `rotate(${t.rotation}deg)`;
    }

    if (t.type === 'image') {
      el.style.backgroundImage = `url('${t.content.url}')`;
      if (t.content.frame) {
        el.style.borderStyle = 'solid';
        el.style.borderWidth = t.content.frame.slice + 'px';
        el.style.borderImageSource = `url('${t.content.frame.asset}')`;
        el.style.borderImageSlice = String(t.content.frame.slice);
        el.style.borderImageRepeat = 'stretch';
        if (t.content.frame.padding) el.style.paddingBottom = t.content.frame.padding + 'px';
      }
      // No resize/rotate handles by design — two-finger pinch and twist on
      // the tile itself does both (see makeDraggable). Only buttons on an
      // image tile are delete (×) and Redesign.
      const aiBtn = document.createElement('button');
      aiBtn.className = 'redesign-btn';
      aiBtn.textContent = '✨ Redesign';
      aiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        redesignImageTile(t.id);
      });
      el.appendChild(aiBtn);
    } else if (t.type === 'text') {
      el.classList.add('text-tile');
      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = true;
      content.textContent = t.content.text || 'Edit me';
      content.style.fontFamily = t.content.fontFamily || "'Space Grotesk', sans-serif";
      content.style.fontSize = (t.content.fontSize || 32) + 'px';
      content.style.color = t.content.color || '#EDEFF7';
      if (t.content.paper) {
        el.style.backgroundImage = `url('${t.content.paper}')`;
        el.style.backgroundSize = '100% 100%';
        el.classList.remove('text-tile');
        content.style.lineHeight = (t.content.lineHeight || 32) + 'px';
        content.style.padding = '14px';
      }
      content.addEventListener('input', () => {
        t.content.text = content.innerText;
        fitText(t, el);
        saveBoard();
      });
      el.appendChild(content);
      // Measure after the element is in the DOM and fonts have settled.
      requestAnimationFrame(() => fitText(t, el));
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => fitText(t, el));
      }
      // Pure text, no box — pinch/twist on the tile resizes and rotates it,
      // same as image tiles. Only button is delete (×).
    } else if (t.type === 'ribbon') {
      el.style.backgroundImage = `url('${t.content.asset}')`;
      el.style.backgroundSize = '100% 100%';
      el.style.border = 'none';
      el.style.boxShadow = 'none';
      const label = document.createElement('div');
      label.contentEditable = true;
      label.textContent = t.content.text || '';
      const tb = t.content.textBox;
      label.style.cssText = tb
        ? `position:absolute;left:${tb.x}px;top:${tb.y}px;width:${tb.w}px;height:${tb.h}px;` +
          `transform:rotate(${tb.rotate || 0}deg);text-align:${tb.align || 'center'};` +
          `display:flex;align-items:center;justify-content:center;outline:none;`
        : 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;outline:none;';
      label.addEventListener('input', () => {
        t.content.text = label.textContent;
        saveBoard();
      });
      el.appendChild(label);
    } else if (t.type === 'note') {
      el.style.border = 'none';
      if (t.content.asset) {
        el.style.backgroundImage = `url('${t.content.asset}')`;
        el.style.backgroundSize = '100% 100%';
      } else {
        el.style.background = t.content.color || '#F7E06A';
      }
      el.style.boxShadow = '0 10px 20px -10px rgba(0,0,0,.7)';
      const nb = document.createElement('div');
      nb.contentEditable = true;
      nb.textContent = t.content.text || '';
      nb.dataset.placeholder = 'Note…';
      nb.style.cssText =
        'position:absolute;inset:0;padding:16px;outline:none;overflow:hidden;' +
        `color:${t.content.inkColor || '#2a2410'};font-size:15px;line-height:1.4;` +
        "font-family:'Sora',sans-serif;";
      nb.addEventListener('input', () => {
        const max = t.content.maxChars || 120;
        if (nb.textContent.length > max) nb.textContent = nb.textContent.slice(0, max);
        t.content.text = nb.textContent;
        saveBoard();
      });
      el.appendChild(nb);
    } else if (t.type === 'audio') {
      el.classList.add('audio-tile');
      const playBtn = document.createElement('div');
      playBtn.className = 'play-btn';
      playBtn.textContent = '▶';
      const progress = document.createElement('div');
      progress.className = 'progress-bar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      progress.appendChild(fill);
      const label = document.createElement('div');
      label.className = 'audio-label';
      label.textContent = t.content.name || 'Audio';
      el.appendChild(playBtn);
      el.appendChild(progress);
      el.appendChild(label);

      const audio = document.createElement('audio');
      audio.src = t.content.url;
      audio.preload = 'metadata';
      let playing = false;
      const updateProgress = () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          fill.style.width = pct + '%';
        }
      };
      audio.addEventListener('timeupdate', updateProgress);
      el.addEventListener('click', () => {
        if (playing) {
          audio.pause();
          playBtn.textContent = '▶';
          playing = false;
        } else {
          audio.play();
          playBtn.textContent = '⏸';
          playing = true;
        }
      });
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        playing = false;
        fill.style.width = '0%';
      });
      el._audio = audio;
    }

    // Delete button
    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('Delete this tile?')) return;
      deletedTileIds.add(t.id);
      if (window.FocylMedia && t.content) {
        FocylMedia.remove([t.content.path, t.content.originalPath, t.content.previousPath]);
      }
      tiles = tiles.filter(x => x.id !== t.id);
      if (el._audio) { el._audio.pause(); el._audio.src = ''; }
      el.remove();
      saveBoard();
    });
    el.appendChild(del);

    // Click to front
    el.addEventListener('click', (e) => {
      if (e.target.closest('.del') || e.target.closest('.redesign-btn')) return;
      selectedTile = t;
      document.querySelectorAll('.tile.selected').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      const maxZ = Math.max(0, ...tiles.map(t2 => t2.z || 1));
      t.z = maxZ + 1;
      el.style.zIndex = t.z;
      saveBoard();
    });

    makeDraggable(el, t);
    canvas.appendChild(el);
  }

  // ================================================================
  //  DRAG (one finger) + PINCH-RESIZE & TWIST-ROTATE (two fingers)
  //  No handles, no buttons — purely gesture-driven, on the tile itself.
  // ================================================================
  function makeDraggable(el, tile) {
    const pointers = new Map();
    let mode = null; // 'drag' | 'pinch'
    let startX, startY, origLeft, origTop;
    let pinchStartDist = 0, pinchStartAngle = 0, pinchStartW = 0, pinchStartH = 0, pinchStartRot = 0;

    const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
    const angleOf = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;

    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.del') || e.target.closest('.redesign-btn')) return;
      el.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      el.classList.add('dragging');

      if (pointers.size === 1) {
        mode = 'drag';
        startX = e.clientX; startY = e.clientY;
        origLeft = parseFloat(el.style.left); origTop = parseFloat(el.style.top);
      } else if (pointers.size === 2) {
        mode = 'pinch';
        const [a, b] = [...pointers.values()];
        pinchStartDist = dist(a, b) || 1;
        pinchStartAngle = angleOf(a, b);
        pinchStartW = tile.w;
        pinchStartH = tile.h;
        pinchStartRot = tile.rotation || 0;
      }
    });

    el.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (mode === 'drag' && pointers.size === 1) {
        // Divide by scale: pointer pixels are screen-space, tile
        // coordinates are canvas-space. Without this the tile runs
        // away from your finger at any zoom other than 100%.
        let newX = origLeft + (e.clientX - startX) / scale;
        let newY = origTop  + (e.clientY - startY) / scale;
        const bw = board?.width || DEFAULT_W;
        const bh = board?.height || DEFAULT_H;
        newX = Math.max(0, Math.min(bw - tile.w, newX));
        newY = Math.max(0, Math.min(bh - tile.h, newY));
        el.style.left = newX + 'px';
        el.style.top = newY + 'px';
        tile.x = newX;
        tile.y = newY;
      } else if (mode === 'pinch' && pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const pinchScale = dist(a, b) / pinchStartDist;
        const newW = Math.max(60, Math.min(1400, pinchStartW * pinchScale));
        const newH = Math.max(40, Math.min(1400, pinchStartH * pinchScale));
        const newRot = pinchStartRot + (angleOf(a, b) - pinchStartAngle);
        el.style.width = newW + 'px';
        el.style.height = newH + 'px';
        el.style.transform = `rotate(${newRot}deg)`;
        tile.w = newW;
        tile.h = newH;
        tile.rotation = newRot;
      }
    });

    function release(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 0) {
        el.classList.remove('dragging');
        mode = null;
        saveBoard();
        setStatus('Saved');
      } else if (pointers.size === 1) {
        // One finger lifted mid-pinch — stop cleanly rather than jumping into a drag.
        mode = null;
      }
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  }

  // ================================================================
  //  ADD TILE
  // ================================================================
  // ================================================================
  //  fitText — measures the rendered text and sizes the tile to it.
  //  Runs on create, on every edit, and after a font or size change.
  //  Without this a two-word tile keeps the same 300x220 default box.
  // ================================================================
  const TEXT_PAD = 10;
  const TEXT_MIN_W = 80;
  const TEXT_MAX_W = 640;

  function fitText(t, el) {
    const content = el.querySelector('.text-content');
    if (!content) return;

    // Measure in a detached span with identical typography and no wrapping,
    // so we learn the natural single-line width of the longest line.
    const probe = document.createElement('span');
    probe.style.cssText =
      'position:absolute;visibility:hidden;white-space:pre;left:-9999px;top:0;';
    probe.style.fontFamily = content.style.fontFamily;
    probe.style.fontSize   = content.style.fontSize;
    probe.style.fontWeight = content.style.fontWeight || 'normal';
    probe.style.letterSpacing = content.style.letterSpacing || 'normal';

    const lines = (t.content.text || '').split('\n');
    let widest = 0;
    lines.forEach(line => {
      probe.textContent = line || ' ';
      document.body.appendChild(probe);
      widest = Math.max(widest, probe.getBoundingClientRect().width);
      document.body.removeChild(probe);
    });

    const w = Math.round(Math.min(TEXT_MAX_W, Math.max(TEXT_MIN_W, widest + TEXT_PAD * 2 + 2)));
    t.w = w;
    el.style.width = w + 'px';

    // Height comes from the laid-out element, which accounts for any
    // wrapping that happened once the width was clamped to TEXT_MAX_W.
    el.style.height = 'auto';
    const h = Math.round(content.getBoundingClientRect().height);
    t.h = h;
    el.style.height = h + 'px';
  }

  function addTile(partial) {
    const newTile = {
      id: crypto.randomUUID(),
      board_id: boardId || 'local',
      x: Math.min(canvasWrap.scrollLeft / scale + 60, (board?.width || DEFAULT_W) - 160),
      y: Math.min(canvasWrap.scrollTop / scale + 60, (board?.height || DEFAULT_H) - 160),
      w: 160,
      h: 160,
      z: tiles.length + 1,
      source: 'library',
      rotation: 0,
      outline: false,
      ...partial
    };
    tiles.push(newTile);
    renderTile(newTile);
    saveBoard();
    setStatus('Added');
    log('Added tile: ' + newTile.type);
  }

  // ================================================================
  //  BUTTON CALLBACKS
  // ================================================================
  document.getElementById('photoQuery')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });

  // Rotating seed so the panel is never empty and never identical
  // twice. Drawn from the images library categories.
  let seeded = false;
  window.seedPhotoGrid = async function seedPhotoGrid(force) {
    if (seeded && !force) return;
    seeded = true;
    const grid = document.getElementById('results');
    if (!grid) return;

    const lib = await FocylLibraries.load('images');
    const cats = lib.categories || [];
    if (!cats.length) return;

    // One category at a time. Rotate which one opens so it feels
    // alive, but never blend two — the grid must always match the
    // highlighted chip.
    const idx = force ? Math.floor(Math.random() * cats.length) : 0;
    const cat = cats[idx];

    const chips = document.getElementById('photoChips');
    if (chips) {
      [...chips.children].forEach(x => x.classList.remove('active'));
      const label = cat.replace(/-/g, ' ');
      const match = [...chips.children].find(b => b.textContent === label);
      if (match) match.classList.add('active');
    }

    await searchPhotos(lib.searchTerms?.[cat] || cat.replace(/-/g, ' '), cat, force);
  };

  // ================================================================
  //  TYPE CONTROLS — font, size, colour, live preview
  // ================================================================
  const SWATCHES = ['#EDEFF7','#070914','#35D8F0','#8B7CF6','#EA4FC9','#F5B942'];

  async function initTypeControls() {
    const sel     = document.getElementById('fontFamilySelect');
    const slider  = document.getElementById('textSizeSlider');
    const sizeOut = document.getElementById('textSizeDisplay');
    const picker  = document.getElementById('textColorPicker');
    const hexOut  = document.getElementById('colorHex');
    const swatch  = document.getElementById('colorSwatches');
    const preview = document.getElementById('typePreview');

    // Fonts come from the library, so adding one is a manifest edit.
    if (sel) {
      const lib = await FocylLibraries.load('fonts');
      sel.innerHTML = '';
      (lib.items || []).forEach(f => {
        const o = document.createElement('option');
        o.value = f.stack;
        o.textContent = f.name;
        o.style.fontFamily = f.stack;
        sel.appendChild(o);
      });
      if (!sel.options.length) {
        sel.innerHTML = '<option value="\'Space Grotesk\', sans-serif">Space Grotesk</option>';
      }
    }

    function paint() {
      if (!preview) return;
      preview.style.fontFamily = sel?.value || 'inherit';
      preview.style.fontSize   = (slider?.value || 32) + 'px';
      preview.style.color      = picker?.value || '#EDEFF7';
      if (sizeOut) sizeOut.textContent = (slider?.value || 32) + 'px';
      if (hexOut)  hexOut.textContent  = (picker?.value || '#EDEFF7').toUpperCase();
    }

    // Editing while a text tile is selected updates that tile live,
    // rather than only affecting the next one added.
    function applyToSelected() {
      if (!selectedTile || selectedTile.type !== 'text') return;
      selectedTile.content.fontFamily = sel?.value || selectedTile.content.fontFamily;
      selectedTile.content.fontSize   = parseInt(slider?.value || selectedTile.content.fontSize);
      selectedTile.content.color      = picker?.value || selectedTile.content.color;
      const el = document.querySelector(`.tile[data-id="${selectedTile.id}"]`);
      const c  = el?.querySelector('.text-content');
      if (c) {
        c.style.fontFamily = selectedTile.content.fontFamily;
        c.style.fontSize   = selectedTile.content.fontSize + 'px';
        c.style.color      = selectedTile.content.color;
        requestAnimationFrame(() => fitText(selectedTile, el));
      }
      saveBoard();
    }

    [sel, slider, picker].forEach(el =>
      el?.addEventListener('input', () => { paint(); applyToSelected(); }));

    if (swatch) {
      swatch.innerHTML = '';
      SWATCHES.forEach(hex => {
        const b = document.createElement('button');
        b.type = 'button';
        b.style.cssText =
          `width:20px;height:20px;border-radius:50%;border:1px solid var(--line);` +
          `background:${hex};cursor:pointer;padding:0;margin-right:5px;`;
        b.onclick = () => {
          if (picker) picker.value = hex;
          paint();
          applyToSelected();
        };
        swatch.appendChild(b);
      });
    }

    paint();
  }

  // ================================================================
  //  AI GENERATION
  // ================================================================
  let aiIntent = 'photo';
  let aiInited = false;

  function initAiPanel() {
    if (aiInited || !window.FocylAI) return;
    aiInited = true;

    const chips = document.getElementById('aiIntents');
    if (chips) {
      chips.innerHTML = '';
      Object.entries(FocylAI.INTENTS).forEach(([key, spec], i) => {
        const b = document.createElement('button');
        b.className = 'cat-chip' + (i === 0 ? ' active' : '');
        b.textContent = spec.label;
        b.onclick = () => {
          [...chips.children].forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          aiIntent = key;
        };
        chips.appendChild(b);
      });
    }

    // Categories come from the images library so generated work
    // files alongside everything else.
    FocylLibraries.load('images').then(lib => {
      const sel = document.getElementById('aiCategory');
      if (!sel) return;
      sel.innerHTML = '<option value="uncategorised">Uncategorised</option>';
      (lib.categories || []).forEach(c => {
        const o = document.createElement('option');
        o.value = c;
        o.textContent = c.replace(/-/g, ' ');
        sel.appendChild(o);
      });
    });

    // Enter generates. Shift+Enter adds a line, so long prompts
    // are still possible.
    const promptBox = document.getElementById('aiPrompt');
    if (promptBox) {
      promptBox.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          generateImage();
        }
      });
      // Live category preview as they type.
      promptBox.addEventListener('input', () => {
        const { category, confidence } = FocylAI.categorise(promptBox.value);
        const sel = document.getElementById('aiCategory');
        if (sel && confidence > 0 && !sel.dataset.touched) sel.value = category;
      });
    }
    document.getElementById('aiCategory')
      ?.addEventListener('change', e => { e.target.dataset.touched = '1'; });

    FocylAI.countToday().then(n => {
      const h = document.getElementById('aiHint');
      if (h && n) h.textContent = `${n} generated today.`;
    });
  }

  // The function's GET health check cannot be opened in a browser tab:
  // Supabase's gateway rejects any request without an auth header, and
  // an address bar cannot send one. Called from here the anon key is
  // attached, so the report comes back.
  window.testAiKeys = async function() {
    const hint = document.getElementById('aiHint');
    if (hint) hint.textContent = 'Checking keys…';
    try {
      const base = FOCYL_CONFIG.supabaseUrl.replace(/\/$/, '');
      const res = await fetch(`${base}/functions/v1/ai-image`, {
        headers: { Authorization: `Bearer ${FOCYL_CONFIG.supabaseAnonKey}` }
      });
      const r = await res.json();

      if (r.error) { if (hint) hint.textContent = r.error; return; }

      const lines = [];
      Object.entries(r.secrets || {}).forEach(([k, v]) => lines.push(`${k}: ${v}`));
      Object.entries(r.providers || {}).forEach(([k, v]) => lines.push(`${k} → ${v}`));
      if (hint) hint.textContent = lines.join('  ·  ') || 'No report returned';
      log('Key check: ' + JSON.stringify(r));
    } catch (err) {
      if (hint) hint.textContent = 'Could not reach the function: ' + err.message;
    }
  };

  window.generateImage = async function() {
    const promptEl = document.getElementById('aiPrompt');
    const prompt = promptEl?.value.trim();
    if (!prompt) { setStatus('Describe what you want first'); return; }

    // The description decides where it files. The dropdown only wins
    // if the user deliberately changed it.
    const sel = document.getElementById('aiCategory');
    const auto = FocylAI.categorise(prompt);
    const category = sel?.dataset.touched
      ? sel.value
      : (auto.confidence > 0 ? auto.category : (sel?.value || 'uncategorised'));
    if (sel && !sel.dataset.touched) sel.value = category;
    const btn = document.getElementById('aiGenerateBtn');
    const grid = document.getElementById('aiResults');
    const hint = document.getElementById('aiHint');

    btn.disabled = true;
    btn.textContent = 'Generating…';
    if (hint) hint.textContent = 'This takes a few seconds.';

    try {
      const result = await FocylAI.generate(prompt, { intent: aiIntent });
      const saved = await FocylAI.save(result, { prompt, category, kind: aiIntent });

      if (hint) {
        const where = category === 'uncategorised' ? '' : ` · filed under ${category.replace(/-/g, ' ')}`;
        const fell = result.provider === 'cloudflare' ? ' (Gemini limit reached, switched over)' : '';
        hint.textContent = `Made with ${result.provider}${fell}${where}. Tap to place.`;
      }
      paintAiResult({ ...saved, provider: result.provider, prompt }, grid, true);
      promptEl.value = '';
      if (sel) delete sel.dataset.touched;
      setStatus('Generated');
      log(`AI ${aiIntent} via ${result.provider} → ${category}`);
    } catch (err) {
      if (hint) hint.textContent = err.message;
      setStatus('Generation failed');
      log('AI error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generate';
    }
  };

  function paintAiResult(item, grid, prepend) {
    if (!grid) return;
    const d = document.createElement('div');
    d.className = 'thumb ai-tile' + (item.transparent ? ' alpha' : '');
    d.style.backgroundImage = `url('${item.url}')`;
    d.style.backgroundSize = item.transparent ? 'contain' : 'cover';
    d.title = item.prompt || '';
    if (item.provider) {
      const p = document.createElement('span');
      p.className = 'prov';
      p.textContent = item.provider;
      d.appendChild(p);
    }
    d.onclick = () => placeGenerated(item);
    if (prepend && grid.firstChild) grid.insertBefore(d, grid.firstChild);
    else grid.appendChild(d);
  }

  // Straight onto the board. Lettering and ribbons keep their
  // transparency and get no tile chrome.
  function placeGenerated(item) {
    const ratio = item.w && item.h ? item.h / item.w : 1;
    const w = item.transparent ? 280 : 300;
    addTile({
      type: 'image',
      source: 'ai',
      library_id: 'generated',
      asset_id: item.id,
      content: {
        url: item.url,
        path: item.path || null,
        prompt: item.prompt || null,
        printSafe: item.printSafe,
        transparent: !!item.transparent,
        license: 'Generated'
      },
      w,
      h: Math.round(w * ratio)
    });
    closeSheet();
    setStatus('Added to board');
    if (item.id && sb && !FocylMedia.isLocal()) {
      sb.rpc('bump_asset_use', { asset: item.id }).then(() => {}, () => {});
    }
  }

  window.showAiHistory = async function() {
    const grid = document.getElementById('aiResults');
    const hint = document.getElementById('aiHint');
    if (!grid) return;
    grid.innerHTML = '';
    if (hint) hint.textContent = 'Loading your library…';

    const rows = await FocylAI.history({ limit: 40 });
    if (!rows.length) {
      if (hint) hint.textContent = FocylMedia.isLocal()
        ? 'Sign in with an account to keep a library across devices.'
        : 'Nothing generated yet.';
      return;
    }
    if (hint) hint.textContent = `${rows.length} in your library.`;
    rows.forEach(r => paintAiResult(r, grid, false));
  };

  // ================================================================
  //  UPLOAD
  // ================================================================
  window.handleFileUpload = async function(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;

    setStatus('Uploading…');
    try {
      const m = await FocylMedia.uploadImage(file, boardId, { source: 'upload' });
      addTile({
        type: 'image',
        source: 'upload',
        content: {
          url: m.url,
          path: m.path || null,
          originalUrl: m.originalUrl || null,
          originalPath: m.originalPath || null,
          printSafe: m.printSafe,
          naturalW: m.naturalW,
          naturalH: m.naturalH,
          storage: m.storage
        },
        w: 300,
        h: Math.round(300 * (m.h / m.w))
      });
      closeSheet();
      setStatus(m.storage === 'local' ? 'Added (this device only)' : 'Uploaded');
      log(`Image ${m.naturalW}x${m.naturalH} → ${m.storage}${m.printSafe ? ' · print safe' : ''}`);
    } catch (err) {
      setStatus('Upload failed');
      log('Upload error: ' + err.message);
      alert('Upload failed: ' + err.message);
    }
  };

  window.handleAudioUpload = function(e) {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      addTile({
        type: 'audio',
        content: { url: ev.target.result, name: file.name },
        w: 180, h: 120
      });
      closeSheet();
      setStatus('Audio added');
    };
    reader.readAsDataURL(file);
  };

  window.togglePrintMode = function(on) {
    printMode = on;
    const q = document.getElementById('photoQuery')?.value.trim();
    if (q) searchPhotos(q, activeCategory, true, true);
    else if (activeCategory) seedPhotoGrid(true);
  };

  // ================================================================
  //  TEXT + CANVAS ENTRY POINTS
  // ================================================================
  window.addTextTile = function() {
    const fontFamily = document.getElementById('fontFamilySelect')?.value
                    || "'Space Grotesk', sans-serif";
    const fontSize = parseInt(document.getElementById('textSizeSlider')?.value || 32);
    const color = document.getElementById('textColorPicker')?.value || '#EDEFF7';

    // Size is measured by fitText once rendered; these are a first
    // frame only, so the tile does not flash at the wrong dimensions.
    addTile({
      type: 'text',
      content: { text: 'Your vision', fontSize, fontFamily, color },
      w: TEXT_MIN_W,
      h: fontSize + 20
    });
    closeSheet();
    setStatus('Text tile added');
  };

  window.resizeCanvas = function() {
    const w = parseInt(document.getElementById('canvasWidth').value);
    const h = parseInt(document.getElementById('canvasHeight').value);
    if (!w || !h || w < 400 || h < 400 || w > 6000 || h > 6000) {
      setStatus('Size must be between 400 and 6000');
      return;
    }
    board.width = w;
    board.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    try {
      localStorage.setItem(`focyl_board_size_${session.id}`, JSON.stringify({ w, h }));
    } catch (_) {}
    saveBoard();
    setStatus(`Board set to ${w}×${h}`);
    fitToScreen();
    markActivePreset();
  };

  // ================================================================
  //  SEARCH ENTRY POINTS
  // ================================================================
  window.doSearch = function() {
    const q = document.getElementById('photoQuery').value.trim();
    if (!q) { setStatus('Type something to search'); return; }
    // A typed query is the user's own words. It must NOT be replaced by
    // the active category's canned query — the category is passed only
    // so its quality filters still apply.
    searchPhotos(q, activeCategory, true, true);
  };

  window.searchCategory = function(term, category) {
    document.getElementById('photoQuery').value = '';
    activeCategory = category;
    searchPhotos(term, category, true);
  };

  async function searchPhotos(query, category, fresh, userQuery) {
    seeded = true;                     // an explicit search counts as seeded
    activeCategory = category || activeCategory;
    const grid = document.getElementById('results');
    if (!grid) return;
    grid.innerHTML = '<p class="hint">Searching…</p>';

    try {
      const { results, rateLimited, pexelsDown, printable, note, inspected, kept } =
        await FocylImages.search(query, { category, perPage: 12, printMode, fresh, userQuery });

      const hint = document.getElementById('photoHint');
      if (hint) {
        const filtered = inspected ? ` · ${kept} of ${inspected} passed the filter` : '';
        hint.textContent = note ? note + filtered
          : printable === false
            ? 'Screen use only — this category cannot be printed on products.' + filtered
            : filtered.replace(/^ · /, '');
      }

      if (!results.length) {
        grid.innerHTML = `<p class="hint">${
          pexelsDown  ? 'This category needs the photo-search function deployed. Openverse cannot supply exclusive imagery for it.'
          : rateLimited ? 'Search is busy right now — try again in a minute.'
          : 'Nothing matched the filters. Try a broader word.'
        }</p>`;
        return;
      }

      paintResults(results);
    } catch (err) {
      grid.innerHTML = '<p class="hint">Search unavailable right now.</p>';
      log('Search error: ' + err.message);
    }
  }

  function paintResults(results) {
    const grid = document.getElementById('results');
    if (!grid) return;
    grid.innerHTML = '';
    results.forEach(r => {
      const d = document.createElement('div');
      d.className = 'thumb photo-result';
      d.style.backgroundImage = `url('${r.thumb}')`;
      d.title = `${r.title || r.credit} · ${r.license} · ${r.w}×${r.h}`;

      // State what a tile can be used for at the point of choosing,
      // not at print checkout when it is too late to swap it.
      const badge = document.createElement('span');
      const safe = r.printSafe && r.commercialSafe;
      badge.className = 'photo-badge' + (safe ? ' ok' : '');
      badge.textContent = safe ? 'Print' : 'Screen';
      d.appendChild(badge);

      // Tap × to hide: the image's distinctive words join this
      // category's blocklist so the same kind stops appearing.
      const hideBtn = document.createElement('button');
      hideBtn.className = 'photo-hide';
      hideBtn.textContent = '×';
      hideBtn.title = 'Not this kind — stop showing these';
      hideBtn.onclick = async (ev) => {
        ev.stopPropagation();
        const words = await FocylImages.hide(r, activeCategory);
        d.remove();
        setStatus(words.length ? `Hidden: ${words.join(', ')}` : 'Hidden');
      };
      d.appendChild(hideBtn);

      d.onclick = () => addPhotoTile(r);
      grid.appendChild(d);
    });
  }

  // Pull the chosen photo into our own storage. A tile that points at
  // someone else's CDN breaks the day they rotate the URL.
  async function addPhotoTile(r) {
    closeSheet();
