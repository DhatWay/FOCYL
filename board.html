<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focyl — Board</title>
  <meta name="theme-color" content="#070914">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ====== THEME (same as before) ====== */
    :root { /* ... keep the full CSS from previous versions ... */ }
    /* I'll paste the same CSS but with one change for images */
    .tile.image-tile {
      background-size: contain !important; /* ensure full image visible */
      background-repeat: no-repeat;
      background-position: center;
    }
    /* rest of CSS unchanged */
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="back" id="backBtn">← Focyl</button>
  <span class="title" id="boardTitle">My Board</span>
  <span class="status" id="statusText">Ready</span>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" aria-label="Add tile">
  <svg viewBox="0 0 24 24" fill="none" stroke="#070914" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- SHEET -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="tabs">
    <button class="tab active" id="tabPhoto">Photo</button>
    <button class="tab" id="tabWords">Words</button>
    <button class="tab" id="tabAudio">Audio</button>
    <button class="tab" id="tabSettings">Settings</button>
  </div>

  <!-- Panels (same as before) -->
  <div class="panel active" id="panelPhoto">
    <label for="photoQuery">Search free photos</label>
    <input type="text" id="photoQuery" placeholder="studio, mid thirties…">
    <button class="btn-primary" id="searchBtn">Search</button>
    <div class="results" id="results"></div>
    <p class="hint" id="photoHint"></p>
    <label>Or use your own</label>
    <button class="btn-ghost" id="uploadBtn">Upload from device (resized)</button>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div class="panel" id="panelWords">
    <label for="quoteText">In your own words, future tense</label>
    <textarea id="quoteText" rows="2" placeholder="I run my own studio."></textarea>
    <div class="font-size-control">
      <label>Font size</label>
      <input type="range" id="textSizeSlider" min="12" max="120" value="32">
      <span id="textSizeDisplay">32px</span>
    </div>
    <label>Font family</label>
    <select id="fontFamilySelect">
      <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
      <option value="'Sora', sans-serif">Sora</option>
      <option value="'Inter', sans-serif">Inter</option>
      <option value="'Playfair Display', serif">Playfair Display</option>
      <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      <option value="'Georgia', serif">Georgia</option>
      <option value="'Arial', sans-serif">Arial</option>
    </select>
    <button class="btn-primary" id="addTextBtn">Add Text Tile</button>
  </div>

  <div class="panel" id="panelAudio">
    <label>Upload an MP3 from your device</label>
    <button class="btn-ghost" id="uploadAudioBtn">Choose MP3</button>
    <input type="file" id="audioInput" accept="audio/*">
    <p class="hint">Tap the tile to play/pause.</p>
  </div>

  <div class="panel" id="panelSettings">
    <label>Canvas Size (pixels)</label>
    <div class="crop-row">
      <input type="number" id="canvasWidth" value="1600" step="100" min="600">
      <input type="number" id="canvasHeight" value="1600" step="100" min="600">
    </div>
    <button class="btn-primary" id="resizeCanvasBtn">Resize Board</button>
    <hr style="border-color:var(--line);margin:16px 0;">
    <label>AI Redesign (image tiles)</label>
    <p class="hint">Click the ✨ button on any image tile.</p>
  </div>
</div>

<script>
  // ================================================================
  //  1. IMMEDIATE UI EVENT LISTENERS (runs before any async)
  // ================================================================
  document.addEventListener('DOMContentLoaded', function() {
    console.log('DOM ready – attaching UI listeners');

    // ----- SHEET -----
    const fab = document.getElementById('fabBtn');
    const scrim = document.getElementById('scrim');
    const sheet = document.getElementById('sheet');
    if (fab) fab.addEventListener('click', () => {
      sheet.classList.add('open');
      scrim.classList.add('open');
    });
    if (scrim) scrim.addEventListener('click', () => {
      sheet.classList.remove('open');
      scrim.classList.remove('open');
    });

    // ----- TABS -----
    const tabs = document.querySelectorAll('.tab');
    const panels = {
      photo: document.getElementById('panelPhoto'),
      words: document.getElementById('panelWords'),
      audio: document.getElementById('panelAudio'),
      settings: document.getElementById('panelSettings'),
    };
    tabs.forEach(tab => {
      tab.addEventListener('click', function() {
        tabs.forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        Object.values(panels).forEach(p => p.classList.remove('active'));
        const panelId = this.id.replace('tab', 'panel').toLowerCase();
        if (panels[panelId]) panels[panelId].classList.add('active');
      });
    });

    // ----- SEARCH -----
    const searchBtn = document.getElementById('searchBtn');
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        const q = document.getElementById('photoQuery').value.trim();
        if (q) searchPhotos(q);
      });
    }

    // ----- UPLOAD IMAGE -----
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.getElementById('fileInput');
    if (uploadBtn) {
      uploadBtn.addEventListener('click', () => fileInput.click());
    }
    if (fileInput) {
      fileInput.addEventListener('change', function(e) {
        handleFileUpload(e);
        this.value = ''; // reset
      });
    }

    // ----- TEXT TILE -----
    const addTextBtn = document.getElementById('addTextBtn');
    if (addTextBtn) {
      addTextBtn.addEventListener('click', function() {
        const text = document.getElementById('quoteText').value.trim() || 'Your vision';
        const fontSize = parseInt(document.getElementById('textSizeSlider').value) || 32;
        const fontFamily = document.getElementById('fontFamilySelect').value;
        addTile({
          type: 'text',
          content: { text, fontSize, fontFamily, color: '#EDEFF7' },
          w: Math.max(120, text.length * 10),
          h: fontSize * 2 + 20,
        });
        // close sheet
        sheet.classList.remove('open');
        scrim.classList.remove('open');
      });
    }

    // Font size slider display
    const slider = document.getElementById('textSizeSlider');
    const display = document.getElementById('textSizeDisplay');
    if (slider && display) {
      slider.addEventListener('input', () => {
        display.textContent = slider.value + 'px';
      });
    }

    // ----- AUDIO -----
    const audioUploadBtn = document.getElementById('uploadAudioBtn');
    const audioInput = document.getElementById('audioInput');
    if (audioUploadBtn) {
      audioUploadBtn.addEventListener('click', () => audioInput.click());
    }
    if (audioInput) {
      audioInput.addEventListener('change', function(e) {
        handleAudioUpload(e);
        this.value = '';
      });
    }

    // ----- CANVAS RESIZE -----
    const resizeBtn = document.getElementById('resizeCanvasBtn');
    if (resizeBtn) {
      resizeBtn.addEventListener('click', function() {
        const w = parseInt(document.getElementById('canvasWidth').value);
        const h = parseInt(document.getElementById('canvasHeight').value);
        if (w < 200 || h < 200) return;
        if (board) {
          board.width = w;
          board.height = h;
          canvas.style.width = w + 'px';
          canvas.style.height = h + 'px';
          localStorage.setItem(`focyl_board_size_${session.id}`, JSON.stringify({ w, h }));
          setStatus('Canvas resized');
          sheet.classList.remove('open');
          scrim.classList.remove('open');
        }
      });
    }

    // ----- BACK BUTTON -----
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        window.location.href = 'index.html';
      });
    }

    // Now load the board (async)
    loadBoard();
  });

  // ================================================================
  //  2. SUPABASE & BOARD LOGIC (with fallbacks)
  // ================================================================
  // Config
  const SUPABASE_URL = 'https://ufkgmldvclvkzvznsxbs.supabase.co';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY'; // <-- REPLACE

  // API keys (optional)
  const TILE_CONFIG = {
    unsplashKey: '',
    pexelsKey: '',
    hfToken: '',
    hfModel: 'stabilityai/stable-diffusion-2-1',
  };

  // Session
  const session = JSON.parse(localStorage.getItem('focyl_user') || 'null');
  if (!session) {
    // If no session, redirect to auth (but we do this inside DOMContentLoaded to avoid early redirect)
    // We'll check inside loadBoard
  }

  // Supabase client
  let sb = null;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.warn('Supabase init failed', e);
  }

  // State
  let board = null;
  let tiles = [];
  let boardId = null;

  // DOM refs (used by functions)
  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvasWrap');
  const statusText = document.getElementById('statusText');
  function setStatus(t) { if (statusText) statusText.textContent = t; }

  // ================================================================
  //  3. LOAD BOARD
  // ================================================================
  async function loadBoard() {
    // If no session, redirect
    if (!session) {
      window.location.href = 'auth.html';
      return;
    }

    try {
      // Try Supabase first
      if (sb) {
        const { data: boardData, error: boardError } = await sb
          .from('boards')
          .select('*')
          .eq('user_id', session.id)
          .maybeSingle();

        if (boardError && boardError.code !== 'PGRST116') {
          throw new Error('Supabase board fetch failed');
        }

        if (boardData) {
          board = boardData;
          boardId = board.id;
          document.getElementById('boardTitle').textContent = board.title;

          const { data: tileData, error: tileError } = await sb
            .from('tiles')
            .select('*')
            .eq('board_id', boardId)
            .order('z', { ascending: true });

          if (tileError) throw tileError;
          tiles = tileData || [];
          renderAll();
          setStatus('Loaded from Supabase');
          return;
        }
      }

      // Fallback to localStorage
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage');
        return;
      }

      // New board
      board = { title: 'My Board', width: 1600, height: 1600 };
      tiles = [];
      renderAll();
      setStatus('New board');

    } catch (err) {
      console.error('Load error:', err);
      // Last resort: try localStorage again
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage (fallback)');
      } else {
        board = { title: 'My Board', width: 1600, height: 1600 };
        tiles = [];
        renderAll();
        setStatus('New board (fallback)');
      }
    }
  }

  // ================================================================
  //  4. SAVE BOARD
  // ================================================================
  async function saveBoard() {
    if (!board) return;
    try {
      if (sb && boardId && boardId !== 'local') {
        await sb.from('boards').update({ title: board.title }).eq('id', boardId);
        await sb.from('tiles').delete().eq('board_id', boardId);
        if (tiles.length > 0) {
          const tilesToInsert = tiles.map(t => ({
            board_id: boardId,
            type: t.type,
            source: t.source || 'library',
            content: t.content,
            x: t.x,
            y: t.y,
            w: t.w,
            h: t.h,
            z: t.z || 1,
          }));
          const { error: insertError } = await sb.from('tiles').insert(tilesToInsert);
          if (insertError) throw insertError;
        }
        setStatus('Saved to Supabase');
      } else {
        // localStorage fallback
        const boardData = {
          title: board.title,
          tiles: tiles,
          width: board.width || 1600,
          height: board.height || 1600,
        };
        localStorage.setItem(`focyl_board_${session.email}`, JSON.stringify(boardData));
        setStatus('Saved to localStorage');
      }
    } catch (err) {
      console.error('Save error:', err);
      // Final fallback: always save to localStorage
      const boardData = {
        title: board.title,
        tiles: tiles,
        width: board.width || 1600,
        height: board.height || 1600,
      };
      localStorage.setItem(`focyl_board_${session.email}`, JSON.stringify(boardData));
      setStatus('Saved to localStorage (fallback)');
    }
  }

  // ================================================================
  //  5. RENDER
  // ================================================================
  function renderAll() {
    const w = board?.width || 1600;
    const h = board?.height || 1600;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.innerHTML = '';
    tiles.forEach(renderTile);
    // Center scroll
    canvasWrap.scrollLeft = w / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = h / 2 - canvasWrap.clientHeight / 2;
  }

  function renderTile(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.id = t.id;
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    el.style.width = t.w + 'px';
    el.style.height = t.h + 'px';

    // --- IMAGE ---
    if (t.type === 'image') {
      el.classList.add('image-tile');
      // Use a background image with contain to show full image
      el.style.backgroundImage = `url('${t.content.url}')`;
      el.style.backgroundSize = 'contain';
      el.style.backgroundRepeat = 'no-repeat';
      el.style.backgroundPosition = 'center';
      // AI redesign button
      const aiBtn = document.createElement('button');
      aiBtn.className = 'redesign-btn';
      aiBtn.textContent = '✨ Redesign';
      aiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        redesignImageTile(t.id);
      });
      el.appendChild(aiBtn);
      // Resize handle
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.addEventListener('mousedown', (e) => { e.stopPropagation(); startResize(e, el, t); });
      handle.addEventListener('touchstart', (e) => { e.stopPropagation(); startResize(e, el, t); });
      el.appendChild(handle);
    }

    // --- TEXT ---
    else if (t.type === 'text') {
      el.classList.add('text-tile');
      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = true;
      content.textContent = t.content.text || 'Edit me';
      content.style.fontFamily = t.content.fontFamily || "'Space Grotesk', sans-serif";
      content.style.fontSize = (t.content.fontSize || 32) + 'px';
      content.style.color = t.content.color || '#EDEFF7';
      content.addEventListener('input', () => {
        t.content.text = content.textContent;
        saveBoard();
      });
      el.appendChild(content);
      // Resize handle
      const handle = document.createElement('div');
      handle.className = 'resize-handle';
      handle.addEventListener('mousedown', (e) => { e.stopPropagation(); startResize(e, el, t); });
      handle.addEventListener('touchstart', (e) => { e.stopPropagation(); startResize(e, el, t); });
      el.appendChild(handle);
    }

    // --- AUDIO ---
    else if (t.type === 'audio') {
      el.classList.add('audio-tile');
      const playBtn = document.createElement('div');
      playBtn.className = 'play-btn';
      playBtn.textContent = '▶';
      const progress = document.createElement('div');
      progress.className = 'progress-bar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      progress.appendChild(fill);
      const label = document.createElement('div');
      label.className = 'audio-label';
      label.textContent = t.content.name || 'Audio';
      el.appendChild(playBtn);
      el.appendChild(progress);
      el.appendChild(label);

      const audio = document.createElement('audio');
      audio.src = t.content.url;
      audio.preload = 'metadata';
      let playing = false;
      const updateProgress = () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          fill.style.width = pct + '%';
        }
      };
      audio.addEventListener('timeupdate', updateProgress);
      el.addEventListener('click', () => {
        if (playing) {
          audio.pause();
          playBtn.textContent = '▶';
          playing = false;
        } else {
          audio.play();
          playBtn.textContent = '⏸';
          playing = true;
        }
      });
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        playing = false;
        fill.style.width = '0%';
      });
      el._audio = audio;
    }

    // --- DELETE ---
    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      tiles = tiles.filter(x => x.id !== t.id);
      saveBoard();
      el.remove();
    });
    el.appendChild(del);

    // --- DRAG ---
    makeDraggable(el, t.id);
    canvas.appendChild(el);
  }

  // ================================================================
  //  6. DRAG & RESIZE
  // ================================================================
  function makeDraggable(el, id) {
    let startX, startY, origLeft, origTop, dragging = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.del') || e.target.closest('.resize-handle') || e.target.closest('.redesign-btn')) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(el.style.left); origTop = parseFloat(el.style.top);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      el.style.left = (origLeft + e.clientX - startX) + 'px';
      el.style.top = (origTop + e.clientY - startY) + 'px';
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      const x = parseFloat(el.style.left), y = parseFloat(el.style.top);
      const tile = tiles.find(t => t.id === id);
      if (tile) { tile.x = x; tile.y = y; saveBoard(); }
      setStatus('Saved');
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  function startResize(e, el, tile) {
    const startX = e.clientX || e.touches[0].clientX;
    const startY = e.clientY || e.touches[0].clientY;
    const origW = parseFloat(el.style.width);
    const origH = parseFloat(el.style.height);

    const onMove = (ev) => {
      const cx = ev.clientX || ev.touches[0].clientX;
      const cy = ev.clientY || ev.touches[0].clientY;
      const dx = cx - startX;
      const dy = cy - startY;
      const newW = Math.max(60, origW + dx);
      const newH = Math.max(40, origH + dy);
      el.style.width = newW + 'px';
      el.style.height = newH + 'px';
      tile.w = newW;
      tile.h = newH;
    };
    const onEnd = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
      saveBoard();
      setStatus('Resized');
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove);
    document.addEventListener('touchend', onEnd);
    e.preventDefault();
  }

  // ================================================================
  //  7. ADD TILE
  // ================================================================
  function addTile(partial) {
    const newTile = {
      id: crypto.randomUUID(),
      board_id: boardId || 'local',
      x: canvasWrap.scrollLeft + 60,
      y: canvasWrap.scrollTop + 60,
      w: 160,
      h: 160,
      z: 1,
      source: 'library',
      ...partial
    };
    tiles.push(newTile);
    renderTile(newTile);
    saveBoard();
    setStatus('Added');
  }

  // ================================================================
  //  8. PHOTO SEARCH
  // ================================================================
  async function searchPhotos(query) {
    const hint = document.getElementById('photoHint');
    const results = document.getElementById('results');
    results.innerHTML = '';
    hint.textContent = 'Searching...';

    if (TILE_CONFIG.unsplashKey) {
      try {
        const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=9&client_id=${TILE_CONFIG.unsplashKey}`);
        const data = await res.json();
        (data.results || []).forEach(p => addResultThumb(p.urls.small, p.urls.regular));
        hint.textContent = '';
      } catch (e) { hint.textContent = 'Unsplash error'; }
      return;
    }
    if (TILE_CONFIG.pexelsKey) {
      try {
        const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=9`, {
          headers: { Authorization: TILE_CONFIG.pexelsKey }
        });
        const data = await res.json();
        (data.photos || []).forEach(p => addResultThumb(p.src.medium, p.src.large));
        hint.textContent = '';
      } catch (e) { hint.textContent = 'Pexels error'; }
      return;
    }
    hint.textContent = 'No photo API key set – add one in TILE_CONFIG.';
  }

  function addResultThumb(thumbUrl, fullUrl) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.backgroundImage = `url('${thumbUrl}')`;
    div.addEventListener('click', () => {
      addTile({ type: 'image', content: { url: fullUrl }, source: 'api' });
      // close sheet
      document.getElementById('sheet').classList.remove('open');
      document.getElementById('scrim').classList.remove('open');
    });
    document.getElementById('results').appendChild(div);
  }

  // ================================================================
  //  9. IMAGE UPLOAD (resize)
  // ================================================================
  function handleFileUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 800;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        addTile({ type: 'image', content: { url: dataUrl }, source: 'upload' });
        // close sheet
        document.getElementById('sheet').classList.remove('open');
        document.getElementById('scrim').classList.remove('open');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ================================================================
  //  10. AUDIO UPLOAD
  // ================================================================
  function handleAudioUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      addTile({
        type: 'audio',
        content: { url: dataUrl, name: file.name },
        w: 180,
        h: 120,
      });
      document.getElementById('sheet').classList.remove('open');
      document.getElementById('scrim').classList.remove('open');
    };
    reader.readAsDataURL(file);
  }

  // ================================================================
  //  11. AI REDESIGN
  // ================================================================
  async function redesignImageTile(tileId) {
    const tile = tiles.find(t => t.id === tileId);
    if (!tile || tile.type !== 'image') return;
    const prompt = 'A vision board, motivational, future self, success, vibrant, professional, high quality';
    if (!TILE_CONFIG.hfToken) {
      alert('Please set your Hugging Face token in TILE_CONFIG.hfToken');
      return;
    }
    try {
      const response = await fetch(
        `https://api-inference.huggingface.co/models/${TILE_CONFIG.hfModel}`,
        {
          headers: { Authorization: `Bearer ${TILE_CONFIG.hfToken}` },
          method: 'POST',
          body: JSON.stringify({ inputs: prompt }),
        }
      );
      if (!response.ok) throw new Error('HF API error: ' + response.status);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      tile.content.url = url;
      const el = document.querySelector(`.tile[data-id="${tile.id}"]`);
      if (el) {
        el.style.backgroundImage = `url('${url}')`;
      }
      saveBoard();
      setStatus('AI redesign complete');
    } catch (err) {
      alert('AI redesign failed: ' + err.message);
    }
  }

  // ================================================================
  //  12. AUTOSAVE
  // ================================================================
  setInterval(saveBoard, 30000);
  window.addEventListener('beforeunload', () => { saveBoard(); });

  // Restore canvas size from localStorage (run after load)
  document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem(`focyl_board_size_${session?.id}`);
    if (saved && board) {
      try {
        const { w, h } = JSON.parse(saved);
        board.width = w;
        board.height = h;
        document.getElementById('canvasWidth').value = w;
        document.getElementById('canvasHeight').value = h;
      } catch (e) {}
    }
  });
</script>
</body>
