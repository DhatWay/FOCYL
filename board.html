<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, viewport-fit=cover, user-scalable=no">
  <title>Focyl — Board</title>
  <meta name="theme-color" content="#070914">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&family=Great+Vibes&family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== YOUR ORIGINAL DESIGN – UNTOUCHED ===== */
    :root {
      --void: #070914; --ink: #0d1224; --ink-2: #121a34;
      --line: rgba(237,239,247,0.09); --paper: #EDEFF7; --mist: #9AA4C7;
      --cyan: #35D8F0; --violet: #8B7CF6; --magenta: #EA4FC9;
      --grad: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--magenta));
      --glow: 0 0 40px rgba(139,124,246,0.3);
      --display: 'Space Grotesk', sans-serif;
      --body: 'Sora', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--void); color: var(--paper);
      font-family: var(--body); overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 60vmax; height: 60vmax;
      border-radius: 50%; filter: blur(90px); opacity: 0.14;
      pointer-events: none; z-index: 0;
    }
    body::before { top: -20vmax; left: -15vmax; background: var(--cyan); }
    body::after { bottom: -25vmax; right: -20vmax; background: var(--magenta); }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(7,9,20,0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      height: 56px;
    }
    .topbar .left {
      display: flex; align-items: center; gap: 10px;
      flex: 1; min-width: 0;
    }
    .topbar .back { background: transparent; border: none; color: var(--mist); font-size: 0.85rem; cursor: pointer; font-family: inherit; padding: 4px 0; }
    .topbar .title { font-family: var(--display); font-weight: 600; font-size: 1rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .right {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .topbar .status { font-family: var(--mono); font-size: 0.6rem; color: var(--mist); white-space: nowrap; }
    .topbar .zoom-controls { display: flex; gap: 3px; align-items: center; }
    .topbar .zoom-controls button {
      background: var(--ink-2); border: 1px solid var(--line); color: var(--paper);
      border-radius: 4px; padding: 1px 6px; font-size: 0.65rem; cursor: pointer;
      font-family: inherit; line-height: 1.5;
    }
    .topbar .zoom-controls button:hover { background: var(--violet); color: #070914; }
    .topbar .zoom-level { font-family: var(--mono); font-size: 0.6rem; color: var(--mist); min-width: 32px; text-align: center; }
    .topbar .profile { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .topbar .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--ink-2); border: 1px solid var(--line);
      background-size: cover; background-position: center;
      flex-shrink: 0; cursor: pointer;
    }
    .topbar .avatar:hover { border-color: var(--violet); }
    .topbar .display-name {
      font-size: 0.75rem; color: var(--paper); font-weight: 500;
      max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .canvas-wrap {
      position: absolute; inset: 0; top: 56px; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .canvas {
      position: relative;
      background-image: radial-gradient(rgba(237,239,247,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      transition: width 0.3s, height 0.3s;
      transform-origin: 0 0;
    }
    .canvas::before, .canvas::after {
      content: ""; position: absolute; width: 600px; height: 600px;
      border-radius: 50%; filter: blur(150px); opacity: 0.08; pointer-events: none;
    }
    .canvas::before { top: -200px; left: -200px; background: var(--cyan); }
    .canvas::after { bottom: -200px; right: -200px; background: var(--magenta); }

    /* ===== TILES – NO BORDERS, NO BUTTONS (except X & Recreate) ===== */
    .tile {
      position: absolute;
      border-radius: 16px;
      border: none;
      box-shadow: 0 14px 30px -16px rgba(0,0,0,0.7), var(--glow);
      touch-action: none;
      cursor: grab;
      overflow: visible;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: var(--ink);
      transition: box-shadow 0.2s;
      will-change: transform;
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging { z-index: 50; box-shadow: 0 24px 50px -18px rgba(0,0,0,0.85), 0 0 60px rgba(139,124,246,0.2); }

    .tile.text-tile {
      background: transparent !important;
      box-shadow: none !important;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    .tile.text-tile .text-content {
      outline: none;
      word-break: break-word;
      text-align: center;
      line-height: 1.2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile.text-tile .text-content:focus { outline: 2px solid var(--violet); }

    /* Delete button – only visible on hover */
    .tile .del {
      position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
      border-radius: 50%; background: rgba(7,9,20,0.7);
      border: 1px solid var(--line); color: var(--paper);
      font-family: var(--mono); font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 10;
      backdrop-filter: blur(4px);
    }
    .tile:hover .del, .tile.dragging .del { opacity: 1; }

    /* Recreate button – only on image tiles */
    .tile .recreate-btn {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(7,9,20,0.7); border: 1px solid var(--violet); color: white;
      border-radius: 20px; padding: 3px 10px; font-size: 0.65rem;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 6; font-family: inherit;
      backdrop-filter: blur(4px);
    }
    .tile:hover .recreate-btn { opacity: 1; }

    .tile.audio-tile {
      background: var(--ink-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px;
      cursor: pointer;
    }
    .tile.audio-tile .play-btn { font-size: 2rem; margin-bottom: 6px; filter: drop-shadow(0 0 10px rgba(53,216,240,0.3)); }
    .tile.audio-tile .progress-bar { width: 80%; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .tile.audio-tile .progress-bar .fill { height: 100%; width: 0%; background: var(--grad); }
    .tile.audio-tile .audio-label { font-size: 0.7rem; color: var(--mist); margin-top: 4px; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .fab {
      position: fixed; right: 20px; bottom: 26px; z-index: 20;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--grad); border: none; cursor: pointer;
      box-shadow: 0 14px 30px -10px rgba(139,124,246,0.6), var(--glow);
      display: flex; align-items: center; justify-content: center;
    }
    .fab svg { width: 22px; height: 22px; stroke: #070914; stroke-width: 2.4; }

    .scrim {
      position: fixed; inset: 0; background: rgba(7,9,20,0.6);
      z-index: 30; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--ink);
      border: 1px solid var(--line); border-bottom: none;
      border-radius: 22px 22px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      max-height: 80vh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 18px; }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 18px;
      background: var(--ink-2); border-radius: 100px; padding: 4px;
      overflow-x: auto;
      flex-wrap: nowrap;
    }
    .tab {
      flex: 0 0 auto; text-align: center; padding: 9px 14px; border-radius: 100px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; color: var(--mist);
      border: none; background: transparent; font-family: inherit;
      white-space: nowrap;
    }
    .tab.active { background: var(--grad); color: #070914; }

    .panel { display: none; }
    .panel.active { display: block; }

    label {
      display: block; font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--mist);
      margin: 0 0 6px;
    }
    input, textarea, select {
      width: 100%; background: var(--ink-2); border: 1px solid var(--line);
      color: var(--paper); border-radius: 12px; padding: 12px 14px;
      font-family: var(--body); font-size: 0.95rem; margin-bottom: 12px;
      resize: none;
    }
    input[type="color"] { padding: 4px; height: 44px; cursor: pointer; }
    select { appearance: none; }
    .btn-primary {
      width: 100%; background: var(--grad); color: #070914; border: none;
      border-radius: 100px; padding: 13px 0; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-ghost {
      width: 100%; background: transparent; border: 1px dashed rgba(237,239,247,0.25);
      color: var(--paper); border-radius: 14px; padding: 13px 0; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; margin-bottom: 10px;
    }
    .hint { font-family: var(--mono); font-size: 0.75rem; color: var(--mist); margin: 0 0 12px; }
    .results {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 10px;
    }
    .results .thumb {
      aspect-ratio: 1/1; border-radius: 10px; background-size: cover; background-position: center;
      border: 1px solid var(--line); cursor: pointer; background-color: var(--ink-2);
    }
    input[type="file"] { display: none; }

    .font-size-control {
      display: flex; align-items: center; gap: 10px;
    }
    .font-size-control input[type="range"] { flex: 1; margin: 0; }
    .font-size-control span { font-family: var(--mono); font-size: 0.9rem; min-width: 40px; }

    .crop-row { display: flex; gap: 10px; }
    .crop-row input { flex: 1; }

    @media (max-width: 600px) { .sheet { padding: 16px; } }

    /* ===== LIBRARY GRID ===== */
    .library-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }
    .library-item {
      aspect-ratio: 1/1;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--ink-2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      padding: 8px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--mist);
      overflow: hidden;
      position: relative;
    }
    .library-item:hover {
      transform: scale(1.03);
      border-color: var(--violet);
    }
    .library-item .preview {
      width: 100%;
      height: 60%;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
      margin-bottom: 4px;
    }
    .library-item .label {
      font-size: 0.6rem;
      color: var(--paper);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .library-category-title {
      font-family: var(--display);
      font-size: 0.9rem;
      color: var(--paper);
      margin: 16px 0 8px;
    }
    .library-category-title:first-of-type { margin-top: 0; }

    #debug {
      position: fixed; bottom: 80px; left: 20px; z-index: 999;
      background: rgba(0,0,0,0.8); color: #0f0; padding: 4px 8px;
      font-family: monospace; font-size: 0.55rem;
      border-radius: 4px; max-width: 70%;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: break-all;
      opacity: 0.6;
    }
    #avatarInput { display: none; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="left">
    <button class="back" id="backBtn" onclick="window.location.href='index.html'">← Focyl</button>
    <span class="title" id="boardTitle">My Board</span>
  </div>
  <div class="right">
    <div class="zoom-controls">
      <button onclick="adjustZoom(-0.1)">−</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button onclick="adjustZoom(0.1)">+</button>
      <button onclick="resetZoom()">⟲</button>
    </div>
    <span class="status" id="statusText">Ready</span>
    <div class="profile" id="profileArea">
      <div class="avatar" id="avatarDisplay" title="Click to change avatar"></div>
      <span class="display-name" id="displayNameDisplay">User</span>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" aria-label="Add tile" onclick="openSheet()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#070914" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- SHEET -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="tabs">
    <button class="tab active" id="tabPhoto" onclick="switchTab('photo')">Photo</button>
    <button class="tab" id="tabWords" onclick="switchTab('words')">Words</button>
    <button class="tab" id="tabAudio" onclick="switchTab('audio')">Audio</button>
    <button class="tab" id="tabLibraries" onclick="switchTab('libraries')">Libraries</button>
    <button class="tab" id="tabSettings" onclick="switchTab('settings')">Settings</button>
  </div>

  <!-- Photo Panel -->
  <div class="panel active" id="panelPhoto">
    <label for="photoQuery">Search free photos</label>
    <input type="text" id="photoQuery" placeholder="studio, mid thirties…">
    <button class="btn-primary" id="searchBtn" onclick="doSearch()">Search</button>
    <div class="results" id="results"></div>
    <p class="hint" id="photoHint"></p>
    <label>Or use your own</label>
    <button class="btn-ghost" id="uploadBtn" onclick="document.getElementById('fileInput').click()">Upload from device (resized)</button>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
  </div>

  <!-- Words Panel -->
  <div class="panel" id="panelWords">
    <label for="quoteText">In your own words, future tense</label>
    <textarea id="quoteText" rows="2" placeholder="I run my own studio."></textarea>
    <div class="font-size-control">
      <label>Font size</label>
      <input type="range" id="textSizeSlider" min="12" max="120" value="32" oninput="document.getElementById('textSizeDisplay').textContent=this.value+'px'">
      <span id="textSizeDisplay">32px</span>
    </div>
    <label>Font family</label>
    <select id="fontFamilySelect">
      <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
      <option value="'Sora', sans-serif">Sora</option>
      <option value="'Inter', sans-serif">Inter</option>
      <option value="'Playfair Display', serif">Playfair Display</option>
      <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      <option value="'Great Vibes', cursive">Great Vibes</option>
      <option value="'Caveat', cursive">Caveat</option>
      <option value="'Georgia', serif">Georgia</option>
    </select>
    <label>Font color</label>
    <input type="color" id="textColorPicker" value="#EDEFF7">
    <button class="btn-primary" id="addTextBtn" onclick="addTextTile()">Add Text Tile</button>
  </div>

  <!-- Audio Panel -->
  <div class="panel" id="panelAudio">
    <label>Upload an MP3 from your device</label>
    <button class="btn-ghost" id="uploadAudioBtn" onclick="document.getElementById('audioInput').click()">Choose MP3</button>
    <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioUpload(event)">
    <p class="hint">Tap the tile to play/pause.</p>
  </div>

  <!-- Libraries Panel -->
  <div class="panel" id="panelLibraries">
    <p class="hint">Tap an asset to add it to your board.</p>

    <div class="library-category-title">Images</div>
    <div class="library-grid" id="libImages"></div>

    <div class="library-category-title">Boarder Designs</div>
    <div class="library-grid" id="libBoarders"></div>

    <div class="library-category-title">Ribbons</div>
    <div class="library-grid" id="libRibbons"></div>

    <div class="library-category-title">Papers</div>
    <div class="library-grid" id="libPapers"></div>

    <div class="library-category-title">Canvases</div>
    <div class="library-grid" id="libCanvases"></div>

    <div class="library-category-title">Posted Notes</div>
    <div class="library-grid" id="libNotes"></div>

    <div class="library-category-title">Fonts</div>
    <div class="library-grid" id="libFonts"></div>
  </div>

  <!-- Settings Panel -->
  <div class="panel" id="panelSettings">
    <label>Canvas Size (pixels)</label>
    <div class="crop-row">
      <input type="number" id="canvasWidth" value="1600" step="100" min="400">
      <input type="number" id="canvasHeight" value="1600" step="100" min="400">
    </div>
    <button class="btn-primary" id="resizeCanvasBtn" onclick="resizeCanvas()">Resize Board</button>
    <hr style="border-color:var(--line);margin:16px 0;">
    <label>Display Name</label>
    <input type="text" id="displayNameInput" placeholder="Your display name" onchange="updateDisplayName()">
    <button class="btn-ghost" onclick="document.getElementById('avatarInput').click()">Change Avatar</button>
    <p class="hint">Click your avatar in the top bar to change it.</p>
  </div>
</div>

<!-- DEBUG -->
<div id="debug">⏳ Loading...</div>

<script>
  // ================================================================
  //  CONFIG & SESSION
  // ================================================================
  const SUPABASE_URL = 'https://ufkgmldvclvkzvznsxbs.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVma2dtbGR2Y2x2a3p2em5zeGJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NjI1MjksImV4cCI6MjEwMzQzODUyOX0.k37JPrSqcDC1zTfh3GYYo71PpWbSAD_Jr0FmhFMqD5o';

  const TILE_CONFIG = {
    unsplashKey: '',
    pexelsKey: '',
    hfToken: '',
    hfModel: 'stabilityai/stable-diffusion-2-1',
  };

  const session = JSON.parse(localStorage.getItem('focyl_user') || 'null');
  if (!session) { window.location.href = 'auth.html'; }

  let sb = null;
  try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch(e) {}

  // ================================================================
  //  STATE
  // ================================================================
  let board = null;
  let tiles = [];
  let boardId = null;
  let scale = 1;
  const MIN_SCALE = 0.15;
  const MAX_SCALE = 3;

  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvasWrap');
  const statusText = document.getElementById('statusText');
  const zoomLevel = document.getElementById('zoomLevel');
  const avatarDisplay = document.getElementById('avatarDisplay');
  const displayNameDisplay = document.getElementById('displayNameDisplay');

  function setStatus(t) { if (statusText) statusText.textContent = t; log('Status: ' + t); }
  function log(msg) {
    const d = document.getElementById('debug');
    if (d) d.textContent = msg;
    console.log(msg);
  }

  // ================================================================
  //  PROFILE
  // ================================================================
  let profileData = { display_name: session.email.split('@')[0], avatar_url: null };
  const savedProfile = localStorage.getItem(`focyl_profile_${session.email}`);
  if (savedProfile) {
    try {
      const parsed = JSON.parse(savedProfile);
      profileData.display_name = parsed.display_name || profileData.display_name;
      profileData.avatar_url = parsed.avatar_url || null;
    } catch(e) {}
  }
  updateProfileUI();

  function updateProfileUI() {
    displayNameDisplay.textContent = profileData.display_name;
    document.getElementById('displayNameInput').value = profileData.display_name;
    if (profileData.avatar_url) {
      avatarDisplay.style.backgroundImage = `url('${profileData.avatar_url}')`;
      avatarDisplay.style.backgroundSize = 'cover';
      avatarDisplay.style.backgroundPosition = 'center';
    } else {
      avatarDisplay.style.backgroundImage = '';
      avatarDisplay.style.backgroundColor = 'var(--ink-2)';
    }
  }

  avatarDisplay.addEventListener('click', () => document.getElementById('avatarInput').click());
  document.getElementById('avatarInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = h * max / w; w = max; }
        else if (h > max) { w = w * max / h; h = max; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.8);
        profileData.avatar_url = dataUrl;

  // ================================================================
  //  ZOOM
  // ================================================================
  function applyZoom() {
    canvas.style.transform = `scale(${scale})`;
    zoomLevel.textContent = Math.round(scale * 100) + '%';
  }
  window.adjustZoom = function(delta) {
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
    applyZoom();
  };
  window.resetZoom = function() {
    scale = 1;
    applyZoom();
    const w = board?.width || 1600;
    const h = board?.height || 1600;
    canvasWrap.scrollLeft = (w * scale) / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = (h * scale) / 2 - canvasWrap.clientHeight / 2;
  };

  canvasWrap.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      const rect = canvasWrap.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const scrollLeft = canvasWrap.scrollLeft + mx;
      const scrollTop = canvasWrap.scrollTop + my;
      const ratio = newScale / scale;
      scale = newScale;
      applyZoom();
      canvasWrap.scrollLeft = scrollLeft * ratio - mx;
      canvasWrap.scrollTop = scrollTop * ratio - my;
    }
  }, { passive: false });

  let lastPinchDist = 0;
  canvasWrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinchDist = Math.sqrt(dx*dx + dy*dy);
    }
  }, { passive: true });

  canvasWrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const delta = (dist - lastPinchDist) / 500;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      const rect = canvasWrap.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const scrollLeft = canvasWrap.scrollLeft + mx;
      const scrollTop = canvasWrap.scrollTop + my;
      const ratio = newScale / scale;
      scale = newScale;
      applyZoom();
      canvasWrap.scrollLeft = scrollLeft * ratio - mx;
      canvasWrap.scrollTop = scrollTop * ratio - my;
      lastPinchDist = dist;
    }
  }, { passive: true });

  // ================================================================
  //  LOAD BOARD
  // ================================================================
  async function loadBoard() {
    log('Loading board...');
    try {
      if (sb) {
        const { data: boardData, error: boardError } = await sb
          .from('boards')
          .select('*')
          .eq('user_id', session.id)
          .maybeSingle();
        if (boardError && boardError.code !== 'PGRST116') throw new Error('Supabase board fetch failed');
        if (boardData) {
          board = boardData;
          boardId = board.id;
          document.getElementById('boardTitle').textContent = board.title;
          const { data: tileData, error: tileError } = await sb
            .from('tiles')
            .select('*')
            .eq('board_id', boardId)
            .order('z', { ascending: true });
          if (tileError) throw tileError;
          tiles = tileData || [];
          renderAll();
          setStatus('Loaded from Supabase');
          log('Loaded ' + tiles.length + ' tiles from Supabase');
          return;
        }
      }
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage');
        log('Loaded ' + tiles.length + ' tiles from localStorage');
        return;
      }
      board = { title: 'My Board', width: 1600, height: 1600 };
      tiles = [];
      renderAll();
      setStatus('New board');
    } catch (err) {
      log('Load error: ' + err.message);
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage (fallback)');
      } else {
        board = { title: 'My Board', width: 1600, height: 1600 };
        tiles = [];
        renderAll();
        setStatus('New board (fallback)');
      }
    }
  }

  // ================================================================
  //  SAVE BOARD
  // ================================================================
  async function saveBoard() {
    if (!board) return;
    try {
      if (sb && boardId && boardId !== 'local') {
        await sb.from('boards').update({ title: board.title }).eq('id', boardId);
        await sb.from('tiles').delete().eq('board_id', boardId);
        if (tiles.length > 0) {
          const tilesToInsert = tiles.map(t => ({
            board_id: boardId,
            type: t.type,
            source: t.source || 'library',
            content: t.content,
            x: t.x,
            y: t.y,
            w: t.w,
            h: t.h,
            z: t.z || 1,
            rotation: t.rotation || 0,
          }));
          const { error: insertError } = await sb.from('tiles').insert(tilesToInsert);
          if (insertError) throw insertError;
        }
        setStatus('Saved to Supabase');
      } else {
        const boardData = {
          title: board.title,
          tiles: tiles,
          width: board.width || 1600,
          height: board.height || 1600,
        };
        localStorage.setItem(`focyl_board_${session.email}`, JSON.stringify(boardData));
        setStatus('Saved to localStorage');
      }
    } catch (err) {
      log('Save error: ' + err.message);
      const boardData = {
        title: board.title,
        tiles: tiles,
        width: board.width || 1600,
        height: board.height || 1600,
      };
      localStorage.setItem(`focyl_board_${session.email}`, JSON.stringify(boardData));
      setStatus('Saved to localStorage (fallback)');
    }
  }

  // ================================================================
  //  RENDER – NO BUTTONS EXCEPT X + RECREATE (on images)
  // ================================================================
  function renderAll() {
    const w = board?.width || 1600;
    const h = board?.height || 1600;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.innerHTML = '';
    tiles.forEach(renderTile);
    applyZoom();
    canvasWrap.scrollLeft = (w * scale) / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = (h * scale) / 2 - canvasWrap.clientHeight / 2;
  }

  function renderTile(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.dataset.id = t.id;
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    el.style.width = t.w + 'px';
    el.style.height = t.h + 'px';
    if (t.rotation) {
      el.style.transform = `rotate(${t.rotation}deg)`;
    }

    // ---- IMAGE ----
    if (t.type === 'image') {
      el.style.backgroundImage = `url('${t.content.url}')`;
      // Recreate button (AI redesign)
      const recreateBtn = document.createElement('button');
      recreateBtn.className = 'recreate-btn';
      recreateBtn.textContent = '✨ Recreate';
      recreateBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        redesignImageTile(t.id);
      });
      el.appendChild(recreateBtn);
    }

    // ---- TEXT ----
    else if (t.type === 'text') {
      el.classList.add('text-tile');
      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = true;
      content.textContent = t.content.text || 'Edit me';
      content.style.fontFamily = t.content.fontFamily || "'Space Grotesk', sans-serif";
      content.style.fontSize = (t.content.fontSize || 32) + 'px';
      content.style.color = t.content.color || '#EDEFF7';
      content.addEventListener('input', () => {
        t.content.text = content.textContent;
        saveBoard();
      });
      el.appendChild(content);
    }

    // ---- AUDIO ----
    else if (t.type === 'audio') {
      el.classList.add('audio-tile');
      const playBtn = document.createElement('div');
      playBtn.className = 'play-btn';
      playBtn.textContent = '▶';
      const progress = document.createElement('div');
      progress.className = 'progress-bar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      progress.appendChild(fill);
      const label = document.createElement('div');
      label.className = 'audio-label';
      label.textContent = t.content.name || 'Audio';
      el.appendChild(playBtn);
      el.appendChild(progress);
      el.appendChild(label);

      const audio = document.createElement('audio');
      audio.src = t.content.url;
      audio.preload = 'metadata';
      let playing = false;
      const updateProgress = () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          fill.style.width = pct + '%';
        }
      };
      audio.addEventListener('timeupdate', updateProgress);
      el.addEventListener('click', () => {
        if (playing) {
          audio.pause();
          playBtn.textContent = '▶';
          playing = false;
        } else {
          audio.play();
          playBtn.textContent = '⏸';
          playing = true;
        }
      });
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        playing = false;
        fill.style.width = '0%';
      });
      el._audio = audio;
    }

    // ---- DELETE (X) ----
    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      tiles = tiles.filter(x => x.id !== t.id);
      saveBoard();
      el.remove();
    });
    el.appendChild(del);

    // ---- DRAG ----
    makeDraggable(el, t);

    // ---- GESTURES: PINCH TO RESIZE, TWO-FINGER ROTATE ----
    setupTileGestures(el, t);

    canvas.appendChild(el);
  }

  // ================================================================
  //  DRAG (with boundary clamping)
  // ================================================================
  function makeDraggable(el, tile) {
    let startX, startY, origLeft, origTop, dragging = false;
    el.addEventListener('pointerdown', (e) => {
      // Ignore if click on delete or recreate button
      if (e.target.closest('.del') || e.target.closest('.recreate-btn')) return;
      // If it's a multi-touch, we handle it in gestures
      if (e.pointerType === 'touch' && e.buttons !== 1) return;
      dragging = true;
      el.classList.add('dragging');
      el.setPointerCapture(e.pointerId);
      startX = e.clientX; startY = e.clientY;
      origLeft = parseFloat(el.style.left); origTop = parseFloat(el.style.top);
    });
    el.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      let newX = origLeft + e.clientX - startX;
      let newY = origTop + e.clientY - startY;
      const bw = board?.width || 1600;
      const bh = board?.height || 1600;
      const tw = tile.w;
      const th = tile.h;
      newX = Math.max(0, Math.min(bw - tw, newX));
      newY = Math.max(0, Math.min(bh - th, newY));
      el.style.left = newX + 'px';
      el.style.top = newY + 'px';
      tile.x = newX;
      tile.y = newY;
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      saveBoard();
    }
    el.addEventListener('pointerup', endDrag);
    el.addEventListener('pointercancel', endDrag);
  }

  // ================================================================
  //  GESTURES: PINCH TO RESIZE, TWO-FINGER ROTATE
  //  (on the tile itself, not the canvas)
  // ================================================================
  function setupTileGestures(el, tile) {
    let initialDist = 0;
    let initialScale = 1;
    let initialAngle = 0;
    let initialRotation = 0;
    let active = false;

    el.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        active = true;
        const t1 = e.touches[0];
        const t2 = e.touches[1];
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        initialDist = Math.sqrt(dx*dx + dy*dy);
        initialScale = tile.w / 160; // relative to base size (160 default)
        // Angle
        const rect = el.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const angle1 = Math.atan2(t1.clientY - cy, t1.clientX - cx);
        const angle2 = Math.atan2(t2.clientY - cy, t2.clientX - cx);
        initialAngle = angle2 - angle1;
        initialRotation = tile.rotation || 0;
        e.preventDefault();
      }
    }, { passive: false });

    el.addEventListener('touchmove', (e) => {
      if (!active || e.touches.length !== 2) return;
      const t1 = e.touches[0];
      const t2 = e.touches[1];
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const scaleFactor = dist / initialDist;
      const newSize = Math.max(60, Math.min(600, 160 * initialScale * scaleFactor));
      const rect = el.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const angle1 = Math.atan2(t1.clientY - cy, t1.clientX - cx);
      const angle2 = Math.atan2(t2.clientY - cy, t2.clientX - cx);
      const deltaAngle = (angle2 - angle1) - initialAngle;
      const newRot = initialRotation + deltaAngle * (180 / Math.PI);

      // Apply resize
      tile.w = newSize;
      tile.h = newSize;
      el.style.width = newSize + 'px';
      el.style.height = newSize + 'px';
      // Apply rotation
      tile.rotation = newRot;
      el.style.transform = `rotate(${newRot}deg)`;
      e.preventDefault();
    }, { passive: false });

    el.addEventListener('touchend', () => {
      if (active) {
        active = false;
        saveBoard();
      }
    });
  }

  // ================================================================
  //  ADD TILE
  // ================================================================
  function addTile(partial) {
    const newTile = {
      id: crypto.randomUUID(),
      board_id: boardId || 'local',
      x: Math.min(canvasWrap.scrollLeft / scale + 60, (board?.width || 1600) - 160),
      y: Math.min(canvasWrap.scrollTop / scale + 60, (board?.height || 1600) - 160),
      w: 160,
      h: 160,
      z: tiles.length + 1,
      source: 'library',
      rotation: 0,
      ...partial
    };
    tiles.push(newTile);
    renderTile(newTile);
    saveBoard();
    setStatus('Added');
  }

  window.handleFileUpload = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 800;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        addTile({ type: 'image', content: { url: dataUrl }, source: 'upload' });
        closeSheet();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  window.handleAudioUpload = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      addTile({ type: 'audio', content: { url: dataUrl, name: file.name }, w: 180, h: 120 });
      closeSheet();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  window.resizeCanvas = function() {

    const h = parseInt(document.getElementById('canvasHeight').value);

    if (board) {
      board.width = w;
      board.height = h;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      tiles.forEach(t => {
        t.x = Math.max(0, Math.min(w - t.w, t.x));
        t.y = Math.max(0, Math.min(h - t.h, t.y));
        const el = document.querySelector(`.tile[data-id="${t.id}"]`);
        if (el) { el.style.left = t.x + 'px'; el.style.top = t.y + 'px'; }
      });
      localStorage.setItem(`focyl_board_size_${session.id}`, JSON.stringify({ w, h }));
      saveBoard();
      setStatus('Canvas resized');
      closeSheet();
    }
  };

  // ================================================================

  // ================================================================
  async function searchPhotos(query) {
    const hint = document.getElementById('photoHint');
    const results = document.getElementById('results');
    results.innerHTML = '';
    hint.textContent = 'Searching...';
    if (TILE_CONFIG.unsplashKey) {
      try {
        const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=9&client_id=${TILE_CONFIG.unsplashKey}`);
        const data = await res.json();
        (data.results || []).forEach(p => addResultThumb(p.urls.small, p.urls.regular));
        hint.textContent = '';
      } catch (e) { hint.textContent = 'Unsplash error'; }
      return;
    }
    if (TILE_CONFIG.pexelsKey) {
      try {
        const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=9`, {
          headers: { Authorization: TILE_CONFIG.pexelsKey }
        });
        const data = await res.json();
        (data.photos || []).forEach(p => addResultThumb(p.src.medium, p.src.large));
        hint.textContent = '';
      } catch (e) { hint.textContent = 'Pexels error'; }
      return;
    }
    hint.textContent = 'No photo API key set – add one in TILE_CONFIG.';
  }

  function addResultThumb(thumbUrl, fullUrl) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.backgroundImage = `url('${thumbUrl}')`;
    div.addEventListener('click', () => {
      addTile({ type: 'image', content: { url: fullUrl }, source: 'api' });
      closeSheet();
    });
    document.getElementById('results').appendChild(div);
  }

  // ================================================================
  //  AI REDESIGN (for the Recreate button)
  // ================================================================
  async function redesignImageTile(tileId) {
    const tile = tiles.find(t => t.id === tileId);
    if (!tile || tile.type !== 'image') return;
    const prompt = 'A vision board, motivational, future self, success, vibrant, professional, high quality';
    if (!TILE_CONFIG.hfToken) {
      alert('Please set your Hugging Face token in TILE_CONFIG.hfToken');
      return;
    }
    try {
      const response = await fetch(
        `https://api-inference.huggingface.co/models/${TILE_CONFIG.hfModel}`,
        {
          headers: { Authorization: `Bearer ${TILE_CONFIG.hfToken}` },
          method: 'POST',
          body: JSON.stringify({ inputs: prompt }),
        }
      );
      if (!response.ok) throw new Error('HF API error: ' + response.status);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      tile.content.url = url;
      const el = document.querySelector(`.tile[data-id="${tile.id}"]`);
      if (el) {
        el.style.backgroundImage = `url('${url}')`;
      }
      saveBoard();
      setStatus('AI redesign complete');
    } catch (err) {
      alert('AI redesign failed: ' + err.message);
    }
  }

    renderLibraryGrid('libBoarders', boarderItems, (item) => {
      // Add as a border tile (maybe a colored rectangle with style)
      addTile({ type: 'image', content: { url: `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="200" height="200" fill="${item.color}" stroke="white" stroke-width="8"/><text x="100" y="100" font-size="16" fill="white" text-anchor="middle" dominant-baseline="central">${item.label}</text></svg>` }, source: 'library' });
    });

    // Ribbons
    const ribbonItems = [
      { label: 'Red', color: '#FF0000' },
      { label: 'Blue', color: '#0000FF' },
      { label: 'Gold', color: '#D4AF37' },
      { label: 'Silver', color: '#C0C0C0' },
      { label: 'Green', color: '#008000' },
      { label: 'Purple', color: '#800080' },
    ];
    renderLibraryGrid('libRibbons', ribbonItems, (item) => {
      // Ribbon as a text tile with special styling (e.g., background color)
      addTile({ type: 'text', content: { text: '🎀 ' + item.label, fontSize: 24, fontFamily: "'Great Vibes', cursive", color: item.color }, w: 180, h: 60 });
    });

    // Papers
    const paperItems = [
      { label: 'Lined', color: '#F5F5DC' },
      { label: 'Scroll', color: '#F0E68C' },
      { label: 'Grid', color: '#E8E8E8' },
      { label: 'Aged', color: '#D2B48C' },
      { label: 'Vintage', color: '#DEB887' },
      { label: 'Modern', color: '#FFFFFF' },
    ];
    renderLibraryGrid('libPapers', paperItems, (item) => {
      // Paper as a background tile (image or colored rect)
      addTile({ type: 'image', content: { url: `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="${item.color}" stroke="#ccc" stroke-width="1"/><text x="100" y="100" font-size="14" fill="#333" text-anchor="middle" dominant-baseline="central">${item.label}</text></svg>` }, source: 'library' });
    });

    // Canvases
    const canvasItems = [
      { label: 'White', color: '#FFFFFF' },
      { label: 'Beige', color: '#F5F5DC' },
      { label: 'Gray', color: '#808080' },
      { label: 'Black', color: '#000000' },
      { label: 'Blue', color: '#00008B' },
      { label: 'Green', color: '#006400' },
    ];
    renderLibraryGrid('libCanvases', canvasItems, (item) => {
      addTile({ type: 'image', content: { url: `data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="${item.color}" stroke="#888" stroke-width="2"/><text x="100" y="100" font-size="14" fill="${item.color === '#FFFFFF' || item.color === '#F5F5DC' ? '#333' : '#FFF'}" text-anchor="middle" dominant-baseline="central">${item.label}</text></svg>` }, source: 'library' });
    });

    // Posted Notes
    const noteItems = [
      { label: 'Yellow', color: '#FFD700' },
      { label: 'Pink', color: '#FFB6C1' },
      { label: 'Blue', color: '#87CEEB' },
      { label: 'Green', color: '#90EE90' },
      { label: 'Orange', color: '#FFA500' },
      { label: 'Purple', color: '#DDA0DD' },
    ];
    renderLibraryGrid('libNotes', noteItems, (item) => {
      addTile({ type: 'text', content: { text: '📝 Note', fontSize: 20, fontFamily: "'Caveat', cursive", color: '#333' }, w: 160, h: 120, bgColor: item.color });
    });

    // Fonts (they are listed in the Words panel already, but we can add quick font tiles)
    const fontItems = [
      { label: 'Great Vibes', font: "'Great Vibes', cursive" },
      { label: 'Caveat', font: "'Caveat', cursive" },
      { label: 'Space Grotesk', font: "'Space Grotesk', sans-serif" },
      { label: 'Playfair', font: "'Playfair Display', serif" },
      { label: 'Sora', font: "'Sora', sans-serif" },
      { label: 'Inter', font: "'Inter', sans-serif" },
    ];
    renderLibraryGrid('libFonts', fontItems, (item) => {
      addTile({ type: 'text', content: { text: item.label, fontSize: 24, fontFamily: item.font, color: '#EDEFF7' }, w: 180, h: 60 });
    });
  }

  function renderLibraryGrid(containerId, items, onClick) {
    const container = document.getElementById(containerId);
    if (!container) return;
    container.innerHTML = '';
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'library-item';
      const preview = document.createElement('div');
      preview.className = 'preview';
      preview.style.backgroundColor = item.color || '#2a2a3a';
      if (item.emoji) {
        preview.textContent = item.emoji;
        preview.style.display = 'flex';
        preview.style.alignItems = 'center';
        preview.style.justifyContent = 'center';
        preview.style.fontSize = '2rem';
        preview.style.background = 'none';
      }
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = item.label;
      div.appendChild(preview);
      div.appendChild(label);
      div.addEventListener('click', () => onClick(item));
      container.appendChild(div);
    });
  }

  // ================================================================
  //  INIT
  // ================================================================
  log('Starting...');
  loadBoard();

  const saved = localStorage.getItem(`focyl_board_size_${session?.id}`);
  if (saved && board) {
    try {
      const { w, h } = JSON.parse(saved);
      board.width = w;
      board.height = h;
      document.getElementById('canvasWidth').value = w;
      document.getElementById('canvasHeight').value = h;
    } catch(e) {}
  }

  setInterval(saveBoard, 30000);
  window.addEventListener('beforeunload', () => { saveBoard(); });
  log('Ready');
</script>
</body>
</html>
