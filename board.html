<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=2, viewport-fit=cover, user-scalable=no">
  <title>Focyl — Board</title>
  <meta name="theme-color" content="#070914">
  <link rel="manifest" href="/manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/lib/focyl-config.js"></script>
  <script src="/lib/focyl-brand.js" defer></script>
  <script src="/lib/focyl-libraries.js" defer></script>
  <script src="/lib/focyl-picker.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Sora:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== YOUR ORIGINAL DESIGN – UNTOUCHED ===== */
    :root {
      --void: #070914; --ink: #0d1224; --ink-2: #121a34;
      --line: rgba(237,239,247,0.09); --paper: #EDEFF7; --mist: #9AA4C7;
      --cyan: #35D8F0; --violet: #8B7CF6; --magenta: #EA4FC9;
      --grad: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--magenta));
      --glow: 0 0 40px rgba(139,124,246,0.3);
      --display: 'Space Grotesk', sans-serif;
      --body: 'Sora', sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --radius: 22px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--void); color: var(--paper);
      font-family: var(--body); overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    body::before, body::after {
      content: ""; position: fixed; width: 60vmax; height: 60vmax;
      border-radius: 50%; filter: blur(90px); opacity: 0.14;
      pointer-events: none; z-index: 0;
    }
    body::before { top: -20vmax; left: -15vmax; background: var(--cyan); }
    body::after { bottom: -25vmax; right: -20vmax; background: var(--magenta); }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: rgba(7,9,20,0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      height: 56px;
    }
    .topbar .left {
      display: flex; align-items: center; gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .topbar .back { background: transparent; border: none; color: var(--mist); font-size: 0.85rem; cursor: pointer; font-family: inherit; padding: 4px 0; }
    .brand-logo { width: 30px; height: 30px; border-radius: 9px; cursor: pointer; flex-shrink: 0; }
    .topbar .title { font-family: var(--display); font-weight: 600; font-size: 1rem; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar .right {
      display: flex; align-items: center; gap: 8px;
      flex-shrink: 0;
    }
    .topbar .status { font-family: var(--mono); font-size: 0.6rem; color: var(--mist); white-space: nowrap; }
    .topbar .zoom-controls { display: flex; gap: 3px; align-items: center; }
    .topbar .zoom-controls button {
      background: var(--ink-2); border: 1px solid var(--line); color: var(--paper);
      border-radius: 4px; padding: 1px 6px; font-size: 0.65rem; cursor: pointer;
      font-family: inherit; line-height: 1.5;
    }
    .topbar .zoom-controls button:hover { background: var(--violet); color: #070914; }
    .topbar .zoom-level { font-family: var(--mono); font-size: 0.6rem; color: var(--mist); min-width: 32px; text-align: center; }
    .topbar .profile { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .topbar .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--ink-2); border: 1px solid var(--line);
      background-size: cover; background-position: center;
      flex-shrink: 0; cursor: pointer;
    }
    .topbar .avatar:hover { border-color: var(--violet); }
    .topbar .display-name {
      font-size: 0.75rem; color: var(--paper); font-weight: 500;
      max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .canvas-wrap {
      position: absolute; inset: 0; top: 56px; overflow: auto;
      -webkit-overflow-scrolling: touch;
    }
    .canvas {
      position: relative;
      background-image: radial-gradient(rgba(237,239,247,0.05) 1px, transparent 1px);
      background-size: 28px 28px;
      transition: width 0.3s, height 0.3s;
      transform-origin: 0 0;
    }
    .canvas::before, .canvas::after {
      content: ""; position: absolute; width: 600px; height: 600px;
      border-radius: 50%; filter: blur(150px); opacity: 0.08; pointer-events: none;
    }
    .canvas::before { top: -200px; left: -200px; background: var(--cyan); }
    .canvas::after { bottom: -200px; right: -200px; background: var(--magenta); }

    .tile {
      position: absolute; border-radius: 16px;
      border: 1px solid var(--line);
      box-shadow: 0 14px 30px -16px rgba(0,0,0,0.7), var(--glow);
      touch-action: none; cursor: grab; overflow: visible;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-color: var(--ink);
      transition: box-shadow 0.2s;
      will-change: transform;
    }
    .tile:active { cursor: grabbing; }
    .tile.dragging { z-index: 50; box-shadow: 0 24px 50px -18px rgba(0,0,0,0.85), 0 0 60px rgba(139,124,246,0.2); }

    .tile.text-tile {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
    }
    .tile.text-tile .text-content {
      outline: none;
      word-break: break-word;
      text-align: center;
      line-height: 1.2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile.text-tile .text-content:focus { outline: 2px solid var(--violet); }

    .tile .del {
      position: absolute; top: 6px; right: 6px; width: 22px; height: 22px;
      border-radius: 50%; background: rgba(7,9,20,0.6);
      border: 1px solid var(--line); color: var(--paper);
      font-family: var(--mono); font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 10;
    }
    .tile:hover .del, .tile.dragging .del { opacity: 1; }

    .tile.audio-tile {
      background: var(--ink-2);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 12px;
      cursor: pointer;
    }
    .tile.audio-tile .play-btn { font-size: 2rem; margin-bottom: 6px; filter: drop-shadow(0 0 10px rgba(53,216,240,0.3)); }
    .tile.audio-tile .progress-bar { width: 80%; height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
    .tile.audio-tile .progress-bar .fill { height: 100%; width: 0%; background: var(--grad); }
    .tile.audio-tile .audio-label { font-size: 0.7rem; color: var(--mist); margin-top: 4px; max-width: 90%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Resize/rotate handles removed on purpose — two-finger pinch and
       twist on the tile itself does both. See makeDraggable() in JS. */

    .fab {
      position: fixed; right: 20px; bottom: 26px; z-index: 20;
      width: 58px; height: 58px; border-radius: 50%;
      background: var(--grad); border: none; cursor: pointer;
      box-shadow: 0 14px 30px -10px rgba(139,124,246,0.6), var(--glow);
      display: flex; align-items: center; justify-content: center;
    }
    .fab svg { width: 22px; height: 22px; stroke: #070914; stroke-width: 2.4; }

    .scrim {
      position: fixed; inset: 0; background: rgba(7,9,20,0.6);
      z-index: 30; opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .scrim.open { opacity: 1; pointer-events: auto; }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 31;
      background: var(--ink);
      border: 1px solid var(--line); border-bottom: none;
      border-radius: 22px 22px 0 0;
      padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      max-height: 75vh; overflow-y: auto;
    }
    .sheet.open { transform: translateY(0); }
    .grabber { width: 36px; height: 4px; background: var(--line); border-radius: 4px; margin: 0 auto 18px; }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 18px;
      background: var(--ink-2); border-radius: 100px; padding: 4px;
    }
    .tab {
      flex: 1; text-align: center; padding: 9px 0; border-radius: 100px;
      font-size: 0.82rem; font-weight: 600; cursor: pointer; color: var(--mist);
      border: none; background: transparent; font-family: inherit;
    }
    .tab.active { background: var(--grad); color: #070914; }

    .panel { display: none; }
    .panel.active { display: block; }

    label {
      display: block; font-family: var(--mono); font-size: 0.7rem;
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--mist);
      margin: 0 0 6px;
    }
    input, textarea, select {
      width: 100%; background: var(--ink-2); border: 1px solid var(--line);
      color: var(--paper); border-radius: 12px; padding: 12px 14px;
      font-family: var(--body); font-size: 0.95rem; margin-bottom: 12px;
      resize: none;
    }
    input[type="color"] { padding: 4px; height: 44px; cursor: pointer; }
    select { appearance: none; }
    .btn-primary {
      width: 100%; background: var(--grad); color: #070914; border: none;
      border-radius: 100px; padding: 13px 0; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; margin-bottom: 10px;
    }
    .btn-ghost {
      width: 100%; background: transparent; border: 1px dashed rgba(237,239,247,0.25);
      color: var(--paper); border-radius: 14px; padding: 13px 0; font-weight: 600;
      font-size: 0.9rem; cursor: pointer; margin-bottom: 10px;
    }
    .hint { font-family: var(--mono); font-size: 0.75rem; color: var(--mist); margin: 0 0 12px; }
    .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .cat-chips button {
      font-family: var(--mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em;
      border: 1px solid var(--line); border-radius: 100px; padding: 7px 12px;
      background: var(--ink-2); color: var(--paper); cursor: pointer;
    }
    .cat-chips button:hover { background: var(--violet); color: #070914; }
    .results {
      display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 10px;
    }
    .results .thumb {
      aspect-ratio: 1/1; border-radius: 10px; background-size: cover; background-position: center;
      border: 1px solid var(--line); cursor: pointer; background-color: var(--ink-2);
    }
    input[type="file"] { display: none; }

    .font-size-control {
      display: flex; align-items: center; gap: 10px;
    }
    .font-size-control input[type="range"] { flex: 1; margin: 0; }
    .font-size-control span { font-family: var(--mono); font-size: 0.9rem; min-width: 40px; }
    .crop-row { display: flex; gap: 10px; }
    .crop-row input { flex: 1; }

    @media (max-width: 600px) { .sheet { padding: 16px; } }

    .tile .redesign-btn {
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(7,9,20,0.7); border: 1px solid var(--violet); color: white;
      border-radius: 20px; padding: 4px 12px; font-size: 0.7rem;
      cursor: pointer; opacity: 0; transition: opacity 0.2s;
      z-index: 6; font-family: inherit;
    }
    .tile:hover .redesign-btn { opacity: 1; }

    #debug {
      position: fixed; bottom: 80px; left: 20px; z-index: 999;
      background: rgba(0,0,0,0.8); color: #0f0; padding: 4px 8px;
      font-family: monospace; font-size: 0.55rem;
      border-radius: 4px; max-width: 70%;
      pointer-events: none;
      white-space: pre-wrap;
      word-break: break-all;
      opacity: 0.6;
    }

    /* Avatar input hidden */
    #avatarInput { display: none; }
  </style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="left">
    <focyl-mark class="brand-logo" size="30" link></focyl-mark> 
    <span class="title" id="boardTitle">My Board</span>
  </div>
  <div class="right">
    <div class="zoom-controls">
      <button onclick="adjustZoom(-0.1)">−</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button onclick="adjustZoom(0.1)">+</button>
      <button onclick="resetZoom()">⟲</button>
    </div>
    <span class="status" id="statusText">Ready</span>
    <div class="profile" id="profileArea">
      <div class="avatar" id="avatarDisplay" title="Click to change avatar"></div>
      <span class="display-name" id="displayNameDisplay">User</span>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas"></div>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" aria-label="Add tile" onclick="openSheet()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#070914" stroke-width="2.4" stroke-linecap="round">
    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- SHEET -->
<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <div class="tabs">
    <button class="tab active" id="tabPhoto" onclick="switchTab('photo')">Photo</button>
    <button class="tab" id="tabWords" onclick="switchTab('words')">Words</button>
    <button class="tab" id="tabPapers" onclick="switchTab('papers')">Papers</button>
    <button class="tab" id="tabRibbons" onclick="switchTab('ribbons')">Ribbons</button>
    <button class="tab" id="tabAudio" onclick="switchTab('audio')">Audio</button>
    <button class="tab" id="tabSettings" onclick="switchTab('settings')">Settings</button>
  </div>

  <div class="panel active" id="panelPhoto">
    <label for="photoQuery">Search free photos</label>
    <input type="text" id="photoQuery" placeholder="studio, mid thirties…">
    <div class="cat-chips">
      <button type="button" onclick="searchCategory('luxury mansion')">Mansions</button>
      <button type="button" onclick="searchCategory('luxury sports car')">Cars</button>
      <button type="button" onclick="searchCategory('tropical beach')">Beaches</button>
      <button type="button" onclick="searchCategory('luxury yacht')">Yachts</button>
      <button type="button" onclick="searchCategory('private jet')">Jets</button>
      <button type="button" onclick="searchCategory('designer logo fashion')">Designer Logos</button>
    </div>
    <button class="btn-primary" id="searchBtn" onclick="doSearch()">Search</button>
    <div class="results" id="results"></div>
    <p class="hint" id="photoHint"></p>
    <label>Or use your own</label>
    <button class="btn-ghost" id="uploadBtn" onclick="document.getElementById('fileInput').click()">Upload from device (resized)</button>
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileUpload(event)">
  </div>

  <div class="panel" id="panelWords">
    <label for="quoteText">In your own words, future tense</label>
    <textarea id="quoteText" rows="2" placeholder="I run my own studio."></textarea>
    <div class="font-size-control">
      <label>Font size</label>
      <input type="range" id="textSizeSlider" min="12" max="120" value="32" oninput="document.getElementById('textSizeDisplay').textContent=this.value+'px'">
      <span id="textSizeDisplay">32px</span>
    </div>
    <label>Font family</label>
    <select id="fontFamilySelect">
      <option value="'Space Grotesk', sans-serif">Space Grotesk</option>
      <option value="'Sora', sans-serif">Sora</option>
      <option value="'Inter', sans-serif">Inter</option>
      <option value="'Playfair Display', serif">Playfair Display</option>
      <option value="'JetBrains Mono', monospace">JetBrains Mono</option>
      <option value="'Georgia', serif">Georgia</option>
      <option value="'Arial', sans-serif">Arial</option>
    </select>
    <label>Font color</label>
    <input type="color" id="textColorPicker" value="#EDEFF7">
    <button class="btn-primary" id="addTextBtn" onclick="addTextTile()">Add Text Tile</button>
  </div>

  <!-- Library panels. Populated at runtime from libraries/<id>/index.json —
       no markup changes needed when you add assets. -->
  <div class="panel" id="panelPapers">
    <label>Paper surfaces</label>
  </div>

  <div class="panel" id="panelRibbons">
    <label>Ribbons and banners</label>
  </div>

  <div class="panel" id="panelAudio">
    <label>Upload an MP3 from your device</label>
    <button class="btn-ghost" id="uploadAudioBtn" onclick="document.getElementById('audioInput').click()">Choose MP3</button>
    <input type="file" id="audioInput" accept="audio/*" onchange="handleAudioUpload(event)">
    <p class="hint">Tap the tile to play/pause.</p>
  </div>

  <div class="panel" id="panelSettings">
    <label>Canvas Size (pixels)</label>
    <div class="crop-row">
      <input type="number" id="canvasWidth" value="1600" step="100" min="400">
      <input type="number" id="canvasHeight" value="1600" step="100" min="400">
    </div>
    <button class="btn-primary" id="resizeCanvasBtn" onclick="resizeCanvas()">Resize Board</button>
    <hr style="border-color:var(--line);margin:16px 0;">
    <label>Display Name</label>
    <input type="text" id="displayNameInput" placeholder="Your display name" onchange="updateDisplayName()">
    <button class="btn-ghost" onclick="document.getElementById('avatarInput').click()">Change Avatar</button>
    <p class="hint">Click your avatar in the top bar to change it.</p>
  </div>
</div>

<!-- DEBUG -->
<div id="debug" hidden>⏳ Loading...</div>

<script>
  // ================================================================
  //  DEBUG HELPER
  // ================================================================
  // Debug panel is opt-in: append ?debug=1 to the URL.
  const DEBUG = new URLSearchParams(location.search).has('debug');
  function log(msg) {
    const d = document.getElementById('debug');
    if (d && DEBUG) { d.hidden = false; d.textContent = msg; }
    console.log(msg);
  }

  // ================================================================
  //  CONFIG
  // ================================================================
  // Supabase creds now live in lib/focyl-config.js (loaded above)

  const TILE_CONFIG = {
    unsplashKey: '',
    pexelsKey: '',
    hfToken: '',
    hfModel: 'stabilityai/stable-diffusion-2-1',
  };

  // ================================================================
  //  SESSION
  // ================================================================
  const session = JSON.parse(localStorage.getItem('focyl_user') || 'null');
  if (!session) {
    log('No session, redirecting to auth...');
    window.location.href = 'auth.html';
  } else {
    log('Session found: ' + session.email);
  }

  // ================================================================
  //  SUPABASE CLIENT
  // ================================================================
  let sb = null;
  try {
    sb = supabase.createClient(FOCYL_CONFIG.supabaseUrl, FOCYL_CONFIG.supabaseAnonKey);
    log('Supabase client created');
  } catch (e) {
    log('Supabase init error: ' + e.message);
  }

  // ================================================================
  //  STATE
  // ================================================================
  let board = null;
  let tiles = [];
  let boardId = null;
  let scale = 1;
  const MIN_SCALE = 0.15;
  const MAX_SCALE = 3;

  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvasWrap');
  const statusText = document.getElementById('statusText');
  const zoomLevel = document.getElementById('zoomLevel');
  const avatarDisplay = document.getElementById('avatarDisplay');
  const displayNameDisplay = document.getElementById('displayNameDisplay');

  function setStatus(t) { if (statusText) statusText.textContent = t; log('Status: ' + t); }

  // ================================================================
  //  PROFILE (avatar & display name)
  // ================================================================
  let profileData = { display_name: session.email.split('@')[0], avatar_url: null };

  // Load from localStorage
  const savedProfile = localStorage.getItem(`focyl_profile_${session.email}`);
  if (savedProfile) {
    try {
      const parsed = JSON.parse(savedProfile);
      profileData.display_name = parsed.display_name || profileData.display_name;
      profileData.avatar_url = parsed.avatar_url || null;
    } catch(e) {}
  }
  updateProfileUI();

  function updateProfileUI() {
    displayNameDisplay.textContent = profileData.display_name;
    document.getElementById('displayNameInput').value = profileData.display_name;
    if (profileData.avatar_url) {
      avatarDisplay.style.backgroundImage = `url('${profileData.avatar_url}')`;
      avatarDisplay.style.backgroundSize = 'cover';
      avatarDisplay.style.backgroundPosition = 'center';
    } else {
      avatarDisplay.style.backgroundImage = '';
      avatarDisplay.style.backgroundColor = 'var(--ink-2)';
    }
  }

  avatarDisplay.addEventListener('click', () => {
    document.getElementById('avatarInput').click();
  });
  document.getElementById('avatarInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const max = 200;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h = h * max / w; w = max; }
        else if (h > max) { w = w * max / h; h = max; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.8);
        profileData.avatar_url = dataUrl;
        avatarDisplay.style.backgroundImage = `url('${dataUrl}')`;
        avatarDisplay.style.backgroundSize = 'cover';
        avatarDisplay.style.backgroundPosition = 'center';
        localStorage.setItem(`focyl_profile_${session.email}`, JSON.stringify(profileData));
        log('Avatar updated');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    this.value = '';
  });

  window.updateDisplayName = function() {
    const name = document.getElementById('displayNameInput').value.trim();
    if (!name) return;
    profileData.display_name = name;
    displayNameDisplay.textContent = name;
    localStorage.setItem(`focyl_profile_${session.email}`, JSON.stringify(profileData));
    log('Display name updated');
  };

  // ================================================================
  //  SHEET CONTROLS
  // ================================================================
  window.openSheet = function() {
    document.getElementById('sheet').classList.add('open');
    document.getElementById('scrim').classList.add('open');
    log('Sheet opened');
  };
  window.closeSheet = function() {
    document.getElementById('sheet').classList.remove('open');
    document.getElementById('scrim').classList.remove('open');
    log('Sheet closed');
  };

  window.switchTab = function(panelId) {
    const tabs = document.querySelectorAll('.tab');
    const panels = {
      photo: document.getElementById('panelPhoto'),
      words: document.getElementById('panelWords'),
      papers: document.getElementById('panelPapers'),
      ribbons: document.getElementById('panelRibbons'),
      audio: document.getElementById('panelAudio'),
      settings: document.getElementById('panelSettings'),
    };
    tabs.forEach(t => t.classList.remove('active'));
    const activeTab = document.getElementById('tab' + panelId.charAt(0).toUpperCase() + panelId.slice(1));
    if (activeTab) activeTab.classList.add('active');
    Object.values(panels).forEach(p => p.classList.remove('active'));
    if (panels[panelId]) panels[panelId].classList.add('active');
    log('Switched to ' + panelId);
  };

  // ================================================================
  //  ZOOM
  // ================================================================
  function applyZoom() {
    canvas.style.transform = `scale(${scale})`;
    zoomLevel.textContent = Math.round(scale * 100) + '%';
  }

  window.adjustZoom = function(delta) {
    scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
    applyZoom();
  };

  window.resetZoom = function() {
    scale = 1;
    applyZoom();
    const w = board?.width || 1600;
    const h = board?.height || 1600;
    canvasWrap.scrollLeft = (w * scale) / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = (h * scale) / 2 - canvasWrap.clientHeight / 2;
  };

  // Mouse wheel zoom (Ctrl+scroll)
  canvasWrap.addEventListener('wheel', (e) => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.05 : 0.05;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      const rect = canvasWrap.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const scrollLeft = canvasWrap.scrollLeft + mx;
      const scrollTop = canvasWrap.scrollTop + my;
      const ratio = newScale / scale;
      scale = newScale;
      applyZoom();
      canvasWrap.scrollLeft = scrollLeft * ratio - mx;
      canvasWrap.scrollTop = scrollTop * ratio - my;
    }
  }, { passive: false });

  // Pinch zoom (mobile)
  let lastPinchDist = 0;
  canvasWrap.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinchDist = Math.sqrt(dx*dx + dy*dy);
    }
  }, { passive: true });

  canvasWrap.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const delta = (dist - lastPinchDist) / 500;
      const newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
      const rect = canvasWrap.getBoundingClientRect();
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      const scrollLeft = canvasWrap.scrollLeft + mx;
      const scrollTop = canvasWrap.scrollTop + my;
      const ratio = newScale / scale;
      scale = newScale;
      applyZoom();
      canvasWrap.scrollLeft = scrollLeft * ratio - mx;
      canvasWrap.scrollTop = scrollTop * ratio - my;
      lastPinchDist = dist;
    }
  }, { passive: true });

  // ================================================================
  //  LOAD BOARD
  // ================================================================
  // Runs AFTER board is populated. The original ran immediately after
  // calling loadBoard(), while board was still null, so it never applied.
  function restoreCanvasSize() {
    const saved = localStorage.getItem(`focyl_board_size_${session?.id}`);
    if (!saved || !board) return;
    try {
      const { w, h } = JSON.parse(saved);
      board.width = w; board.height = h;
      document.getElementById('canvasWidth').value = w;
      document.getElementById('canvasHeight').value = h;
    } catch (e) {}
  }

  async function loadBoard() {
    log('Loading board...');
    try {
      if (sb) {
        const { data: boardData, error: boardError } = await sb
          .from('boards')
          .select('*')
          .eq('user_id', session.id)
          .maybeSingle();
        if (boardError && boardError.code !== 'PGRST116') throw new Error('Supabase board fetch failed');
        if (boardData) {
          board = boardData;
          boardId = board.id;
          document.getElementById('boardTitle').textContent = board.title;
          const { data: tileData, error: tileError } = await sb
            .from('tiles')
            .select('*')
            .eq('board_id', boardId)
            .order('z', { ascending: true });
          if (tileError) throw tileError;
          tiles = tileData || [];
          restoreCanvasSize();
          renderAll();
          setStatus('Loaded from Supabase');
          log('Loaded ' + tiles.length + ' tiles from Supabase');
          return;
        }
      }
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage');
        log('Loaded ' + tiles.length + ' tiles from localStorage');
        return;
      }
      board = { title: 'My Board', width: 1600, height: 1600 };
      tiles = [];
      restoreCanvasSize();
      renderAll();
      setStatus('New board');
      log('New board created');
    } catch (err) {
      log('Load error: ' + err.message);
      const localBoard = JSON.parse(localStorage.getItem(`focyl_board_${session.email}`) || 'null');
      if (localBoard) {
        board = { ...localBoard, id: 'local' };
        tiles = localBoard.tiles || [];
        renderAll();
        setStatus('Loaded from localStorage (fallback)');
        log('Fallback loaded ' + tiles.length + ' tiles');
      } else {
        board = { title: 'My Board', width: 1600, height: 1600 };
        tiles = [];
        renderAll();
        setStatus('New board (fallback)');
        log('Fallback new board');
      }
    }
  }

  // ================================================================
  //  SAVE BOARD
  // ================================================================
  // Tiles the user deleted this session. We delete exactly these,
  // never "everything then re-insert" — that window is where boards die.
  const deletedTileIds = new Set();

  let saveTimer = null;
  let saveInFlight = false;
  let saveQueued = false;

  // Public entry point. Cheap to call — call it as often as you like.
  function saveBoard({ immediate = false } = {}) {
    if (!board) return;
    if (immediate) { clearTimeout(saveTimer); return flushSave(); }
    clearTimeout(saveTimer);
    setStatus('Saving…');
    saveTimer = setTimeout(flushSave, 800);
  }

  function saveLocal() {
    try {
      localStorage.setItem(`focyl_board_${session.email}`, JSON.stringify({
        title: board.title, tiles, width: board.width || 1600, height: board.height || 1600
      }));
      return true;
    } catch (err) {
      // Almost always QuotaExceededError from base64 image tiles.
      setStatus('Local storage full');
      log('Local save failed: ' + err.message);
      return false;
    }
  }

  async function flushSave() {
    if (!board) return;
    if (saveInFlight) { saveQueued = true; return; }
    saveInFlight = true;

    try {
      if (sb && boardId && boardId !== 'local') {
        await sb.from('boards')
          .update({ title: board.title, width: board.width, height: board.height, updated_at: new Date().toISOString() })
          .eq('id', boardId);

        // Delete only what was actually removed.
        if (deletedTileIds.size) {
          const ids = [...deletedTileIds];
          const { error } = await sb.from('tiles').delete().in('id', ids);
          if (error) throw error;
          deletedTileIds.clear();
        }

        // Upsert on the primary key: tiles keep their identity across saves,
        // so goals and animations stay attached to the right tile.
        if (tiles.length) {
          const rows = tiles.map(t => ({
            id: t.id,
            board_id: boardId,
            type: t.type,
            source: t.source || 'library',
            content: t.content,
            x: t.x, y: t.y, w: t.w, h: t.h,
            z: t.z || 1,
            rotation: t.rotation || 0,
            outline: t.outline || false,
            library_id: t.library_id || null,
            asset_id: t.asset_id || null,
            updated_at: new Date().toISOString()
          }));
          const { error } = await sb.from('tiles').upsert(rows, { onConflict: 'id' });
          if (error) throw error;
        }

        saveLocal();                       // local copy as an offline cache
        setStatus('Saved');
        log('Saved ' + tiles.length + ' tiles to Supabase');
      } else {
        setStatus(saveLocal() ? 'Saved locally' : 'Save failed');
      }
    } catch (err) {
      log('Save error: ' + err.message);
      setStatus(saveLocal() ? 'Saved locally (offline)' : 'Save failed');
    } finally {
      saveInFlight = false;
      if (saveQueued) { saveQueued = false; flushSave(); }
    }
  }

  // ================================================================
  //  RENDER
  // ================================================================
  function renderAll() {
    const w = board?.width || 1600;
    const h = board?.height || 1600;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.innerHTML = '';
    tiles.forEach(renderTile);
    // Apply zoom and center
    applyZoom();
    canvasWrap.scrollLeft = (w * scale) / 2 - canvasWrap.clientWidth / 2;
    canvasWrap.scrollTop = (h * scale) / 2 - canvasWrap.clientHeight / 2;
    log('Rendered ' + tiles.length + ' tiles');
  }

  function renderTile(t) {
    const el = document.createElement('div');
    el.className = 'tile';
    if (t.outline) el.classList.add('outlined');
    el.dataset.id = t.id;
    el.style.left = t.x + 'px';
    el.style.top = t.y + 'px';
    el.style.width = t.w + 'px';
    el.style.height = t.h + 'px';
    if (t.rotation) {
      el.style.transform = `rotate(${t.rotation}deg)`;
    }

    if (t.type === 'image') {
      el.style.backgroundImage = `url('${t.content.url}')`;
      // No resize/rotate handles by design — two-finger pinch and twist on
      // the tile itself does both (see makeDraggable). Only buttons on an
      // image tile are delete (×) and Redesign.
      const aiBtn = document.createElement('button');
      aiBtn.className = 'redesign-btn';
      aiBtn.textContent = '✨ Redesign';
      aiBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        redesignImageTile(t.id);
      });
      el.appendChild(aiBtn);
    } else if (t.type === 'text') {
      el.classList.add('text-tile');
      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = true;
      content.textContent = t.content.text || 'Edit me';
      content.style.fontFamily = t.content.fontFamily || "'Space Grotesk', sans-serif";
      content.style.fontSize = (t.content.fontSize || 32) + 'px';
      content.style.color = t.content.color || '#EDEFF7';
      if (t.content.paper) {
        el.style.backgroundImage = `url('${t.content.paper}')`;
        el.style.backgroundSize = '100% 100%';
        el.classList.remove('text-tile');
        content.style.lineHeight = (t.content.lineHeight || 32) + 'px';
        content.style.padding = '14px';
      }
      content.addEventListener('input', () => {
        t.content.text = content.textContent;
        saveBoard();
      });
      el.appendChild(content);
      // Pure text, no box — pinch/twist on the tile resizes and rotates it,
      // same as image tiles. Only button is delete (×).
    } else if (t.type === 'ribbon') {
      el.style.backgroundImage = `url('${t.content.asset}')`;
      el.style.backgroundSize = '100% 100%';
      el.style.border = 'none';
      el.style.boxShadow = 'none';
      const label = document.createElement('div');
      label.contentEditable = true;
      label.textContent = t.content.text || '';
      const tb = t.content.textBox;
      label.style.cssText = tb
        ? `position:absolute;left:${tb.x}px;top:${tb.y}px;width:${tb.w}px;height:${tb.h}px;` +
          `transform:rotate(${tb.rotate || 0}deg);text-align:${tb.align || 'center'};` +
          `display:flex;align-items:center;justify-content:center;outline:none;`
        : 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;outline:none;';
      label.addEventListener('input', () => {
        t.content.text = label.textContent;
        saveBoard();
      });
      el.appendChild(label);
    } else if (t.type === 'audio') {
      el.classList.add('audio-tile');
      const playBtn = document.createElement('div');
      playBtn.className = 'play-btn';
      playBtn.textContent = '▶';
      const progress = document.createElement('div');
      progress.className = 'progress-bar';
      const fill = document.createElement('div');
      fill.className = 'fill';
      progress.appendChild(fill);
      const label = document.createElement('div');
      label.className = 'audio-label';
      label.textContent = t.content.name || 'Audio';
      el.appendChild(playBtn);
      el.appendChild(progress);
      el.appendChild(label);

      const audio = document.createElement('audio');
      audio.src = t.content.url;
      audio.preload = 'metadata';
      let playing = false;
      const updateProgress = () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          fill.style.width = pct + '%';
        }
      };
      audio.addEventListener('timeupdate', updateProgress);
      el.addEventListener('click', () => {
        if (playing) {
          audio.pause();
          playBtn.textContent = '▶';
          playing = false;
        } else {
          audio.play();
          playBtn.textContent = '⏸';
          playing = true;
        }
      });
      audio.addEventListener('ended', () => {
        playBtn.textContent = '▶';
        playing = false;
        fill.style.width = '0%';
      });
      el._audio = audio;
    }

    // Delete button
    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '×';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm('Delete this tile?')) return;
      deletedTileIds.add(t.id);
      tiles = tiles.filter(x => x.id !== t.id);
      if (el._audio) { el._audio.pause(); el._audio.src = ''; }
      el.remove();
      saveBoard();
    });
    el.appendChild(del);

    // Click to front
    el.addEventListener('click', (e) => {
      if (e.target.closest('.del') || e.target.closest('.redesign-btn')) return;
      const maxZ = Math.max(0, ...tiles.map(t => t.z || 1));
      t.z = maxZ + 1;
      el.style.zIndex = t.z;
      saveBoard();
    });

    makeDraggable(el, t);
    canvas.appendChild(el);
  }

  // ================================================================
  //  DRAG (one finger) + PINCH-RESIZE & TWIST-ROTATE (two fingers)
  //  No handles, no buttons — purely gesture-driven, on the tile itself.
  // ================================================================
  function makeDraggable(el, tile) {
    const pointers = new Map();
    let mode = null; // 'drag' | 'pinch'
    let startX, startY, origLeft, origTop;
    let pinchStartDist = 0, pinchStartAngle = 0, pinchStartW = 0, pinchStartH = 0, pinchStartRot = 0;

    const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
    const angleOf = (a, b) => Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;

    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.del') || e.target.closest('.redesign-btn')) return;
      el.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      el.classList.add('dragging');

      if (pointers.size === 1) {
        mode = 'drag';
        startX = e.clientX; startY = e.clientY;
        origLeft = parseFloat(el.style.left); origTop = parseFloat(el.style.top);
      } else if (pointers.size === 2) {
        mode = 'pinch';
        const [a, b] = [...pointers.values()];
        pinchStartDist = dist(a, b) || 1;
        pinchStartAngle = angleOf(a, b);
        pinchStartW = tile.w;
        pinchStartH = tile.h;
        pinchStartRot = tile.rotation || 0;
      }
    });

    el.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (mode === 'drag' && pointers.size === 1) {
        // Divide by scale: pointer pixels are screen-space, tile
        // coordinates are canvas-space. Without this the tile runs
        // away from your finger at any zoom other than 100%.
        let newX = origLeft + (e.clientX - startX) / scale;
        let newY = origTop  + (e.clientY - startY) / scale;
        const bw = board?.width || 1600;
        const bh = board?.height || 1600;
        newX = Math.max(0, Math.min(bw - tile.w, newX));
        newY = Math.max(0, Math.min(bh - tile.h, newY));
        el.style.left = newX + 'px';
        el.style.top = newY + 'px';
        tile.x = newX;
        tile.y = newY;
      } else if (mode === 'pinch' && pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const pinchScale = dist(a, b) / pinchStartDist;
        const newW = Math.max(60, Math.min(1400, pinchStartW * pinchScale));
        const newH = Math.max(40, Math.min(1400, pinchStartH * pinchScale));
        const newRot = pinchStartRot + (angleOf(a, b) - pinchStartAngle);
        el.style.width = newW + 'px';
        el.style.height = newH + 'px';
        el.style.transform = `rotate(${newRot}deg)`;
        tile.w = newW;
        tile.h = newH;
        tile.rotation = newRot;
      }
    });

    function release(e) {
      pointers.delete(e.pointerId);
      if (pointers.size === 0) {
        el.classList.remove('dragging');
        mode = null;
        saveBoard();
        setStatus('Saved');
      } else if (pointers.size === 1) {
        // One finger lifted mid-pinch — stop cleanly rather than jumping into a drag.
        mode = null;
      }
    }
    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
  }

  // ================================================================
  //  ADD TILE
  // ================================================================
  function addTile(partial) {
    const newTile = {
      id: crypto.randomUUID(),
      board_id: boardId || 'local',
      x: Math.min(canvasWrap.scrollLeft / scale + 60, (board?.width || 1600) - 160),
      y: Math.min(canvasWrap.scrollTop / scale + 60, (board?.height || 1600) - 160),
      w: 160,
      h: 160,
      z: tiles.length + 1,
      source: 'library',
      rotation: 0,
      outline: false,
      ...partial
    };
    tiles.push(newTile);
    renderTile(newTile);
    saveBoard();
    setStatus('Added');
    log('Added tile: ' + newTile.type);
  }

  // ================================================================
  //  BUTTON CALLBACKS
  // ================================================================
  window.doSearch = function() {
    const q = document.getElementById('photoQuery').value.trim();
    if (q) searchPhotos(q);
    else log('Search query empty');
  };

  window.searchCategory = function(term) {
    document.getElementById('photoQuery').value = term;
    searchPhotos(term);
  };

  window.addTextTile = function() {
    const text = document.getElementById('quoteText').value.trim() || 'Your vision';
    const fontSize = parseInt(document.getElementById('textSizeSlider').value) || 32;
    const fontFamily = document.getElementById('fontFamilySelect').value;
    const color = document.getElementById('textColorPicker').value;
    addTile({
      type: 'text',
      content: { text, fontSize, fontFamily, color },
      w: Math.max(120, text.length * 10),
      h: fontSize * 2 + 20,
    });
    closeSheet();
    log('Text tile added');
  };

  window.handleFileUpload = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxSize = 800;
        let w = img.width, h = img.height;
        if (w > h && w > maxSize) { h = h * maxSize / w; w = maxSize; }
        else if (h > maxSize) { w = w * maxSize / h; h = maxSize; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        const dataUrl = c.toDataURL('image/jpeg', 0.85);
        addTile({ type: 'image', content: { url: dataUrl }, source: 'upload' });
        closeSheet();
        log('Image uploaded and resized');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  window.handleAudioUpload = function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const dataUrl = ev.target.result;
      addTile({
        type: 'audio',
        content: { url: dataUrl, name: file.name },
        w: 180,
        h: 120,
      });
      closeSheet();
      log('Audio uploaded');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  window.resizeCanvas = function() {
    const w = parseInt(document.getElementById('canvasWidth').value);
    const h = parseInt(document.getElementById('canvasHeight').value);
    if (w < 200 || h < 200) return;
    if (board) {
      board.width = w;
      board.height = h;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      // Clamp tiles to new boundaries
      tiles.forEach(t => {
        t.x = Math.max(0, Math.min(w - t.w, t.x));
        t.y = Math.max(0, Math.min(h - t.h, t.y));
        const el = document.querySelector(`.tile[data-id="${t.id}"]`);
        if (el) {
          el.style.left = t.x + 'px';
          el.style.top = t.y + 'px';
        }
      });
      localStorage.setItem(`focyl_board_size_${session.id}`, JSON.stringify({ w, h }));
      saveBoard();
      setStatus('Canvas resized');
      closeSheet();
      log('Canvas resized to ' + w + 'x' + h);
    }
  };

  // ================================================================
  //  PHOTO SEARCH
  // ================================================================
  async function searchPhotos(query) {
    const hint = document.getElementById('photoHint');
    const results = document.getElementById('results');
    results.innerHTML = '';
    hint.textContent = 'Searching...';
    if (TILE_CONFIG.unsplashKey) {
      try {
        const res = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=9&client_id=${TILE_CONFIG.unsplashKey}`);
        const data = await res.json();
        (data.results || []).forEach(p => addResultThumb(p.urls.small, p.urls.regular));
        hint.textContent = '';
        log('Unsplash search done');
      } catch (e) { hint.textContent = 'Unsplash error'; log('Unsplash error: ' + e.message); }
      return;
    }
    if (TILE_CONFIG.pexelsKey) {
      try {
        const res = await fetch(`https://api.pexels.com/v1/search?query=${encodeURIComponent(query)}&per_page=9`, {
          headers: { Authorization: TILE_CONFIG.pexelsKey }
        });
        const data = await res.json();
        (data.photos || []).forEach(p => addResultThumb(p.src.medium, p.src.large));
        hint.textContent = '';
        log('Pexels search done');
      } catch (e) { hint.textContent = 'Pexels error'; log('Pexels error: ' + e.message); }
      return;
    }
    hint.textContent = 'No photo API key set – add one in TILE_CONFIG.';
    log('No photo API key');
  }

  function addResultThumb(thumbUrl, fullUrl) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.style.backgroundImage = `url('${thumbUrl}')`;
    div.addEventListener('click', () => {
      addTile({ type: 'image', content: { url: fullUrl }, source: 'api' });
      closeSheet();
      log('Photo selected from search');
    });
    document.getElementById('results').appendChild(div);
  }

  // ================================================================
  //  AI REDESIGN
  // ================================================================
  async function redesignImageTile(tileId) {
    const tile = tiles.find(t => t.id === tileId);
    if (!tile || tile.type !== 'image') return;
    const prompt = 'A vision board, motivational, future self, success, vibrant, professional, high quality';
    if (!TILE_CONFIG.hfToken) {
      alert('Please set your Hugging Face token in TILE_CONFIG.hfToken');
      return;
    }
    try {
      const response = await fetch(
        `https://api-inference.huggingface.co/models/${TILE_CONFIG.hfModel}`,
        {
          headers: { Authorization: `Bearer ${TILE_CONFIG.hfToken}` },
          method: 'POST',
          body: JSON.stringify({ inputs: prompt }),
        }
      );
      if (!response.ok) throw new Error('HF API error: ' + response.status);
      const blob = await response.blob();
      const url = URL.createObjectURL(blob);
      tile.content.url = url;
      const el = document.querySelector(`.tile[data-id="${tile.id}"]`);
      if (el) {
        el.style.backgroundImage = `url('${url}')`;
      }
      saveBoard();
      setStatus('AI redesign complete');
      log('AI redesign done');
    } catch (err) {
      alert('AI redesign failed: ' + err.message);
      log('AI redesign error: ' + err.message);
    }
  }

  // ================================================================
  //  INIT
  // ================================================================
  log('Script started');
  loadBoard();

  // ================================================================
  //  LIBRARY PANELS
  //  Two wired end to end to prove the manifest pattern. The other
  //  seven mount with one line each once their index.json has items.
  // ================================================================
  window.addEventListener('DOMContentLoaded', () => {
    if (!window.FocylPicker) return;
    const tier = session?.tier === 'film' ? 'film'
               : session?.tier === 'press' ? 'plus' : 'free';

    FocylPicker.mount('#panelPapers', 'papers', {
      tier,
      onPick: item => {
        addTile({
          type: 'text',
          library_id: item.library_id,
          asset_id: item.asset_id,
          content: {
            text: 'Write here',
            fontSize: 24,
            fontFamily: "'Sora', sans-serif",
            color: item.inkColor || '#14172b',
            paper: item.asset ? FocylLibraries.assetUrl('papers', item.asset) : null,
            lineHeight: item.lineHeight || 32
          },
          w: 300, h: 220
        });
        closeSheet();
      },
      onLocked: item => alert(`"${item.name}" is part of a paid tier.`)
    });

    FocylPicker.mount('#panelRibbons', 'ribbons', {
      tier,
      onPick: item => {
        addTile({
          type: 'ribbon',
          library_id: item.library_id,
          asset_id: item.asset_id,
          content: {
            asset: FocylLibraries.assetUrl('ribbons', item.asset),
            text: 'Goal',
            textBox: item.textBox || null
          },
          w: 260, h: 90
        });
        closeSheet();
      },
      onLocked: item => alert(`"${item.name}" is part of a paid tier.`)
    });
  });

  // Autosave only when something actually changed — an idle board
  // no longer writes to the database every 30 seconds.
  setInterval(() => { if (saveTimer === null && !saveInFlight) return; saveBoard(); }, 30000);

  // beforeunload cannot await an async call; the page is gone first.
  // visibilitychange fires while the page is still alive.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveBoard({ immediate: true });
  });

  log('Initialization complete');
</script>
</body>
</html>
